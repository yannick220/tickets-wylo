principal doit conserver un positionnement cohérent dans le bas de la vue initialement affichée. Sous le visuel, présenter les caractéristiques sur une ligne : genre en gras, puis durée, nationalité et année en graisse normale, séparés par des barres verticales. Harmoniser les marges gauches, tailles, graisses et interlignes sur toutes les fiches comparables. Version de consolidation • PWA iOS & Android 026", "difficulty": "facile"}, {"id": 72, "cat": "Socle / Design System", "title": "Suppression du libellé et positionnement flottant de l’icône « Rejoindre la séance »", "explanation": "Sur les fiches-séance, supprimer le texte « Rejoindre la séance » associé à l’icône et conserver uniquement l’icône cliquable. La positionner en bas à droite, au même emplacement que l’icône « Demander une séance » sur la Home. Elle doit rester flottante et fixe à l’écran pendant le défilement, afin de rester visible et accessible lorsque le contenu de la fiche remonte. Critère de recette : reproduire ce parcours sur iOS et Android, vérifier la lisibilité, la persistance des choix et le retour vers l’écran d’origine. Si une ancienne formulation diffère d’une règle arbitrée au 23 octobre, appliquer cette règle arbitrée, non la formulation historique.", "difficulty": "moyen"}, {"id": 73, "cat": "Socle / Design System", "title": "Affichage de l’horaire selon l’acceptation de l’exploitant", "explanation": "Tant que la demande de séance n’a pas été acceptée par l’exploitant, afficher le nom de la plage horaire demandée, suivi entre parenthèses de ses heures de début et de fin. Dès que l’exploitant accepte la demande, dans tous les autres cas possibles, afficher l’horaire exact retenu, y compris si la séance reste « Sous réserve » parce que la jauge minimale n’est pas encore atteinte. Critère de recette : reproduire ce parcours sur iOS et Android, vérifier la lisibilité, la persistance des choix et le retour vers l’écran d’origine. Si une ancienne formulation diffère d’une règle arbitrée au 23 octobre, appliquer cette règle arbitrée, non la formulation historique.", "difficulty": "facile"}, {"id": 74, "cat": "Socle / Design System", "title": "Suppression de la mention « Tu en fais partie »", "explanation": "Retirer cette mention affichée à la suite du nombre de préinscrits ou d’inscrits d’une séance. Elle alourdit inutilement l’écran pour une information secondaire que l’utilisateur peut déjà déduire intuitivement du contexte. Sur l’écran secondaire « Recherche » : Critère de recette : reproduire ce parcours sur iOS et Android, vérifier la lisibilité, la persistance des choix et le retour vers l’écran d’origine. Si une ancienne formulation diffère d’une règle arbitrée au 23 octobre, appliquer cette règle arbitrée, non la formulation historique.", "difficulty": "moyen"}, {"id": 75, "cat": "Socle / Design System", "title": "Harmonisation des informations sous le titre du fil", "explanation": "Écran secondaire « Ma séance » Reprendre exactement la présentation des informations du film telle qu'elle figurait sur la capture d'écran de référence. Le titre du film peut rester en majuscules, ce qui ne pose aucun problème. En revanche, les informations affichées immédiatement en dessous doivent retrouver leur présentation initiale, notamment avec l'indication de la version du film (VF, VO, VOST, selon le cas). L'objectif est de retrouver une présentation homogène, compacte et fidèle à la maquette de référence. Critère de recette : reproduire ce parcours sur iOS et Android, vérifier la lisibilité, la persistance des choix et le retour vers l’écran d’origine. Si une ancienne formulation diffère d’une règle arbitrée au 23 octobre, appliquer cette règle arbitrée, non la formulation historique. Version de consolidation • PWA iOS & Android 027", "difficulty": "facile"}, {"id": 76, "cat": "Socle / Design System", "title": "Suppression de la barre de progression après confirmation de la séance", "explanation": "Écran secondaire « Ma séance » La barre de progression n'a d'utilité que pendant la phase de préinscription, lorsque le nombre minimal de participants nécessaire à la confirmation de la séance n'est pas encore atteint. Dès que la séance est confirmée, cette barre doit disparaître définitivement. En effet, une fois le seuil minimal atteint, il n'y a plus de progression vers un objectif de confirmation à afficher. Conserver simplement l'indication du nombre d'inscrits sous la forme : « X inscrits sur Y » Où Y correspond à la capacité maximale de la salle et non au seuil minimal de confirmation. Cette information suffit à renseigner l'utilisateur sur le remplissage de la séance. Critère de recette : reproduire ce parcours sur iOS et Android, vérifier la lisibilité, la persistance des choix et le retour vers l’écran d’origine. Si une ancienne formulation diffère d’une règle arbitrée au 23 octobre, appliquer cette règle arbitrée, non la formulation historique.", "difficulty": "facile"}, {"id": 77, "cat": "Socle / Design System", "title": "Maintien des inscriptions jusqu'à la capacité maximale de la salle", "explanation": "Écran secondaire « Ma séance » Une fois la séance confirmée, les inscriptions doivent rester ouvertes sans autre condition que la disponibilité de places dans la salle. Il n'est donc pas nécessaire d'afficher une nouvelle barre de progression ou un quelconque objectif intermédiaire. Le fonctionnement est simple : - Avant confirmation : les utilisateurs se préinscrivent jusqu'à l'atteinte du seuil minimal, avec affichage de la barre de progression. - Après confirmation : les inscriptions continuent normalement, sans barre de progression. - Lorsque la capacité maximale de la salle est atteinte : la séance passe au statut « Pleine » et toute nouvelle inscription devient impossible. Ce fonctionnement doit rester identique dans toutes les fiches de séance, qu'elles soient consultées depuis la recherche ou depuis « Mes séances ». Critère de recette : reproduire ce parcours sur iOS et Android, vérifier la lisibilité, la persistance des choix et le retour vers l’écran d’origine. Si une ancienne formulation diffère d’une règle arbitrée au 23 octobre, appliquer cette règle arbitrée, non la formulation historique.", "difficulty": "moyen"}, {"id": 78, "cat": "Socle / Design System", "title": "Simplification des cartouches de statut sur les vignettes des séances", "explanation": "Écran secondaire « Profil utilisateur » — Liste des séances Certaines vignettes affichent actuellement un cartouche du type « Demande validée ». Cette présentation est à revoir, puisqu'il n'est pas utile de rappeler qu'une séance a été demandée ou validée en tant que demande. L'utilisateur doit avant tout pouvoir identifier les séances auxquelles la personne participe, indépendamment de leur origine. Il faut donc supprimer les indications redondantes liées à la demande elle- même. Si un statut doit être affiché, il doit uniquement renseigner sur l'état réel de la séance, par exemple « En attente de confirmation », « Confirmée » ou « Pleine », en respectant les conventions déjà définies pour WYLO. Critère de recette : reproduire ce parcours sur iOS et Android, vérifier la lisibilité, la persistance des choix et le retour vers l’écran d’origine. Si une ancienne formulation diffère d’une règle arbitrée au 23 octobre, appliquer cette règle arbitrée, non la formulation historique. Structure de la fiche Version de consolidation • PWA iOS & Android 028", "difficulty": "moyen"}, {"id": 79, "cat": "Fiche Séance", "title": "informations du film Écran secondaire « Fiche séance » — Toutes les séances, quel que soit leur statut Revoir", "explanation": "l'organisation verticale des informations de la fiche séance, conformément au visuel de référence, afin de distinguer clairement deux ensembles : les informations relatives à la séance et à ses participants, puis les informations relatives au film. 1. Positionnement du bloc de confirmation dès l'ouverture Lorsqu'une séance est encore en cours de confirmation, le bloc comprenant : - Le titre « Séance en cours de confirmation ». - La barre de progression indiquant l'avancement vers la jauge minimale. - Le nombre de préinscrits. Doit apparaître immédiatement au-dessus du bord inférieur de la zone visible de l'écran secondaire, dès son ouverture, sans nécessiter de défilement. L'utilisateur doit ainsi pouvoir identifier immédiatement l'état de confirmation de la séance. 2. Ordre de découverte des informations au défilement Lorsque l'utilisateur commence à faire défiler la fiche vers le haut, il doit découvrir, quasiment dans la continuité du bloc de confirmation : 1. Les photos de profil des participants, présentées dans leur carrousel horizontal. 2. Les caractéristiques du film : genre, durée, nationalité, année, etc. 3. Les autres informations du film : crédits, synopsis et éléments complémentaires. Les participants doivent donc impérativement apparaître avant les informations détaillées du film. Les espacements entre ces blocs doivent être maîtrisés, sans zone vide excessive. 3. Comportement lorsque la jauge minimale est atteinte Dès que la séance est confirmée : - Le titre « Séance en cours de confirmation » disparaît. - La barre de progression disparaît également. - Le nombre de préinscrits est remplacé par le nombre d'inscrits, conformément au ticket précédent. - Le carrousel des participants reste immédiatement accessible dans la continuité du premier bloc. Lors du défilement, l'utilisateur découvre donc directement les participants, puis les informations sur le film, sans conserver d'espace vide à l'emplacement de l'ancienne barre de progression. Attention : l'atteinte de la jauge minimale signifie que la séance est confirmée, et non qu'elle est pleine. Les inscriptions restent possibles jusqu'à la capacité maximale de la salle. 4. Logique générale de la présentation Cette nouvelle organisation répond à deux objectifs. À vérifier lors de la recette : le comportement décrit doit respecter l’ensemble des arbitrages finaux du cahier (libellés des sept statuts, absence de tarif inventé, présentation des cinémas, droits selon le rôle). Les versions historiques incompatibles ne doivent pas être implémentées simultanément. Participants et relations", "difficulty": "moyen"}, {"id": 80, "cat": "Mon Profil / Amitiés", "title": "Correction de la réciprocité des relations d'amitié et prise en compte des", "explanation": "préinscriptions Écrans secondaires « Mon profil », « Profil utilisateur », « Mes amis » et messageries — Règle fonctionnelle fondamentale de WYLO Une anomalie a été constatée dans la gestion des relations d'amitié entre utilisateurs. Exemple concret : Denis et moi sommes préinscrits à une même séance. Lorsque Denis consulte son profil, j'apparais bien dans sa liste d'amis, ce qui est parfaitement normal puisque nous partageons une séance. En revanche, lorsque je consulte mon propre profil, Denis n'apparaît pas dans ma liste d'amis. Celle- ci est même indiquée comme vide. Il s'agit manifestement d'une incohérence, puisque toute relation d'amitié doit impérativement être réciproque. 1. Rappel de la règle fondamentale de WYLO Dans WYLO, les relations d'amitié ne résultent pas de demandes d'ajout manuelles. Deux utilisateurs deviennent automatiquement amis dès lors qu'ils sont préinscrits ou inscrits à une même séance. Il n'est absolument pas nécessaire que la séance soit confirmée ni qu'elle ait déjà eu lieu. Il faut bien distinguer : - Préinscription : participation à une séance qui n'a pas encore été confirmée. - Inscription : participation à une séance confirmée. Lorsqu'une séance est confirmée, les préinscriptions deviennent automatiquement des inscriptions. Mais cette évolution du statut de la séance ne doit avoir aucune incidence sur la relation d'amitié, qui existe déjà depuis la préinscription commune. 2. Création automatique et réciproque de l'amitié Dès que deux utilisateurs sont préinscrits à une même séance : - Ils deviennent automatiquement amis dans le fonctionnement interne de WYLO. Version de consolidation • PWA iOS & Android 029", "difficulty": "moyen"}, {"id": 81, "cat": "Socle / Design System", "title": "Modifier la séance ou seulement mes billets selon les droits", "explanation": "Si le demandeur est encore seul, qu’aucun autre spectateur n’a rejoint sa demande et qu’aucun cinéma ne l’a acceptée, il peut modifier le cinéma, la date, la version, la plage horaire et ses billets. Dès qu’un tiers est préinscrit ou que l’exploitant a accepté, les caractéristiques communes ne sont plus librement modifiables. Dans les autres cas, « Modifier mes billets » ne doit afficher QUE les informations réellement modifiables : nombre de billets autorisé, impact financier éventuel, puis validation. Les informations immuables du film ou du cinéma sont déjà sur la fiche précédente et ne doivent pas être répétées. Une séance pleine interdit toute augmentation. Les droits doivent être vérifiés côté serveur, pas uniquement par masquage des champs dans l’interface.", "difficulty": "facile"}, {"id": 82, "cat": "Socle / Design System", "title": "Zéro billet : suppression complète de la demande lorsque c’est autorisé", "explanation": "Lorsque le demandeur est seul, que le cinéma n’a pas accepté et qu’aucun autre spectateur n’est inscrit, réduire ses billets à zéro déclenche une confirmation de suppression de la demande. Si l’utilisateur confirme, cette demande disparaît de la base active WYLO et de toutes les vues. Il faut nettoyer les carrousels, notifications, liens, index de recherche et références opérationnelles : la demande ne doit pas rester visible comme une séance passée ou refusée. En pratique, les éventuelles traces techniques ou transactionnelles légalement obligatoires restent archivées hors affichage public ; elles ne doivent pas permettre à l’utilisateur de retrouver une séance supprimée. Cette suppression n’est jamais proposée si un autre participant a déjà rejoint la séance. Partager", "difficulty": "moyen"}, {"id": 83, "cat": "Socle / Design System", "title": "Partager une séance et inviter des amis", "explanation": "Depuis la fiche séance, ouvrir le sous-écran Partager avec les amis : liste de contacts éligibles, sélection simple et action d’invitation. Offrir séparément le partage d’un lien universel par les moyens natifs du téléphone. Le destinataire déjà connecté ouvre la bonne fiche séance ; un destinataire qui n’a pas de compte passe d’abord par l’accès ou l’inscription, puis revient à cette même séance. Préserver l’identifiant stable de la séance et ne pas créer de demande supplémentaire. Ne pas ajouter d’informations superflues dans le sous-écran, la séance étant déjà présentée sur la fiche d’origine. Rejoindre et réserver Version de consolidation • PWA iOS & Android 031", "difficulty": "moyen"}, {"id": 84, "cat": "Socle / Design System", "title": "Rejoindre une séance : parcours et disponibilité", "explanation": "Une personne non inscrite peut rejoindre une séance demandée ou en cours de confirmation en prépayant, et une séance confirmée en payant. Vérifier le nombre de places réellement disponibles et les limitations d’âge, puis seulement créer la participation. Pour une séance à guichets fermés, ne jamais exposer un parcours d’inscription ; la seule action reste Chatter, si l’accès à la conversation est autorisé. La fiche doit distinguer participation, rôle de créateur et statut sans proposer des commandes inapplicables. Billets et contremarque", "difficulty": "facile"}, {"id": 85, "cat": "Fiche Séance", "title": "Contremarque et QR code au bas de la fiche séance", "explanation": "Pour un utilisateur effectivement inscrit, la contremarque et son QR code doivent figurer tout en bas de la fiche, après les informations complémentaires du film et le contenu rétractable éventuel, et non à proximité du haut de la fiche. Privilégier le titre « Ta contremarque » et la phrase d’usage « À échanger contre un billet au guichet de ton cinéma ». Les textes doivent être assez grands pour être lisibles sur smartphone et les marges cohérentes avec les autres blocs. Ne pas laisser un QR code inutilisable après annulation ou refus ; adapter son affichage aux droits et à l’état réel de la réservation. Compléments et contrôles historiques", "difficulty": "moyen"}, {"id": 86, "cat": "Socle / Design System", "title": "Augmentation de la taille des textes de la contremarque", "explanation": "Écran secondaire « Ma séance » Les textes actuellement affichés dans le cartouche contenant le QR code sont beaucoup trop petits. Augmenter leur taille afin qu'ils soient confortablement lisibles sur un écran de téléphone, tout en conservant une hiérarchie visuelle claire entre le titre « Ta contremarque », l'instruction et les informations pratiques. La simplification du contenu demandée dans le ticket précédent doit justement permettre d'agrandir les caractères sans surcharger le cartouche. Critère de recette : reproduire ce parcours sur iOS et Android, vérifier la lisibilité, la persistance des choix et le retour vers l’écran d’origine. Si une ancienne formulation diffère d’une règle arbitrée au 23 octobre, appliquer cette règle arbitrée, non la formulation historique.", "difficulty": "facile"}, {"id": 87, "cat": "Socle / Design System", "title": "Rééquilibrage des espaces entre la contremarque et le synopsis", "explanation": "Écran secondaire « Ma séance » Conserver le cartouche de contremarque en première position, immédiatement après les informations générales du film. En revanche, augmenter l'espace vertical entre ce cartouche et le synopsis, actuellement trop rapprochés. Il faut retrouver une véritable respiration visuelle entre ces deux blocs afin de mieux distinguer les informations pratiques de la séance et la présentation du film. L'objectif n'est pas d'augmenter systématiquement tous les espacements, mais de mieux hiérarchiser les différentes sections. Critère de recette : reproduire ce parcours sur iOS et Android, vérifier la lisibilité, la persistance des choix et le retour vers l’écran d’origine. Si une ancienne formulation diffère d’une règle arbitrée au 23 octobre, appliquer cette règle arbitrée, non la formulation historique. Version de consolidation • PWA iOS & Android 032", "difficulty": "facile"}, {"id": 88, "cat": "Socle / Design System", "title": "Correction de l'intitulé « Modifier mes billets »", "explanation": "Écran secondaire « Modifier les billets » Lorsqu'un utilisateur ouvre sa propre réservation pour modifier le nombre de billets, l'intitulé affiché doit être : « Modifier mes billets » Et non « Modifier ses billets ». L'application s'adresse directement à l'utilisateur connecté. Il faut donc employer systématiquement la première personne lorsqu'il agit sur ses propres réservations. Cette convention doit être respectée dans tous les écrans similaires. Critère de recette : reproduire ce parcours sur iOS et Android, vérifier la lisibilité, la persistance des choix et le retour vers l’écran d’origine. Si une ancienne formulation diffère d’une règle arbitrée au 23 octobre, appliquer cette règle arbitrée, non la formulation historique. Partager", "difficulty": "facile"}, {"id": 89, "cat": "Socle / Design System", "title": "Simplification de l'écran secondaire de partage d'une séance", "explanation": "Écran secondaire « Partager » L'écran qui s'ouvre lorsqu'on souhaite partager une séance contient actuellement beaucoup trop de texte. Il faut le simplifier radicalement pour ne conserver que les éléments indispensables. Présentation attendue : Un titre, positionné selon la convention commune des écrans secondaires : « Inviter mes amis à la séance » Sous ce titre, une seule phrase explicative : « Partage cette séance avec tes amis par SMS, WhatsApp, e-mail ou sur tes réseaux sociaux. » Puis, en bas du cartouche, un bouton : « Partager le lien » Ce bouton doit ouvrir le dispositif de partage du téléphone afin de permettre à l'utilisateur de transmettre le lien de la séance en dehors de WYLO. Il n'est pas nécessaire d'afficher le lien lui-même dans le cartouche. Supprimer tous les autres textes explicatifs, notamment ceux qui répètent inutilement le fonctionnement du partage. Objectif : un écran secondaire compact, immédiatement compréhensible, composé uniquement d'un titre, d'une phrase explicative et d'un bouton d’action. Critère de recette : reproduire ce parcours sur iOS et Android, vérifier la lisibilité, la persistance des choix et le retour vers l’écran d’origine. Si une ancienne formulation diffère d’une règle arbitrée au 23 octobre, appliquer cette règle arbitrée, non la formulation historique.", "difficulty": "facile"}, {"id": 90, "cat": "Socle / Design System", "title": "Ajustement des espacements sur l'écran de partage", "explanation": "Écran secondaire « Partager » Les différents blocs de l'écran de partage sont actuellement trop rapprochés, ce qui nuit à la lisibilité. Il faut rétablir des espacements cohérents entre le titre, le texte explicatif et le bouton d'action. La hauteur de ce cartouche doit être adaptée à son contenu désormais simplifié : il ne doit pas occuper inutilement une grande partie de l'écran. Respecter également les règles déjà définies concernant la position des titres, les marges horizontales et les espacements inférieurs sur tous les écrans secondaires. Il s'agit d'appliquer les conventions graphiques communes à WYLO, et non de créer une mise en page spécifique pour cet écran. Critère de recette : reproduire ce parcours sur iOS et Android, vérifier la lisibilité, la persistance des choix et le retour vers l’écran d’origine. Si une ancienne formulation diffère d’une règle arbitrée au 23 octobre, appliquer cette règle arbitrée, non la formulation historique. Billets et contremarque Version de consolidation • PWA iOS & Android 033", "difficulty": "facile"}, {"id": 91, "cat": "Socle / Design System", "title": "Écran secondaire « Ma séance » — Séance avec inscription Actuellement, le cartouche contenant le QR code et", "explanation": "la contremarque apparaît au milieu de la fiche séance, interrompant la lecture des informations. Il faut systématiquement positionner ce cartouche tout en bas de la fiche, après l'ensemble des informations concernant la séance, les participants et le film. La fiche doit donc respecter l'ordre suivant : 1. Informations sur la séance : date, horaire, cinéma, tarif, état de confirmation et nombre d'inscrits. 2. Participants : carrousel des photos de profil. 3. Informations sur le film : genre, durée, nationalité, année, crédits et synopsis. 4. Contremarque : cartouche contenant le QR code et les informations de réservation. Pourquoi ce changement ? 1. Fluidifier la lecture de la fiche Ce positionnement permet de regrouper les informations de manière cohérente et de conserver une lecture continue. L'utilisateur découvre d'abord les informations relatives à la séance, puis ses participants, avant d'accéder aux informations détaillées du film. Le QR code ne vient plus interrompre cette progression. 2. Faciliter l'accès au QR code au moment de son utilisation Contrairement à ce que l'on pourrait penser, un QR code placé au milieu d'une fiche n'est pas nécessairement plus facile à retrouver. Lorsqu'un utilisateur doit présenter son QR code au guichet du cinéma, il est beaucoup plus simple et intuitif d'effectuer un grand geste de balayage pour atteindre directement le bas de la fiche, plutôt que de devoir faire défiler délicatement le contenu pour retrouver un élément situé quelque part au milieu. Le bas de la fiche devient ainsi un emplacement fixe et prévisible : l'utilisateur sait toujours où retrouver sa contremarque. D'autant que les fiches WYLO contiennent relativement peu d'informations. Même en plaçant le QR code à la fin, la distance à parcourir reste très limitée. Présentation attendue Conserver la présentation du cartouche précédemment définie : « Ta contremarque » « À échanger contre un billet au guichet de ton cinéma. » Puis le QR code et les informations pratiques associées. Respecter les espacements avec le bloc précédent ainsi que la marge inférieure commune à tous les écrans secondaires. À vérifier lors de la recette : le comportement décrit doit respecter l’ensemble des arbitrages finaux du cahier (libellés des sept statuts, absence de tarif inventé, présentation des cinémas, droits selon le rôle). Les versions historiques incompatibles ne doivent pas être implémentées simultanément. Modifier et supprimer", "difficulty": "moyen"}, {"id": 92, "cat": "Socle / Design System", "title": "Modification complète d’une séance par son créateur seul", "explanation": "Autoriser le demandeur à modifier le cinéma, la date, la version, la plage horaire et son nombre de billets tant qu’aucun autre spectateur n’a rejoint la séance et que l’exploitant ne l’a pas acceptée. Le nombre de billets peut alors augmenter ou diminuer. L’interface Modifier mes billets doit supprimer tous les champs non modifiables dans la situation considérée et ne pas afficher de résumé superflu. Justification et critère de contrôle : ce point figurait dans un cahier de développement antérieur mais n’est pas suffisamment explicité dans les tickets récents. L’examiner dans son écran et son sous-écran, avec un scénario réel et les droits liés au statut de la séance. Si sa formulation antérieure diverge de la décision du 23 octobre, cette dernière prévaut.", "difficulty": "facile"}, {"id": 93, "cat": "Socle / Design System", "title": "Suppression d’une demande par réduction à zéro billet", "explanation": "Dans le cas d’un créateur encore seul et d’une séance non acceptée, permettre de saisir zéro billet dans « Modifier ». Afficher une confirmation de suppression après validation, sans ajouter de bouton « Supprimer » indépendant. L’interface Modifier mes billets doit supprimer tous les champs non modifiables dans la situation considérée et ne pas afficher de résumé superflu. Version de consolidation • PWA iOS & Android 034", "difficulty": "facile"}, {"id": 94, "cat": "Socle / Design System", "title": "Suppression complète des références à une séance annulée", "explanation": "Après suppression confirmée, retirer la séance de tous les écrans, résultats, carrousels et liens internes. Supprimer également les notifications d’annonce devenues inutiles chez les amis. L’interface Modifier mes billets doit supprimer tous les champs non modifiables dans la situation considérée et ne pas afficher de résumé superflu. Justification et critère de contrôle : ce point figurait dans un cahier de développement antérieur mais n’est pas suffisamment explicité dans les tickets récents. L’examiner dans son écran et son sous-écran, avec un scénario réel et les droits liés au statut de la séance. Si sa formulation antérieure diverge de la décision du 23 octobre, cette dernière prévaut.", "difficulty": "facile"}, {"id": 95, "cat": "Socle / Design System", "title": "Restriction des modifications après l’arrivée d’un participant", "explanation": "Dès qu’un autre spectateur rejoint la séance, interdire au créateur toute modification du cinéma, de la date, de la version ou de la plage horaire. Autoriser uniquement l’augmentation de ses billets personnels, sans diminution ni suppression de séance. L’interface Modifier mes billets doit supprimer tous les champs non modifiables dans la situation considérée et ne pas afficher de résumé superflu. Justification et critère de contrôle : ce point figurait dans un cahier de développement antérieur mais n’est pas suffisamment explicité dans les tickets récents. L’examiner dans son écran et son sous-écran, avec un scénario réel et les droits liés au statut de la séance. Si sa formulation antérieure diverge de la décision du 23 octobre, cette dernière prévaut.", "difficulty": "facile"}, {"id": 96, "cat": "Socle / Design System", "title": "Édition limitée après acceptation de l’exploitant", "explanation": "Lorsqu’une séance est acceptée mais pas encore confirmée, limiter l’édition du créateur au seul champ « Nombre de places », uniquement à la hausse. Conserver les actions d’invitation et de discussion. L’interface Modifier mes billets doit supprimer tous les champs non modifiables dans la situation considérée et ne pas afficher de résumé superflu. Justification et critère de contrôle : ce point figurait dans un cahier de développement antérieur mais n’est pas suffisamment explicité dans les tickets récents. L’examiner dans son écran et son sous-écran, avec un scénario réel et les droits liés au statut de la séance. Si sa formulation antérieure diverge de la décision du 23 octobre, cette dernière prévaut.", "difficulty": "facile"}, {"id": 97, "cat": "Socle / Design System", "title": "Modification des billets par un participant non créateur", "explanation": "Permettre à un utilisateur ayant rejoint la séance d’un tiers d’augmenter uniquement ses propres billets avant confirmation, sous réserve des places disponibles. Lui interdire toute modification des caractéristiques de la séance. L’interface Modifier mes billets doit supprimer tous les champs non modifiables dans la situation considérée et ne pas afficher de résumé superflu. Justification et critère de contrôle : ce point figurait dans un cahier de développement antérieur mais n’est pas suffisamment explicité dans les tickets récents. L’examiner dans son écran et son sous-écran, avec un scénario réel et les droits liés au statut de la séance. Si sa formulation antérieure diverge de la décision du 23 octobre, cette dernière prévaut. Version de consolidation • PWA iOS & Android 035", "difficulty": "facile"}, {"id": 98, "cat": "Fiche Cinéma", "title": "Fiche cinéma : identité, deux actions et activité", "explanation": "Chaque établissement référencé dispose d’une fiche reprenant le format général des profils utilisateurs : grand arrière-plan photographique lorsqu’il existe, nom du cinéma, ville, actions puis carrousels de séances. Actions principales : Ajouter à mes cinémas / Retirer de mes cinémas, et Discuter si le cinéma dispose d’un compte WYLO Pro actif. Une fiche peut exister avant qu’un exploitant ne devienne partenaire ; elle ne doit pas simuler une messagerie active. L’activité est distribuée en six carrousels par état de séance, avec affiches de films verticales. Les rubriques vides disparaissent et chaque vignette ouvre la séance concernée. Informations WYLO Pro", "difficulty": "moyen"}, {"id": 99, "cat": "Socle / Design System", "title": "Tarif et délai de programmation, sans inventaire des salles", "explanation": "La fiche cinéma présente prioritairement le tarif WYLO applicable et les délais minimaux de programmation communiqués par l’exploitant. Si le prix dépend du jour ou de la plage horaire, ne pas le présenter comme un montant universel. Supprimer de cette fiche le nombre de salles, leurs numéros et les capacités de fauteuils. Un exploitant peut déplacer une projection dans une autre salle selon sa fréquentation ; ces détails sont utiles à WYLO Pro, pas comme engagement public affiché sur la fiche. Les informations éventuelles sur l’accueil de certaines catégories de films doivent reprendre exactement les champs réellement déclarés par le cinéma, sans inventer une promesse d’acceptation. Identité et activité", "difficulty": "facile"}, {"id": 100, "cat": "Fiche Cinéma", "title": "Cinéma non partenaire : photographie générique et mention courte", "explanation": "Les établissements nationaux non partenaires demeurent consultables dans les profils, et peuvent être ajoutés aux favoris. S’ils n’ont aucune photo fournie, utiliser une image générique plutôt qu’un espace visuel vide. Afficher sous leur nom une mention brève : « Pas encore partenaire de WYLO ». Ne présenter ni tarif, ni délai, ni nombre de places inventés. L’accès Discuter ne doit pas ouvrir une conversation dont aucun exploitant ne peut recevoir les messages. La fiche doit permettre à l’utilisateur de retirer ce cinéma de ses préférences, même s’il n’a jamais organisé de séance via WYLO. Navigation Version de consolidation • PWA iOS & Android 037", "difficulty": "moyen"}, {"id": 101, "cat": "Fiche Séance", "title": "Accès aux cinémas par une petite vignette sur la fiche séance", "explanation": "Placer en haut à gauche de chaque fiche séance une petite vignette horizontale 16:9 du cinéma, à la même hauteur que le bouton de profil habituel mais naturellement plus large. Elle ouvre directement la fiche du cinéma sans perdre l’état de la séance. Ne pas inscrire le nom du cinéma sous cette petite vignette. Le nom figure déjà sous le titre du film dans le bloc d’informations de la séance. Dans les grandes vignettes utilisées ailleurs, le nom peut en revanche être intégré dans un cartouche photographique.", "difficulty": "moyen"}, {"id": 102, "cat": "Home", "title": "« Rechercher » et préremplissage intelligent du film Écrans « Home », « Rechercher » et « Demander une", "explanation": "séance » — Navigation et comportement fonctionnel 1. Maintien du bouton flottant au-dessus de l'écran « Rechercher » Actuellement, lorsque l'utilisateur ouvre l'écran secondaire « Rechercher », le bouton rouge « Demander une séance », présent sur la Home, n'est plus accessible. Il faut impérativement que ce bouton reste visible et cliquable au-dessus de l'écran secondaire « Rechercher ». L'effet recherché est exactement celui déjà défini pour les autres boutons flottants de WYLO : - Le bouton « Demander une séance » conserve sa position habituelle, en bas à droite. - Il conserve ses dimensions, son icône et sa présentation graphique. - L'écran secondaire « Rechercher » vient se déployer en dessous de ce bouton, qui reste au premier plan. - Le bouton ne doit pas suivre le défilement du contenu de recherche. - Il doit rester accessible à tout moment pendant la consultation des résultats. Visuellement, l'utilisateur doit avoir l'impression que le bouton de la Home est resté parfaitement immobile pendant que l'écran « Rechercher » s'est ouvert derrière lui. 2. Accès direct à « Demander une séance » depuis « Rechercher » Ce positionnement répond à un besoin fonctionnel important. Lorsqu'un utilisateur recherche un film, WYLO lui présente les différentes séances existantes correspondant à ses critères. Mais il est tout à fait possible qu'aucune de ces séances ne lui convienne, notamment en raison de leur ville, de leur cinéma, de leur date ou de leur horaire. Il doit alors pouvoir demander une nouvelle séance sans quitter sa recherche. Un clic sur le bouton flottant « Demander une séance » doit donc ouvrir directement un nouvel écran secondaire « Demander une séance », superposé à l'écran « Rechercher ». L'utilisateur peut ainsi passer naturellement de la consultation des séances existantes à la création de sa propre demande. 3. Préremplissage automatique lorsqu'un seul film est identifié C'est le point essentiel de cette modification. Lorsque la recherche permet d'identifier un seul film, celui-ci doit être automatiquement renseigné dans le formulaire « Demander une séance ». Par exemple : L'utilisateur saisit « Fractal » dans le moteur de recherche. WYLO lui présente plusieurs séances de ce film, éventuellement dans différents cinémas et à différentes dates. Aucune de ces séances ne lui convient. À vérifier lors de la recette : le comportement décrit doit respecter l’ensemble des arbitrages finaux du cahier (libellés des sept statuts, absence de tarif inventé, présentation des cinémas, droits selon le rôle). Les versions historiques incompatibles ne doivent pas être implémentées simultanément. Version de consolidation • PWA iOS & Android 038", "difficulty": "moyen"}, {"id": 103, "cat": "Fiche Cinéma", "title": "Formulaire de demande : cinéma obligatoirement partenaire", "explanation": "Lors de la création d’une séance, le sélecteur Cinéma ne propose que les établissements effectivement partenaires de WYLO et habilités à recevoir des demandes. Il ne reprend pas mécaniquement tous les cinémas du référentiel national utilisés dans Mon compte. Un cinéma non partenaire peut être enregistré en favori, mais il est impossible de lui transmettre une demande dans le formulaire et de laisser croire qu’un exploitant la recevra. Les données « ville », « cinéma » et « tarif » doivent rester liées à l’établissement réellement sélectionné. Le visuel de sélection du cinéma est une vignette photographique horizontale 16:9, avec son nom dans un cartouche discret lorsqu’elle a une taille suffisante.", "difficulty": "facile"}, {"id": 104, "cat": "Fiche Film", "title": "Préremplissage selon le point d’entrée Depuis une fiche film, ouvrir Demander une séance avec le film déjà sélectionné. Depuis une fiche cinéma,", "explanation": "présélectionner le cinéma, sa ville et le tarif WYLO déterminable ; le film reste à choisir. Depuis Rechercher, un résultat portant sur un unique film distinct peut préremplir ce film, mais pas une recherche comportant plusieurs films différents. Depuis la Home ou Mon profil, ne présélectionner aucun film ni cinéma. Les valeurs présélectionnées restent modifiables ; un changement de cinéma recalcule ville, conditions et tarif, sans laisser un prix appartenant à l’ancien établissement. Les vignettes de films à sélectionner apparaissent sous le titre du sous-écran, au-dessus du champ textuel, seulement après une recherche, sauf lorsqu’un film est transmis depuis une fiche. Règles du formulaire", "difficulty": "moyen"}, {"id": 105, "cat": "Socle / Design System", "title": "Conseil relatif à la VO : uniquement lors de la première demande", "explanation": "Le conseil comparant une séance en version originale à d’autres versions doit apparaître uniquement à l’occasion de la toute première demande concernée. Il ne doit pas revenir à chaque nouvelle demande ni encombrer durablement le formulaire. Le cartouche doit se fermer simplement et préserver les informations déjà saisies. Mémoriser le fait que ce conseil a déjà été vu pour éviter les répétitions entre sessions.", "difficulty": "facile"}, {"id": 106, "cat": "Socle / Design System", "title": "Nombre de places, plage nuit et saisie accessible", "explanation": "Ne pas réintroduire la limite historique de huit billets. Autoriser la saisie d’une quantité demandée dans les limites métier réelles, avec vérification du nombre de places disponibles lorsque la salle est connue. Conserver la plage « Nuit », commençant à 22h00 et se terminant à 8h00 ; vérifier qu’elle apparaît dans tous les sélecteurs concernés. Quand le clavier numérique s’ouvre pour saisir le nombre de places, ce champ doit demeurer au-dessus du clavier et ne pas se refermer prématurément. Version de consolidation • PWA iOS & Android 039", "difficulty": "moyen"}, {"id": 107, "cat": "Socle / Design System", "title": "Suppression de la limite de huit places Supprimer le plafond actuel de huit places lors d’une demande de séance ou de l’inscription à une séance", "explanation": "existante. Permettre à l’utilisateur de saisir librement le nombre de places souhaitées, y compris des quantités importantes, par exemple 50 places, sans imposer le moindre plafond arbitraire. La seule limite est la capacité totale d ela salle enregistrée par l’exploitant. Sur l’écran secondaire « séance » : Critère de recette : reproduire ce parcours sur iOS et Android, vérifier la lisibilité, la persistance des choix et le retour vers l’écran d’origine. Si une ancienne formulation diffère d’une règle arbitrée au 23 octobre, appliquer cette règle arbitrée, non la formulation historique.", "difficulty": "facile"}, {"id": 108, "cat": "Fiche Film", "title": "Préremplissage de la demande depuis une fiche film", "explanation": "Écran secondaire « Demander une séance » Lorsqu'un utilisateur demande une séance depuis la fiche d'un film, le formulaire doit s'ouvrir avec les informations du film déjà renseignées. Il faut notamment retrouver automatiquement : - Le titre du film. - Son affiche. - Les informations associées au film déjà connues par WYLO. L'utilisateur ne doit pas avoir à rechercher ou sélectionner de nouveau le film depuis lequel il vient d'effectuer sa demande. Attention également à conserver la présentation habituelle des écrans secondaires : titre, filet horizontal à droite, typographie, dimensions et espacements. Il ne doit pas exister de différence graphique entre une demande initiée depuis la Home et une demande initiée depuis une fiche film. Critère de recette : reproduire ce parcours sur iOS et Android, vérifier la lisibilité, la persistance des choix et le retour vers l’écran d’origine. Si une ancienne formulation diffère d’une règle arbitrée au 23 octobre, appliquer cette règle arbitrée, non la formulation historique.", "difficulty": "moyen"}, {"id": 109, "cat": "Socle / Design System", "title": "Vérification de la disponibilité de la plage horaire « Nuit »", "explanation": "Écran secondaire « Demander une séance » — Plages horaires La plage horaire « Nuit » n'apparaît actuellement pas dans les propositions disponibles. Or, les plages horaires initialement définies pour WYLO incluent bien une plage nocturne, de 22 h à 8 h. Il faut donc vérifier pourquoi elle n'est pas proposée. Deux situations sont possibles : - La plage « Nuit » a été oubliée dans l'interface : il faut alors la rétablir. - Elle est volontairement masquée parce que le cinéma sélectionné ne propose pas de séances nocturnes : il faut alors vérifier que cette exclusion repose bien sur une règle fonctionnelle explicite. L'absence de cette plage horaire ne doit pas résulter d'un oubli ou d'une incohérence d’affichage. Critère de recette : reproduire ce parcours sur iOS et Android, vérifier la lisibilité, la persistance des choix et le retour vers l’écran d’origine. Si une ancienne formulation diffère d’une règle arbitrée au 23 octobre, appliquer cette règle arbitrée, non la formulation historique. Version de consolidation • PWA iOS & Android 040", "difficulty": "moyen"}, {"id": 110, "cat": "Socle / Design System", "title": "Suppression de la date redondante dans le volet « Plage horaire »", "explanation": "Écran secondaire « Demander une séance » Lorsqu'une date a été sélectionnée, elle apparaît correctement dans le bouton récapitulatif correspondant, par exemple « Mercredi 18 novembre ». Cependant, cette même date est de nouveau affichée dans le volet « Plage horaire », entre le titre de la rubrique et les différents boutons de sélection. Cette répétition est inutile. Supprimer cette deuxième occurrence de la date. Le volet « Plage horaire » doit uniquement présenter son titre et les différentes plages proposées. La date sélectionnée reste visible dans la rubrique précédente, ce qui suffit à contextualiser le choix de l'utilisateur. L'objectif est de supprimer les redondances et d'alléger l’interface. Critère de recette : reproduire ce parcours sur iOS et Android, vérifier la lisibilité, la persistance des choix et le retour vers l’écran d’origine. Si une ancienne formulation diffère d’une règle arbitrée au 23 octobre, appliquer cette règle arbitrée, non la formulation historique.", "difficulty": "difficile"}, {"id": 111, "cat": "Demander une séance", "title": "Refonte de la présentation du tarif de la place Écran secondaire « Demander une séance » Le tarif de la place est actuellement présenté comme une", "explanation": "information isolée, sans respecter la structure graphique des autres champs du formulaire. Il faut lui donner exactement la même présentation que les autres rubriques. Présentation attendue : Un titre « Tarif de la place », avec la même typographie, la même taille, le même positionnement et le même filet horizontal que les rubriques « Version », « Cinéma » ou « Date ». En dessous, un bouton ou cartouche affichant le tarif correspondant au cinéma sélectionné. Ce tarif doit apparaître automatiquement dès qu'un cinéma a été choisi, lorsque l'information est disponible. Particularité importante : contrairement aux autres champs, ce cartouche est strictement informatif. L'utilisateur ne doit pas pouvoir modifier manuellement le tarif. Il doit donc reprendre l'apparence générale des champs de WYLO sans laisser croire qu'il s'agit d'une sélection modifiable. Critère de recette : reproduire ce parcours sur iOS et Android, vérifier la lisibilité, la persistance des choix et le retour vers l’écran d’origine. Si une ancienne formulation diffère d’une règle arbitrée au 23 octobre, appliquer cette règle arbitrée, non la formulation historique.", "difficulty": "moyen"}, {"id": 112, "cat": "Socle / Design System", "title": "Harmonisation des espacements dans les formulaires", "explanation": "Écran secondaire « Demander une séance » — Règle globale Les espacements verticaux entre les différentes rubriques du formulaire ne sont actuellement pas réguliers. Certaines rubriques sont très rapprochées, tandis que d'autres présentent des espaces sensiblement plus importants, sans justification particulière. Il faut harmoniser les distances entre tous les blocs du formulaire. Cela concerne notamment les rubriques « Version », « Cinéma », « Date », « Plage horaire », « Tarif de la place » et « Places ». Les espacements entre les titres et leurs champs doivent également être cohérents. L'objectif est de définir une grille de mise en page commune et de l'appliquer systématiquement, plutôt que de procéder à des ajustements indépendants pour chaque rubrique. Critère de recette : reproduire ce parcours sur iOS et Android, vérifier la lisibilité, la persistance des choix et le retour vers l’écran d’origine. Si une ancienne formulation diffère d’une règle arbitrée au 23 octobre, appliquer cette règle arbitrée, non la formulation historique. Version de consolidation • PWA iOS & Android 041", "difficulty": "moyen"}, {"id": 113, "cat": "Socle / Design System", "title": "Correction de l'affichage du clavier dans le champ « Places »", "explanation": "Écran secondaire « Demander une séance » Lorsque l'utilisateur sélectionne le champ permettant d'indiquer le nombre de places, le clavier du téléphone s'ouvre actuellement par-dessus le champ de saisie. Cela gêne la lecture et la modification du nombre saisi. Comme déjà demandé pour les autres champs des écrans secondaires, le clavier ne doit jamais masquer le champ actif. Il faut que la partie utile du formulaire remonte automatiquement pour rester visible au-dessus du clavier. En revanche, cette adaptation ne doit pas modifier la hauteur générale de l'écran secondaire, qui doit conserver ses dimensions de référence. Les éléments devant rester fixes doivent conserver leur position, tandis que le contenu défilant doit s'adapter à l'espace disponible. Se référer au ticket précédent concernant la gestion du clavier et le comportement des contenus dans les écrans secondaires. Critère de recette : reproduire ce parcours sur iOS et Android, vérifier la lisibilité, la persistance des choix et le retour vers l’écran d’origine. Si une ancienne formulation diffère d’une règle arbitrée au 23 octobre, appliquer cette règle arbitrée, non la formulation historique.", "difficulty": "moyen"}, {"id": 114, "cat": "Socle / Design System", "title": "Correction de la fermeture prématurée du champ « Places »", "explanation": "Écran secondaire « Demander une séance » Une anomalie a été constatée lors de la saisie du nombre de places. Lorsqu'on saisit un premier chiffre, par exemple « 2 », le champ semble parfois se refermer automatiquement et valider immédiatement cette valeur. Cela empêche de poursuivre naturellement la saisie d'un nombre à plusieurs chiffres, par exemple « 22 », sans rouvrir le champ. Ce comportement doit être vérifié et corrigé. La saisie d'un chiffre ne doit jamais entraîner automatiquement la fermeture du champ tant que l'utilisateur n'a pas explicitement terminé son action. Il doit pouvoir saisir plusieurs chiffres consécutifs, les corriger et les effacer librement. La validation doit intervenir uniquement à l'issue de la saisie, et non dès la première frappe. Critère de recette : reproduire ce parcours sur iOS et Android, vérifier la lisibilité, la persistance des choix et le retour vers l’écran d’origine. Si une ancienne formulation diffère d’une règle arbitrée au 23 octobre, appliquer cette règle arbitrée, non la formulation historique.", "difficulty": "moyen"}, {"id": 115, "cat": "Socle / Design System", "title": "Correction du libellé relatif au nombre de places", "explanation": "Écran secondaire « Demander une séance » Le texte affiché après la sélection du nombre de places présente actuellement un problème de formulation et parfois d'accord grammatical. Il faut notamment distinguer correctement le singulier du pluriel. Par ailleurs, la formulation « Places réservées » est inadaptée à ce stade, puisque l'utilisateur n'a pas encore finalisé sa réservation. Proposition de formulation : - « 1 place à réserver » - « 2 places à réserver » - « 3 places à réserver » Cette formulation est plus précise et évite de laisser penser que les places sont déjà définitivement réservées. Elle doit être actualisée automatiquement en fonction du nombre saisi. Critère de recette : reproduire ce parcours sur iOS et Android, vérifier la lisibilité, la persistance des choix et le retour vers l’écran d’origine. Si une ancienne formulation diffère d’une règle arbitrée au 23 octobre, appliquer cette règle arbitrée, non la formulation historique. Choix du film et du cinéma Version de consolidation • PWA iOS & Android 042", "difficulty": "moyen"}, {"id": 116, "cat": "Demander une séance", "title": "Écran secondaire « Demander une séance » — Recherche et sélection d'un film Le fonctionnement de", "explanation": "recherche des films doit être strictement identique à celui de l'écran secondaire « Rechercher ». Actuellement, des vignettes de films peuvent être présentées dès l'ouverture du formulaire, alors que l'utilisateur n'a encore effectué aucune recherche. Il faut supprimer cet affichage systématique. Comportement attendu Lorsque l'utilisateur ouvre « Demander une séance » depuis la Home : - Aucune vignette de film n'est affichée initialement. - Le champ de recherche est disponible. - Dès qu'il commence à saisir un titre ou un autre critère textuel pris en charge, les films correspondants apparaissent. - Les propositions s'actualisent au fur et à mesure de la saisie. - L'utilisateur sélectionne ensuite le film pour lequel il souhaite demander une séance. Une fois le film sélectionné, sa vignette et son titre doivent rester affichés conformément à la présentation du formulaire. Exception importante : lorsqu'un utilisateur ouvre « Demander une séance » directement depuis une fiche film, le titre et l'affiche de ce film doivent naturellement être déjà renseignés, comme défini dans les tickets précédents. Dans ce cas, il n'est pas nécessaire de lui demander de rechercher de nouveau un film qu'il vient de sélectionner. Objectif : adopter un fonctionnement cohérent entre les deux parcours, sans affichage inutile d'un catalogue de films avant toute recherche. --- À vérifier lors de la recette : le comportement décrit doit respecter l’ensemble des arbitrages finaux du cahier (libellés des sept statuts, absence de tarif inventé, présentation des cinémas, droits selon le rôle). Les versions historiques incompatibles ne doivent pas être implémentées simultanément. Règles du formulaire", "difficulty": "moyen"}, {"id": 117, "cat": "Socle / Design System", "title": "Conseil ponctuel sur la version originale Afficher uniquement lors de la première demande en VO un petit cartouche expliquant qu’une séance en VO", "explanation": "risque d’être plus difficile à remplir qu’en VOST. Le cartouche doit se fermer en touchant l’extérieur et ne plus encombrer les demandes suivantes. Justification et critère de contrôle : ce point figurait dans un cahier de développement antérieur mais n’est pas suffisamment explicité dans les tickets récents. L’examiner dans son écran et son sous-écran, avec un scénario réel et les droits liés au statut de la séance. Si sa formulation antérieure diverge de la décision du 23 octobre, cette dernière prévaut. Version de consolidation • PWA iOS & Android 043", "difficulty": "facile"}, {"id": 118, "cat": "Mon Profil / Amitiés", "title": "Mon profil : mes séances avant mes amis", "explanation": "Le profil personnel présente prioritairement Mes séances : demandes créées et séances rejointes doivent figurer ensemble dans le parcours d’activité, quelle que soit leur origine. Ses amis viennent ensuite. Les séances sont regroupées selon leurs états applicables et classées chronologiquement. Les séances refusées restent consultables à titre d’historique, contrairement aux demandes supprimées par leur créateur lorsqu’il était seul. L’écran offre les accès à Notifications et Modifier mon compte. La pastille rouge de Notifications doit être synchronisée avec celle de l’avatar de la Home. Mes amis", "difficulty": "moyen"}, {"id": 119, "cat": "Socle / Design System", "title": "Mes amis : grille en cinq colonnes et recherche à vérifier", "explanation": "La liste développée Mes amis doit présenter cinq colonnes d’avatars circulaires, avec le prénom sous chacun. Le carrousel compact du profil peut ouvrir cette vue complète. L’utilisateur ne dispose actuellement pas d’un nombre suffisant d’amis pour tester correctement ce comportement. Marquer explicitement ce ticket « à vérifier en conditions de liste dense » et prévoir un jeu d’essai suffisamment fourni. Une recherche par nom ou prénom a été envisagée pour les listes longues ; la décision de l’exposer systématiquement doit être confirmée à partir des tests. Compléments et contrôles historiques", "difficulty": "moyen"}, {"id": 120, "cat": "Mon Profil / Amitiés", "title": "Confirmation de la déconnexion Après un appui sur « Se déconnecter », en bas de l’écran Profil, afficher une fenêtre de confirmation contenant", "explanation": "le message « Êtes-vous sûr de vouloir vous déconnecter ? », avec les boutons « Annuler » et « Se déconnecter ». La déconnexion doit intervenir uniquement après un appui sur le bouton de confirmation « Se déconnecter ». Le bouton « Annuler » ferme la fenêtre et maintient l’utilisateur connecté. Critère de recette : reproduire ce parcours sur iOS et Android, vérifier la lisibilité, la persistance des choix et le retour vers l’écran d’origine. Si une ancienne formulation diffère d’une règle arbitrée au 23 octobre, appliquer cette règle arbitrée, non la formulation historique.", "difficulty": "moyen"}, {"id": 121, "cat": "Mon Profil / Amitiés", "title": "Affichage de la pastille de notification sur l’écran Profil", "explanation": "Sur l’écran secondaire « Profil », afficher une pastille rouge sur le bouton Notifications lorsque de nouvelles notifications sont à consulter. Cette pastille doit être synchronisée avec celle du bouton Profil de la Home, afin de guider l’utilisateur jusqu’aux notifications concernées. Actuellement, seule la pastille de la Home apparaît. Sur l’écran secondaire « Editer mon compte » : Version de consolidation • PWA iOS & Android 044", "difficulty": "moyen"}, {"id": 122, "cat": "Socle / Design System", "title": "Regroupement de toutes les séances d'un utilisateur", "explanation": "Écran secondaire « Profil utilisateur » La rubrique actuellement intitulée « Ses séances créées » n'est pas pertinente. En effet, il n'y a aucune raison de distinguer les séances selon qu'elles ont été demandées par l'utilisateur ou par quelqu'un d'autre. Remplacer cette rubrique par : « Ses séances ». Cette rubrique doit regrouper toutes les séances auxquelles l'utilisateur participe, qu'il soit ou non à l'origine de la demande. Elle doit également inclure les séances en attente de confirmation et les séances confirmées, sans les séparer en plusieurs rubriques. L'objectif est d'avoir une liste unique, simple et exhaustive de ses séances. Critère de recette : reproduire ce parcours sur iOS et Android, vérifier la lisibilité, la persistance des choix et le retour vers l’écran d’origine. Si une ancienne formulation diffère d’une règle arbitrée au 23 octobre, appliquer cette règle arbitrée, non la formulation historique.", "difficulty": "moyen"}, {"id": 123, "cat": "Mon Profil / Amitiés", "title": "Ajout de la liste des amis sur les profils utilisateurs", "explanation": "Écran secondaire « Profil utilisateur » En complément de la rubrique « Ses séances », ajouter une rubrique permettant de consulter la liste des amis de l’utilisateur. Cette liste doit rester accessible même lorsque l'utilisateur dont on consulte le profil ne fait pas partie de nos propres amis. Dans ce cas, la consultation doit rester strictement informative, sans possibilité d'interagir directement avec les profils affichés depuis cette liste. L'objectif est de permettre à chacun de découvrir les relations d'un utilisateur et d'identifier d'éventuelles connaissances communes. Cette information peut notamment aider à décider de rejoindre une séance à laquelle cet utilisateur participe. Il ne s'agit pas d'ajouter de nouvelles fonctionnalités de demande d'amitié, mais simplement de rendre visible une information sociale utile dans le contexte de WYLO. Critère de recette : reproduire ce parcours sur iOS et Android, vérifier la lisibilité, la persistance des choix et le retour vers l’écran d’origine. Si une ancienne formulation diffère d’une règle arbitrée au 23 octobre, appliquer cette règle arbitrée, non la formulation historique.", "difficulty": "moyen"}, {"id": 124, "cat": "Mon Profil / Amitiés", "title": "Réorganisation du profil utilisateur les séances avant les amis : Écran secondaire « Profil utilisateur » Actuellement, lorsqu'on consulte le profil", "explanation": "d'un utilisateur, sa liste d'amis apparaît avant ses séances. Cet ordre n'est pas pertinent au regard de la vocation première de WYLO, qui reste de permettre aux utilisateurs de partager des séances de cinéma. Il faut donc inverser l'ordre des rubriques : - Ses séances - Ses amis Les séances doivent constituer l'information principale du profil, les relations d'amitié venant seulement en complément. Par ailleurs, les espacements entre les différents blocs ne sont toujours pas satisfaisants. Se référer au ticket précédent concernant l'harmonisation des espacements sur l'ensemble des écrans secondaires. Critère de recette : reproduire ce parcours sur iOS et Android, vérifier la lisibilité, la persistance des choix et le retour vers l’écran d’origine. Si une ancienne formulation diffère d’une règle arbitrée au 23 octobre, appliquer cette règle arbitrée, non la formulation historique. Version de consolidation • PWA iOS & Android 045", "difficulty": "moyen"}, {"id": 125, "cat": "Socle / Design System", "title": "Vérification de la réciprocité des relations d’amitié", "explanation": "Écran secondaire « Profil utilisateur » — Rubrique « Ses amis » Une incohérence a été constatée dans l'affichage des relations d’amitié. Par exemple, lorsque je consulte le profil de Denis, Maxime apparaît parmi ses amis. En revanche, lorsque je consulte le profil de Maxime, Denis n'apparaît pas dans sa liste d'amis. Cette situation est anormale : une relation d'amitié doit impérativement être réciproque. Il faut donc vérifier si le problème provient de l'enregistrement des relations dans la base de données, de leur récupération ou simplement de leur affichage. Toute création ou suppression d'une relation d'amitié doit se répercuter automatiquement sur les deux profils concernés. Critère de recette : reproduire ce parcours sur iOS et Android, vérifier la lisibilité, la persistance des choix et le retour vers l’écran d’origine. Si une ancienne formulation diffère d’une règle arbitrée au 23 octobre, appliquer cette règle arbitrée, non la formulation historique. Mon activité", "difficulty": "moyen"}, {"id": 126, "cat": "Mon Profil / Amitiés", "title": "Écrans « Mon profil », « Profil utilisateur », « Mes séances » et historiques Les profils utilisateurs doivent", "explanation": "désormais tenir compte du nouveau statut « Séance demandée ». 1. Conservation de la rubrique principale Conserver l'intitulé général : « Ses séances » Il ne faut toujours pas distinguer les séances selon que l'utilisateur les a créées ou simplement rejointes. Ce qui compte est son implication dans ces séances, indépendamment de leur origine. 2. Classement des séances Adapter les sous-catégories pour distinguer désormais : - Séances demandées : demandes en attente de réponse de l'exploitant. - Séances en cours de confirmation : demandes acceptées, mais jauge non atteinte. - Séances confirmées : projections garanties avec places encore disponibles. - Séances à guichets fermés : projections garanties, mais complètes. - Séances passées : projections effectivement réalisées. Les demandes refusées doivent également rester consultables dans l'historique approprié, sans être présentées comme des séances auxquelles l'utilisateur a effectivement assisté. 3. Ordre des rubriques Conserver la hiérarchie validée : 1. Ses séances. 2. Ses amis. Les séances doivent toujours être présentées avant les relations d'amitié. 4. Classement chronologique À l'intérieur de chaque catégorie de séances à venir, appliquer un classement chronologique croissant : les séances les plus proches d'abord. Pour les séances passées, appliquer l'ordre inverse. 5. Cohérence des statuts sur les vignettes Remplacer tous les anciens cartouches de statut par les intitulés validés. Ne plus utiliser les formulations « Demande validée », « Séance sous réserve », « Séance pleine » ou toute autre appellation abandonnée. Objectif : permettre de retrouver immédiatement ses séances tout en identifiant précisément leur avancement dans le processus de programmation. --- À vérifier lors de la recette : le comportement décrit doit respecter l’ensemble des arbitrages finaux du cahier (libellés des sept statuts, absence de tarif inventé, présentation des cinémas, droits selon le rôle). Les versions historiques incompatibles ne doivent pas être implémentées simultanément. Mes amis", "difficulty": "moyen"}, {"id": 127, "cat": "Socle / Design System", "title": "Grille des amis en cinq colonnes Ouvrir la liste « Mes amis » dans un écran secondaire affichant cinq colonnes. Chaque vignette présente la", "explanation": "photo de profil et le prénom de l’utilisateur concerné. Vérification non réalisable actuellement avec le nombre d’amis disponible : simuler une liste suffisamment dense. Justification et critère de contrôle : ce point figurait dans un cahier de développement antérieur mais n’est pas suffisamment explicité dans les tickets récents. L’examiner dans son écran et son sous-écran, avec un scénario Version de consolidation • PWA iOS & Android 046", "difficulty": "moyen"}, {"id": 128, "cat": "Rechercher", "title": "Recherche instantanée parmi les amis Ajouter un champ de recherche sous le titre « Mes amis ». Filtrer immédiatement les résultats par prénom ou", "explanation": "nom, sans bouton de validation. L’ajout d’un champ de recherche dans une liste développée demeure à débattre, notamment pour les participants d’une séance. Justification et critère de contrôle : ce point figurait dans un cahier de développement antérieur mais n’est pas suffisamment explicité dans les tickets récents. L’examiner dans son écran et son sous-écran, avec un scénario réel et les droits liés au statut de la séance. Si sa formulation antérieure diverge de la décision du 23 octobre, cette dernière prévaut. Version de consolidation • PWA iOS & Android 047", "difficulty": "moyen"}, {"id": 129, "cat": "Mon Profil / Amitiés", "title": "Modifier mon compte : vocabulaire final et contenus", "explanation": "L’intitulé validé est « Modifier mon compte », pas « Éditer mon compte ». Conserver une présentation de saisie sur fond clair et les mêmes styles de titre, champs et valeurs que dans Rechercher. Le formulaire regroupe photographie, nom, prénom, genre, date de naissance, villes, mes cinémas, préférences de genres, films, réalisateurs, scénaristes, acteurs et fonds d’écran. Supprimer les phrases promotionnelles ou administratives qui alourdissent la saisie. Le sélecteur de Genre doit être nommé de façon uniforme dans toute l’application. Les champs villes et cinémas doivent s’appuyer sur des choix du référentiel plutôt que sur du texte libre. Préférences et référentiels", "difficulty": "moyen"}, {"id": 130, "cat": "Fiche Cinéma", "title": "Mes cinémas : ajout manuel ou automatique Deux voies alimentent « Mes cinémas » : l’utilisateur peut choisir librement un cinéma référencé", "explanation": "nationalement, même non partenaire ; et dès qu’il participe à une séance organisée dans un cinéma, celui-ci est ajouté automatiquement à ses préférences. L’ajout est attaché à l’identifiant unique du cinéma pour éviter les doublons. Pour le retirer, l’utilisateur ouvre la fiche cinéma depuis sa vignette et utilise « Retirer de mes cinémas ». Il ne doit pas être impossible de supprimer un cinéma simplement parce qu’il a été ajouté automatiquement. Ne pas masquer la rubrique jusqu’à une première réservation : les favoris peuvent être construits dès l’inscription. Une participation ultérieure peut ajouter un cinéma précédemment retiré ; cette règle mérite d’être visible et prévisible. Photographie", "difficulty": "facile"}, {"id": 131, "cat": "Socle / Design System", "title": "Importer une photo depuis la galerie native : test prioritaire", "explanation": "WYLO ne possède pas de galerie interne permanente des photos de profil. « Choisir dans ma galerie » ouvre directement la bibliothèque photo du smartphone, et « Prendre une photo » ouvre l’appareil photo, avec recadrage carré pour un avatar circulaire. Un défaut historique signalait des photographies comme indisponibles, y compris lors d’une importation depuis le téléphone. Vérifier explicitement le parcours natif sur iPhone et Android ; ne pas considérer cette anomalie comme résolue par le seul retrait de l’ancienne galerie WYLO. La nouvelle photo doit apparaître immédiatement dans Mon profil et sur l’avatar Home, sans rafraîchissement manuel. Version de consolidation • PWA iOS & Android 048", "difficulty": "moyen"}, {"id": 132, "cat": "Mon Profil / Amitiés", "title": "Suppression de la galerie personnelle de photos de profil dans WYLO", "explanation": "Supprimer la fonctionnalité permettant de constituer une galerie de photos de profil enregistrées dans WYLO : elle occupe de l’espace pour un usage trop occasionnel. Rendre l’intitulé « Choisir dans ma galerie » cliquable pour qu’il ouvre directement la galerie photos du téléphone. L’utilisateur pourra y sélectionner sa nouvelle photo de profil ; WYLO conservera uniquement la photo utilisée pour son profil. Critère de recette : reproduire ce parcours sur iOS et Android, vérifier la lisibilité, la persistance des choix et le retour vers l’écran d’origine. Si une ancienne formulation diffère d’une règle arbitrée au 23 octobre, appliquer cette règle arbitrée, non la formulation historique.", "difficulty": "moyen"}, {"id": 133, "cat": "Socle / Design System", "title": "Suppression de la pastille appareil photo et activation de « Prendre une photo »", "explanation": "Retirer la pastille rouge représentant un appareil photo, superposée à la photo de profil, dans l’écran « Éditer mon profil ». En conséquence, rendre l’intitulé « Prendre une photo » cliquable pour ouvrir directement l’appareil photo du smartphone. L’utilisateur pourra prendre une nouvelle photo, la recadrer au format carré, puis la valider comme sa nouvelle photo de profil. Critère de recette : reproduire ce parcours sur iOS et Android, vérifier la lisibilité, la persistance des choix et le retour vers l’écran d’origine. Si une ancienne formulation diffère d’une règle arbitrée au 23 octobre, appliquer cette règle arbitrée, non la formulation historique.", "difficulty": "moyen"}, {"id": 134, "cat": "Home", "title": "Actualisation automatique de la photo de profil sur la Home", "explanation": "Après validation d’une nouvelle photo de profil , actualiser automatiquement l’avatar affiché sur l’écran secondaire « Profil » et sur le bouton « profil » sur la Home. La nouvelle photo doit remplacer la précédente dès le retour à ces deux écrans, sans nécessiter de rafraîchissement manuel. Critère de recette : reproduire ce parcours sur iOS et Android, vérifier la lisibilité, la persistance des choix et le retour vers l’écran d’origine. Si une ancienne formulation diffère d’une règle arbitrée au 23 octobre, appliquer cette règle arbitrée, non la formulation historique.", "difficulty": "moyen"}, {"id": 135, "cat": "Mon Profil / Amitiés", "title": "Suppression des textes explicatifs dans « Éditer mon profil »", "explanation": "Supprimer les deux textes suivants : - « Obligatoire _ Ce dont WYLO a besoin pour ton compte » - « Facultatif _ Ce que tu veux montrer de toi et ce que tu aimes, pour que WYLO te propose mieux. » Renommer « Fond d’accueil » en « Fonds d’écran » et supprimer le texte situé dessous : « Un visuel WYLO toujours le même, ou un nouveau à chaque ouverture. » Renommer « Aléatoire » pour le fond d’écran en « Aléatoire à chaque rafraichissement de la home » Critère de recette : reproduire ce parcours sur iOS et Android, vérifier la lisibilité, la persistance des choix et le retour vers l’écran d’origine. Si une ancienne formulation diffère d’une règle arbitrée au 23 octobre, appliquer cette règle arbitrée, non la formulation historique. Version de consolidation • PWA iOS & Android 049", "difficulty": "moyen"}, {"id": 136, "cat": "Mon Profil / Amitiés", "title": "Renommage et uniformisation de l’affichage du genre dans le profil", "explanation": "Dans « Éditer mon profil », remplacer d’abord le libellé « SEXE » par « GENRE ». Conserver ce libellé affiché en permanence et présenter la valeur sélectionnée en dessous, par exemple « Homme », sans qu’elle remplace le libellé. Reprendre exactement la présentation des autres champs : typographie, alignements, espacements et hiérarchie entre le libellé et la valeur. Critère de recette : reproduire ce parcours sur iOS et Android, vérifier la lisibilité, la persistance des choix et le retour vers l’écran d’origine. Si une ancienne formulation diffère d’une règle arbitrée au 23 octobre, appliquer cette règle arbitrée, non la formulation historique. Compléments et contrôles historiques", "difficulty": "moyen"}, {"id": 137, "cat": "Mon Profil / Amitiés", "title": "Fond noir du profil et fond blanc des écrans de saisie", "explanation": "L’écran secondaire « Profil / Compte » conserve son fond noir. L’écran « Éditer mon profil » doit en revanche s’afficher sur fond blanc, comme tous les écrans permettant de saisir des informations. Adapter les couleurs des titres, des libellés, des valeurs saisies et des éléments du formulaire pour garantir un contraste suffisant et une bonne lisibilité sur fond blanc. Critère de recette : reproduire ce parcours sur iOS et Android, vérifier la lisibilité, la persistance des choix et le retour vers l’écran d’origine. Si une ancienne formulation diffère d’une règle arbitrée au 23 octobre, appliquer cette règle arbitrée, non la formulation historique. Photographie et préférences", "difficulty": "moyen"}, {"id": 138, "cat": "Socle / Design System", "title": "Harmonisation du sélecteur de genres préférés", "explanation": "À l’ouverture du sélecteur, afficher tous les genres sous forme de boutons disposés en grille (côte à côte avec retour à la ligne), comme sur l’écran secondaire « Rechercher » de la home. Reprendre leurs arrondis, supprimer les croix et appliquer le même comportement : un appui sélectionne le genre en rouge ; un nouvel appui le désélectionne et le remet en blanc. Critère de recette : reproduire ce parcours sur iOS et Android, vérifier la lisibilité, la persistance des choix et le retour vers l’écran d’origine. Si une ancienne formulation diffère d’une règle arbitrée au 23 octobre, appliquer cette règle arbitrée, non la formulation historique.", "difficulty": "moyen"}, {"id": 139, "cat": "Socle / Design System", "title": "Uniformisation des champs de recherche et de sélection des favoris", "explanation": "Dans « Éditer mon profil », pour les rubriques « Mes films », « Mes réalisateurs », « Mes scénaristes » et « Mes acteurs », réutiliser exactement les champs textuels et les composants de sélection de l’écran secondaire « Rechercher » de la home. Reprendre leur présentation : dimensions, typographie, couleurs, arrondis et espacements. La saisie, l’affichage des résultats et la sélection d’un film ou d’une personne doivent suivre le même fonctionnement que sur l’écran Recherche, afin de conserver une expérience cohérente dans l’application. Les recherches et les informations proposées doivent provenir de la base de données d’Allociné, via l’API, et non être limitées à la base de données de WYLO. L’utilisateur doit pouvoir sélectionner un film ou une personne même si aucune donnée les concernant n’existe encore dans WYLO. Il doit, par exemple, pouvoir ajouter un réalisateur même si aucun de ses films n’est présent dans l’application. Version de consolidation • PWA iOS & Android 050", "difficulty": "difficile"}, {"id": 140, "cat": "Données / Référentiels", "title": "Autocomplétion des villes à partir d’une base de données nationale", "explanation": "Dans « Éditer mon profil », relier le champ des villes à une base de données nationale de référence pour proposer des villes au fur et à mesure de la saisie. L’utilisateur pourra sélectionner une proposition afin d’enregistrer un nom correctement orthographié et standardisé. Reprendre la même présentation et le même fonctionnement que la recherche d’un titre de film dans l’écran secondaire « Rechercher », accessible depuis la Home. Appliquer ce fonctionnement à chaque ville ajoutée au profil. Sur l’écran secondaire « Demander une séance » : Critère de recette : reproduire ce parcours sur iOS et Android, vérifier la lisibilité, la persistance des choix et le retour vers l’écran d’origine. Si une ancienne formulation diffère d’une règle arbitrée au 23 octobre, appliquer cette règle arbitrée, non la formulation historique. Confidentialité", "difficulty": "moyen"}, {"id": 141, "cat": "Mon Profil / Amitiés", "title": "Séparation des données publiques et privées du compte", "explanation": "Limiter les profils consultables aux informations sociales appropriées. Ne jamais exposer les mots de passe, données d’authentification ou autres informations personnelles sensibles. Justification et critère de contrôle : ce point figurait dans un cahier de développement antérieur mais n’est pas suffisamment explicité dans les tickets récents. L’examiner dans son écran et son sous-écran, avec un scénario réel et les droits liés au statut de la séance. Si sa formulation antérieure diverge de la décision du 23 octobre, cette dernière prévaut.", "difficulty": "moyen"}, {"id": 142, "cat": "Mon Profil / Amitiés", "title": "Simplification des paramètres du compte", "explanation": "Supprimer le réglage « Qui voit mon profil » et s’appuyer sur les relations d’amitié et le blocage pour gérer les interactions. Conserver les entrées « Consulter les CGU » et « Supprimer mon compte ». Justification et critère de contrôle : ce point figurait dans un cahier de développement antérieur mais n’est pas suffisamment explicité dans les tickets récents. L’examiner dans son écran et son sous-écran, avec un scénario réel et les droits liés au statut de la séance. Si sa formulation antérieure diverge de la décision du 23 octobre, cette dernière prévaut. Photographie", "difficulty": "difficile"}, {"id": 143, "cat": "Socle / Design System", "title": "Galerie native : impossibilité d’importer une photo à diagnostiquer", "explanation": "Le défaut historique concernait l’impossibilité de sélectionner ou d’importer certaines photos depuis la galerie du téléphone. Puisque la galerie interne WYLO est supprimée, le test doit porter uniquement sur l’ouverture de la galerie native, la permission d’accès et l’enregistrement de l’image choisie. Effectuer le test sur plusieurs formats et sur iPhone comme Android, y compris après un refus puis un nouvel accord de permission. Vérifier également le recadrage et l’actualisation immédiate de l’avatar. Version de consolidation • PWA iOS & Android 051", "difficulty": "facile"}, {"id": 144, "cat": "Blocage / Signalement", "title": "Blocage : suppression d’amitié et restriction d’accès sans signalement", "explanation": "Bloquer une personne supprime la relation d’amitié réciproque, interdit la discussion privée et interdit l’accès ordinaire au profil de cette personne. La participation simultanée à une même séance reste possible et ne reconstitue pas l’amitié. Le profil bloqué conserve sa place normale dans le carrousel des participants ; son avatar est signalé par un scintillement ou halo distinctif uniquement dans la vue de la personne ayant effectué le blocage. Aucun motif n’est demandé et aucun message n’est envoyé aux administrateurs par le seul blocage. L’utilisateur bloqué ne doit pas recevoir d’indication lui révélant explicitement la décision. La commande de déblocage doit être confirmée et ne recrée pas immédiatement l’amitié. Signaler", "difficulty": "difficile"}, {"id": 145, "cat": "Blocage / Signalement", "title": "Signaler : blocage automatique et transmission à l’administration", "explanation": "Signaler une personne applique toutes les conséquences du blocage simple, puis y ajoute l’envoi d’un message à l’administration WYLO décrivant le signalement. Le formulaire de signalement peut contenir un motif facultatif, clairement identifié comme tel ; ne pas l’afficher dans le simple blocage. Un signalement ne supprime pas automatiquement le compte du signalé : la décision appartient aux administrateurs. Tant qu’il demeure dans l’application, il reste co-inscriptible à une séance, sous les restrictions de confidentialité et de messagerie. Le signalement doit être enregistré séparément du blocage afin de permettre les traitements de modération et la traçabilité correspondante.", "difficulty": "difficile"}, {"id": 146, "cat": "Notifications", "title": "Notification lors de l’arrivée d’une personne signalée", "explanation": "Si une personne que l’utilisateur a préalablement signalée rejoint une séance à laquelle celui-ci participe, envoyer une notification informative discrète. Il ne faut pas générer cette notification pour une personne seulement bloquée mais jamais signalée. L’avatar de la personne signalée apparaît avec l’indicateur de blocage puisque le signalement entraîne automatiquement celui-ci. La notification ne doit pas déclencher un nouveau signalement ni révéler à l’autre utilisateur qu’il a été signalé. Compléments et contrôles historiques Version de consolidation • PWA iOS & Android 052", "difficulty": "difficile"}, {"id": 147, "cat": "Mon Profil / Amitiés", "title": "Respect de la présentation initiale des profils utilisateurs", "explanation": "Écran secondaire « Profil utilisateur » — Depuis une fiche de séance La présentation des informations du profil (nom, prénom et autres renseignements) a été modifiée alors qu'aucun changement n'était demandé. Il faut reprendre la disposition initiale, sans modifier inutilement l'organisation des informations. Par ailleurs, les textes sont actuellement positionnés beaucoup trop bas, presque collés à la bordure inférieure de l'écran. L'objectif est de retrouver une présentation équilibrée, fidèle à la maquette de référence. Critère de recette : reproduire ce parcours sur iOS et Android, vérifier la lisibilité, la persistance des choix et le retour vers l’écran d’origine. Si une ancienne formulation diffère d’une règle arbitrée au 23 octobre, appliquer cette règle arbitrée, non la formulation historique.", "difficulty": "moyen"}, {"id": 148, "cat": "Socle / Design System", "title": "Harmonisation des intitulés des actions de modération", "explanation": "Écran secondaire « Profil utilisateur » Éviter l'emploi du terme générique « personne » dans les intitulés des actions de modération. Il est
