*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Montserrat',sans-serif;background:#FFF;color:#111;line-height:1.7}
.topbar{position:sticky;top:0;z-index:100;background:rgba(255,255,255,0.97);backdrop-filter:blur(24px);border-bottom:1px solid #E8E8ED;padding:16px 22px;display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center} .controls input,.controls select{font-family:'Montserrat',sans-serif;font-size:12px;padding:9px 13px;border:1px solid #E8E8ED;border-radius:12px;background:#F5F5F7}
.btn{font-family:'Montserrat',sans-serif;font-weight:700;font-size:11px;padding:9px 14px;border-radius:12px;border:none;cursor:pointer;background:#111;color:white} .btn.sec{background:#F5F5F7;color:#111}

.prio-btn,.diff-btn{font-family:'Montserrat',sans-serif;font-weight:800;border-radius:20px;border:1px solid #E8E8ED;background:white;cursor:pointer;display:flex;align-items:center;gap:6px;font-size:11px;padding:7px 12px}
.prio-btn.active.p1{background:#30D158;color:white;border-color:#30D158} .prio-btn.active.p2{background:#FF9500;color:white;border-color:#FF9500} .prio-btn.active.p3{background:#FF3B30;color:white;border-color:#FF3B30} .prio-btn.active.p0{background:#111;color:white}
.diff-btn.active.facile{background:#30D158;color:white;border-color:#30D158} .diff-btn.active.moyen{background:#FF9500;color:white;border-color:#FF9500} .diff-btn.active.difficile{background:#FF3B30;color:white;border-color:#FF3B30}
.vote-badge{font-size:8px;font-weight:800;min-width:18px;height:18px;border-radius:10px;background:#F2F2F5;color:#6E6E73;display:inline-flex;align-items:center;justify-content:center;padding:0 5px} .prio-btn.active .vote-badge,.diff-btn.active .vote-badge{background:rgba(255,255,255,0.25);color:white}
.comment-area{display:flex;flex-direction:column;gap:10px} .comments-list{display:flex;flex-direction:column;gap:8px;max-height:220px;overflow:auto} .comment-item{background:#F9F9FB;border:1px solid #F0F0F2;border-radius:12px;padding:10px 12px;font-size:12px} .c-meta{font-size:9px;font-weight:700;color:#8E8E93;margin-bottom:4px;display:flex;justify-content:space-between}

.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.4);backdrop-filter:blur(8px);z-index:200;display:none;align-items:center;justify-content:center;padding:20px} .modal{background:white;border-radius:24px;padding:28px;max-width:560px;width:100%;display:flex;flex-direction:column;gap:14px} .modal input,.modal select,.modal textarea{font-family:'Montserrat',sans-serif;font-size:13px;padding:11px 14px;border:1px solid #E8E8ED;border-radius:12px;width:100%} .modal textarea{min-height:100px}
.user-bar{padding:10px 22px;background:#F9F9FB;border-bottom:1px solid #F0F0F2;display:flex;gap:10px;align-items:center;font-size:11px} .user-bar input{font-family:'Montserrat',sans-serif;font-size:11px;padding:6px 10px;border:1px solid #E8E8ED;border-radius:10px;min-width:260px}

const baseTickets = [{"id": 1, "cat": "Socle / Design System", "title": "Un seul arrondi de référence pour les vignettes et les écrans", "explanation": "La seule forme géométrique de référence est la vignette verticale de séance de 114 unités de large sur 157 unités de haut, avec un rayon de coin de 28 unités. Il ne faut pas enregistrer de rayon secondaire indépendant pour les écrans. Le rayon de n’importe quel composant homothétique découle du rapport d’agrandissement de sa largeur : rayon cible = 28 × largeur cible / 114, toutes les dimensions étant exprimées dans le même système d’unités. Cette logique vaut pour les grandes fiches ou les vignettes redimensionnées ; les avatars des personnes restent des cercles. Les cinémas adoptent une vignette horizontale 16:9, dans le même langage d’arrondi. La mise en œuvre doit vérifier que le rayon calculé reste compatible avec les dimensions et que la perception visuelle est identique sur iOS et Android. Calques et défilement", "difficulty": "facile"}, {"id": 2, "cat": "Socle / Design System", "title": "Suppression de l’ancien fondu noir : un calque de flou unique", "explanation": "L’ancien fondu noir n’est pas conservé sous le nouveau dispositif. Le nouveau calque noir avec flou d’arrière-plan remplace totalement le système précédent : il ne faut pas cumuler les deux effets. Le calque suit strictement les dimensions et les contours arrondis du support, demeure fixe pendant le défilement et augmente uniformément son effet en fonction de l’avancement du scroll. Les valeurs de référence présentes dans Sans titre sont : au départ flou nul et opacité nulle ; en fin de défilement flou 50 et opacité noire 25 %, à recontrôler sur les deux plateformes. Vérification : aucun assombrissement supplémentaire d’une ancienne couche ne doit subsister, au risque d’obtenir un fond presque noir ou une luminosité différente selon le smartphone.", "difficulty": "facile"}, {"id": 3, "cat": "Socle / Design System", "title": "Écrans secondaires : hauteur stable et clavier non recouvrant", "explanation": "Les écrans secondaires occupent la hauteur de référence de cinq sixièmes de la vue principale. Ils conservent cette hauteur et leur position lors de l’apparition du clavier ; les différences de safe areas, barres système et viewport doivent être compensées entre iOS et Android. Quand un champ est activé, le contenu intérieur défile pour remonter ce champ juste au-dessus du clavier. Le clavier ne recouvre jamais le champ actif. Le titre et les éléments fixés dans l’en-tête ne bougent pas ; les textes défilants passent derrière eux et s’estompent sous un dégradé de flou adapté au fond. Tester au premier champ, au dernier champ, après changement de focus et fermeture du clavier, en navigateur mobile et dans la PWA installée. Ne pas déplacer l’ensemble du cartouche ni augmenter sa hauteur. Typographie, titres et marges Version de consolidation • PWA iOS & Android 003", "difficulty": "moyen"}, {"id": 4, "cat": "Socle / Design System", "title": "Hiérarchie typographique unique sur toutes les plateformes", "explanation": "Conserver Montserrat comme police de marque de WYLO et définir des styles partagés, non des valeurs locales écran par écran. Niveau 1 : titre principal d’écran, aligné à droite, toujours de même taille et de même graisse ; niveau 2 : intitulés de champs et rubriques ; niveau 3 : valeurs et textes courants ; niveau 4 : rares petites mentions accessoires. Les intitulés Prénom, Date de naissance, Villes et Cinémas du compte doivent avoir exactement le même style que les intitulés Statuts des séances, Villes ou Cinémas dans Rechercher. Les valeurs saisies ont la taille des valeurs des boutons et champs de recherche, avec une graisse plus légère. Ne pas laisser les titres déborder sur iPhone alors qu’ils tiennent sur Android. Prévoir une stratégie explicite pour la largeur réellement disponible, les longs noms de films et les tailles de texte système ; vérifier au minimum plusieurs tailles de chaque famille de téléphone.", "difficulty": "moyen"}, {"id": 5, "cat": "Socle / Design System", "title": "Titres d’action à l’infinitif, alignés à droite", "explanation": "Les titres des écrans secondaires sont toujours positionnés sur une même marge droite. Lorsqu’il s’agit d’une action, employer une formulation courte à l’infinitif : Rechercher, Demander une séance, Modifier mon compte, Modifier mes billets. Ne pas employer « Je recherche » ou des phrases conjuguées. Pour les rubriques de consultation, conserver les désignations naturelles : Mes séances, Notifications, Mes amis. Les intitulés de catégories ne doivent pas être artificiellement transformés en verbes ; seul leur niveau graphique est normalisé.", "difficulty": "moyen"}, {"id": 6, "cat": "Socle / Design System", "title": "Grille d’espacements unique entre les blocs", "explanation": "Définir un petit ensemble de distances réutilisables : titre vers premier bloc, intitulé de champ vers valeur, deux champs successifs, deux rubriques distinctes, marge inférieure de cartouche. Deux éléments de même relation hiérarchique doivent être séparés par la même distance dans tous les écrans. Corriger particulièrement les écarts entre Rechercher et Modifier mon compte, entre le titre Rechercher et les premières vignettes, et entre le champ textuel et le titre Statuts des séances. Ne pas laisser de vide disproportionné après les informations visibles au premier affichage. Composants visuels", "difficulty": "moyen"}, {"id": 7, "cat": "Fiche Cinéma", "title": "Formes d’identité : utilisateur, séance et cinéma", "explanation": "Utilisateur : avatar circulaire, y compris participants et messagerie. Séance : affiche verticale identique à celle de la Home, avec l’arrondi de référence. Cinéma : photographie horizontale au ratio 16:9, coins calculés par homothétie ; en l’absence de photographie, un fond générique et un pictogramme de cinéma. La taille varie selon l’emplacement mais jamais le langage de forme. Les résultats d’une recherche et les carrousels des fiches cinémas affichent des séances par affiches ; les carrousels d’une fiche film affichent, au contraire, les cinémas par photographies 16:9. Typographie, titres et marges Version de consolidation • PWA iOS & Android 004", "difficulty": "moyen"}, {"id": 8, "cat": "Socle / Design System", "title": "Dates, durées, horaires et états : conventions communes", "explanation": "Présenter les dates complètes en français, avec mois en toutes lettres, de manière constante. Écrire les durées sans espace autour de h : 1h50, 2h15. Dans les formulaires et les filtres, utiliser « plages horaires » pour les fourchettes et « horaire » pour une heure exacte. Soirée se termine à 22h00 et Nuit commence à 22h00. Les heures doivent être présentées de manière homogène, avec le h et les minutes appropriées, par exemple 18h00 et 22h00 plutôt que des variantes mêlant 18h, 18 H et 18:00. Appliquer les mêmes libellés de statut sur la Home, les résultats, les fiches séances, les profils, les notifications et les formulaires. Compatibilité mobile", "difficulty": "moyen"}, {"id": 9, "cat": "Socle / Design System", "title": "Rendu équivalent sur iOS et Android", "explanation": "Le rendu actuel varie : certains titres sont surdimensionnés et débordent sur iPhone, tandis que des écrans secondaires ne montent pas à la même hauteur entre plateformes. La recette doit comparer les dimensions de police, les dimensions des vignettes, les rayons, la hauteur des feuilles secondaires et le comportement du clavier. Ne pas se limiter à un appareil Android et un iPhone particulier. Comparer plusieurs largeurs, densités, tailles de texte système et l’installation PWA. Les unités CSS, l’agrandissement de texte du navigateur, les zones de sécurité et le viewport dynamique doivent être maîtrisés pour produire la même hiérarchie visuelle. Des écarts techniques peuvent exister entre moteurs de navigateur, mais le contenu et ses actions doivent rester lisibles, atteignables et sans débordement horizontal.", "difficulty": "difficile"}, {"id": 10, "cat": "Socle / Design System", "title": "Étude à moyen terme : contrôle de l’apparence du clavier", "explanation": "Examiner la possibilité d’améliorer l’intégration graphique du clavier, voire d’envisager à moyen terme un clavier spécifique à WYLO. Ce n’est pas une demande d’implémentation immédiate : conserver d’abord les fonctions natives indispensables, dont autocorrection, dictée, accessibilité et claviers internationaux. Documenter les limites de personnalisation des claviers iOS et Android depuis une PWA et comparer les bénéfices d’un composant dédié aux risques techniques et ergonomiques. Normes et contraintes partagées", "difficulty": "moyen"}, {"id": 11, "cat": "Socle / Design System", "title": "Remplacement de tous les fondus au noir par un calque noir avec flou d’arrière-plan", "explanation": "Remplacer tous les fondus au noir de l’application par un calque noir avec flou d’arrière-plan, superposé à l’écran principal Home ou à l’écran secondaire concerné. Ce calque doit respecter précisément sa forme, ses contours et ses éventuels angles arrondis, sans déborder. Le calque couvre toute la surface de l’écran concerné dès le départ. Son emplacement et ses dimensions restent fixes pendant tout le défilement : seule l’intensité de l’effet évolue, uniformément sur toute la surface recouverte. Avant de commencer le scroll, les valeurs sont toutes à zéro : flou 0, luminosité 0 et opacité 0 %. Le calque est donc initialement invisible. Dès le début du scroll, l’effet augmente progressivement suivant l’avancement du défilement, jusqu’à atteindre, à la fin du scroll : flou 50, luminosité 0 et opacité 25 %. La luminosité reste ainsi à zéro pendant toute la progression. Version de consolidation • PWA iOS & Android 005", "difficulty": "facile"}, {"id": 12, "cat": "Socle / Design System", "title": "Flou d’arrière-plan permanent sur les boutons d’action", "explanation": "Appliquer un flou d’arrière-plan permanent aux fonds circulaires de tous les boutons d’action de l’application, sur la Home comme sur les écrans secondaires. Les contenus situés derrière ces fonds doivent être réellement floutés, et pas simplement visibles à travers une faible opacité. L’effet doit être actif dès l’affichage du bouton, indépendamment du scroll. Exception : les boutons rouges « Demander une séance » et « Rejoindre la séance » sont exclus de cette règle. Critère de recette : reproduire ce parcours sur iOS et Android, vérifier la lisibilité, la persistance des choix et le retour vers l’écran d’origine. Si une ancienne formulation diffère d’une règle arbitrée au 23 octobre, appliquer cette règle arbitrée, non la formulation historique.", "difficulty": "moyen"}, {"id": 13, "cat": "Socle / Design System", "title": "Dimensionnement précis des écrans secondaires", "explanation": "Tous les écrans secondaires doivent couvrir exactement 5/6e de la hauteur de l’écran principal, soit 83,33 %, en laissant 1/6e de l’écran principal visible. Ce rapport doit être respecté sur toutes les tailles d’écran, sur iPhone comme sur Android. Critère de recette : reproduire ce parcours sur iOS et Android, vérifier la lisibilité, la persistance des choix et le retour vers l’écran d’origine. Si une ancienne formulation diffère d’une règle arbitrée au 23 octobre, appliquer cette règle arbitrée, non la formulation historique.", "difficulty": "facile"}, {"id": 14, "cat": "Socle / Design System", "title": "Harmonisation de la typographie et du positionnement des textes", "explanation": "Reprendre les écrans de référence pour harmoniser la présentation de tous les écrans secondaires : police Montserrat, tailles, graisses, interlignes, alignements et marges. Deux textes de même niveau doivent suivre les mêmes règles graphiques. Définir un positionnement cohérent du titre et du premier bloc d’informations par rapport au bord inférieur de la zone visible de l’écran secondaire, dès son ouverture et avant tout scroll. Pour les fiches-séance, reprendre la hiérarchie du visuel : - Titre du film : grand et en gras. - Date et horaire : date en gras, suivie de l’horaire ou de la plage horaire en graisse normale, sur une même ligne. - Ville et cinéma : sur la ligne suivante, alignés à gauche avec le titre et les autres informations. Sous le visuel, présenter les caractéristiques du film sur une ligne : genre cinématographique en gras, puis durée, nationalité et année en graisse normale, séparés par des barres verticales. Définir ainsi, pour chaque type d’information, une disposition stable sur une même ligne ou sur des lignes successives, conformément aux maquettes. Critère de recette : reproduire ce parcours sur iOS et Android, vérifier la lisibilité, la persistance des choix et le retour vers l’écran d’origine. Si une ancienne formulation diffère d’une règle arbitrée au 23 octobre, appliquer cette règle arbitrée, non la formulation historique.", "difficulty": "facile"}, {"id": 15, "cat": "Socle / Design System", "title": "Disparition progressive des textes sous un flou dégradé en haut des écrans", "explanation": "Sur tous les écrans défilants, placer en haut de l’écran concerné un calque avec flou d’arrière-plan en dégradé, sur environ un centimètre de hauteur. L’effet doit être nul au bas de cette zone, puis augmenter progressivement vers le bord supérieur, jusqu’aux réglages définis précédemment : flou 50, luminosité 0 et opacité 25 %. Adapter la couleur du filtre au fond de l’écran : blanc sur fond blanc et noir sur fond noir. Le calque reste fixe pendant le défilement. Les textes qui passent dessous deviennent progressivement flous et s’estompent avant d’atteindre le bord supérieur, sans coupure nette. Version de consolidation • PWA iOS & Android 006", "difficulty": "moyen"}, {"id": 16, "cat": "Socle / Design System", "title": "Suppression du cercle et du scintillement du bouton de demande de séance", "explanation": "Sur iPhone comme sur Android, le bouton rouge « Demander une séance », situé en bas à droite de la Home, ne doit jamais être entouré d’un cercle décoratif ni présenter de scintillement, au repos comme pendant les interactions ou le défilement. Supprimer également ces cercles décoratifs autour des boutons dans toute l’application. Réserver le scintillement aux éléments signalant une nouvelle activité qui mérite l’attention, comme l’arrivée d’une notification. Critère de recette : reproduire ce parcours sur iOS et Android, vérifier la lisibilité, la persistance des choix et le retour vers l’écran d’origine. Si une ancienne formulation diffère d’une règle arbitrée au 23 octobre, appliquer cette règle arbitrée, non la formulation historique.", "difficulty": "moyen"}, {"id": 17, "cat": "Socle / Design System", "title": "Répartition des visuels de films selon leur usage", "explanation": "Les visuels verticaux utilisés en fond d’écran de la Home, des fiches-film et des fiches-séance doivent provenir exclusivement de la base de données WYLO, parmi les visuels sans titre intégré à l’image. Les visuels avec titre intégré sont exclusivement réservés aux vignettes des carrousels de films et de séances, ainsi qu’aux grilles de films affichées à l’ouverture des carrousels. Critère de recette : reproduire ce parcours sur iOS et Android, vérifier la lisibilité, la persistance des choix et le retour vers l’écran d’origine. Si une ancienne formulation diffère d’une règle arbitrée au 23 octobre, appliquer cette règle arbitrée, non la formulation historique. Normes et contraintes partagées", "difficulty": "facile"}, {"id": 18, "cat": "Socle / Design System", "title": "Positionnement systématique du champ actif au-dessus du clavier", "explanation": "Le comportement actuel n’est pas systématique : le clavier masque encore parfois le champ en cours de saisie. À chaque ouverture du clavier, ajuster automatiquement le défilement pour placer le champ actif juste au-dessus du clavier, afin qu’il reste entièrement visible pendant toute la saisie. Cet ajustement doit également s’effectuer lorsque l’utilisateur passe d’un champ à un autre, quelle que soit sa position dans le formulaire. Critère de recette : reproduire ce parcours sur iOS et Android, vérifier la lisibilité, la persistance des choix et le retour vers l’écran d’origine. Si une ancienne formulation diffère d’une règle arbitrée au 23 octobre, appliquer cette règle arbitrée, non la formulation historique.", "difficulty": "moyen"}, {"id": 19, "cat": "Socle / Design System", "title": "Harmonisation de la formulation et de l’alignement des titres des écrans secondaires", "explanation": "Employer un verbe à l’infinitif lorsque l’écran invite l’utilisateur à agir : « Rechercher » plutôt que « Je recherche », « Modifier mon compte », etc. Pour les écrans de consultation, conserver un intitulé de rubrique, comme « Notifications ». Aligner à droite tous les titres des écrans secondaires, avec une marge droite identique et une présentation typographique commune : police, taille et graisse. Version de consolidation • PWA iOS & Android 007", "difficulty": "moyen"}, {"id": 20, "cat": "Socle / Design System", "title": "Réduction et harmonisation des espacements entre les blocs", "explanation": "Réduire l’espace excessif entre les informations visibles à l’ouverture d’un écran secondaire et celles qui apparaissent au premier scroll. Le défilement doit révéler la suite du contenu sans traverser une grande zone vide. Harmoniser les espacements entre les blocs : informations principales, caractéristiques du film, crédits, synopsis et participants. Des blocs de même nature doivent suivre les mêmes règles d’espacement dans toute l’application. Cette harmonisation concerne également l’écran « Rechercher » : remonter légèrement le champ textuel pour le rapprocher du carrousel de vignettes et former un ensemble plus compact. Critère de recette : reproduire ce parcours sur iOS et Android, vérifier la lisibilité, la persistance des choix et le retour vers l’écran d’origine. Si une ancienne formulation diffère d’une règle arbitrée au 23 octobre, appliquer cette règle arbitrée, non la formulation historique.", "difficulty": "moyen"}, {"id": 21, "cat": "Socle / Design System", "title": "Correction de la taille des textes sur iPhone", "explanation": "Sur iPhone, la plupart des titres s’affichent actuellement trop gros et débordent de l’écran, ce qui gêne la lecture et déséquilibre la présentation. Réduire et adapter la taille des textes sur tous les écrans de l’application, y compris la Home, en tenant compte de la largeur disponible et des marges latérales. Les titres doivent rester intégralement visibles et lisibles, sans débordement horizontal ni coupure. Vérifier le rendu sur les différentes tailles d’écran d’iPhone afin de conserver une présentation cohérente dans toute l’application. Critère de recette : reproduire ce parcours sur iOS et Android, vérifier la lisibilité, la persistance des choix et le retour vers l’écran d’origine. Si une ancienne formulation diffère d’une règle arbitrée au 23 octobre, appliquer cette règle arbitrée, non la formulation historique.", "difficulty": "facile"}, {"id": 22, "cat": "Socle / Design System", "title": "Harmonisation de la marge inférieure des écrans secondaires", "explanation": "Écran secondaire « Ma séance » — Règle commune à tous les écrans secondaires Comme cela a déjà été signalé dans un précédent ticket, la distance entre le dernier élément de contenu et la bordure inférieure de l'écran secondaire doit être harmonisée. Actuellement, cet espace est beaucoup trop important sur la fiche de séance, donnant l'impression que le contenu a été artificiellement remonté. Comportement attendu : - Réduire cette marge inférieure excessive. - Appliquer une valeur identique à l'ensemble des écrans secondaires. - Conserver une marge suffisante pour assurer une bonne respiration visuelle, sans créer de vide inutile. Ce réglage doit relever d'une règle de mise en page globale et non d'ajustements indépendants pour chaque écran. Critère de recette : reproduire ce parcours sur iOS et Android, vérifier la lisibilité, la persistance des choix et le retour vers l’écran d’origine. Si une ancienne formulation diffère d’une règle arbitrée au 23 octobre, appliquer cette règle arbitrée, non la formulation historique. Version de consolidation • PWA iOS & Android 008", "difficulty": "facile"}, {"id": 23, "cat": "Socle / Design System", "title": "Harmonisation de la position verticale des contenus sur tous les écrans secondaires", "explanation": "Règle commune à tous les écrans secondaires Comme déjà signalé dans un précédent ticket, la position du dernier élément de contenu varie sensiblement d'un écran secondaire à l'autre. Il faut impérativement harmoniser cette position afin que les différents écrans présentent une même ligne de référence inférieure. Référence à utiliser : le bas des boutons « Créer une séance » ou « Rejoindre une séance », qui occupent déjà un emplacement satisfaisant sur leurs écrans respectifs. Sur les autres écrans secondaires, le dernier élément de contenu doit idéalement s'aligner sur cette même hauteur. Il ne faut donc ni coller les textes au bas de l'écran, ni laisser un espace vide excessif. Cette règle doit être appliquée globalement à l'ensemble des écrans secondaires. Critère de recette : reproduire ce parcours sur iOS et Android, vérifier la lisibilité, la persistance des choix et le retour vers l’écran d’origine. Si une ancienne formulation diffère d’une règle arbitrée au 23 octobre, appliquer cette règle arbitrée, non la formulation historique. Compléments et contrôles historiques", "difficulty": "facile"}, {"id": 24, "cat": "Socle / Design System", "title": "Suppression des ouvertures saccadées des fiches films", "explanation": "Écrans secondaires « Fiche film » et « Fiche séance » Certaines fiches ne s'ouvrent actuellement pas de manière fluide. On constate parfois une ouverture en deux temps : la fiche commence à monter, marque un très bref arrêt, puis reprend brusquement son mouvement jusqu'à sa position finale. Cela donne l'impression d'une ouverture par paliers plutôt que d'une animation continue. Il faut supprimer ces ruptures de mouvement. L'ouverture doit s'effectuer en une seule animation continue, sans arrêt intermédiaire ni changement brutal de position. Il faut notamment vérifier que les éventuels recalculs de hauteur ou chargements de contenu n'interrompent pas l'animation initiale. Critère de recette : reproduire ce parcours sur iOS et Android, vérifier la lisibilité, la persistance des choix et le retour vers l’écran d’origine. Si une ancienne formulation diffère d’une règle arbitrée au 23 octobre, appliquer cette règle arbitrée, non la formulation historique.", "difficulty": "moyen"}, {"id": 25, "cat": "Socle / Design System", "title": "Assouplissement des animations d'ouverture et de fermeture", "explanation": "Tous les écrans secondaires de WYLO Les animations actuelles d'ouverture et de fermeture sont globalement trop rapides et trop linéaires. Même si les écrans montent bien depuis le bas et redescendent lors de leur fermeture, le mouvement manque de souplesse et ressemble parfois à un simple saut visuel. Il faudrait adopter des animations légèrement plus lentes, avec une accélération et une décélération progressives. Pour l'ouverture, le mouvement pourrait commencer doucement, accélérer pendant la montée, puis ralentir progressivement à l'approche de sa position finale. Pour la fermeture, le mouvement doit présenter la même fluidité, avec une courbe adaptée au déplacement descendant. Il ne s'agit pas de ralentir excessivement l'application, mais d'obtenir une sensation de mouvement plus naturelle, plus douce et plus élégante. Objectif : remplacer les transitions abruptes par des animations fluides et continues, renforçant l'impression de rondeur qui caractérise l'identité graphique de WYLO. Critère de recette : reproduire ce parcours sur iOS et Android, vérifier la lisibilité, la persistance des choix et le retour vers l’écran d’origine. Si une ancienne formulation diffère d’une règle arbitrée au 23 octobre, appliquer cette règle arbitrée, non la formulation historique. Normes et contraintes partagées Version de consolidation • PWA iOS & Android 009", "difficulty": "difficile"}, {"id": 26, "cat": "Socle / Design System", "title": "Harmonisation du format d'affichage des dates", "explanation": "Tous les écrans de WYLO — Règle graphique globale Actuellement, les mois ne sont pas affichés de manière homogène dans l'application. Selon les écrans, ils apparaissent parfois sous forme numérique (23/10/2026) et parfois en toutes lettres (23 octobre 2026). Il faut systématiquement privilégier l'écriture des mois en toutes lettres, sur l'ensemble des écrans de WYLO, sans exception. Format attendu : 23/10/2026 23 octobre 2026 Cette règle doit s'appliquer partout où une date est affichée : fiches films, fiches séances, réservations, formulaires, profils, notifications, historiques, etc. Conserver également une présentation typographique cohérente (police, taille, graisse et espacement) selon le contexte. Objectif : adopter une convention de date unique dans toute l'application, plus lisible et plus élégante, et éviter toute différence de présentation entre les écrans. Critère de recette : reproduire ce parcours sur iOS et Android, vérifier la lisibilité, la persistance des choix et le retour vers l’écran d’origine. Si une ancienne formulation diffère d’une règle arbitrée au 23 octobre, appliquer cette règle arbitrée, non la formulation historique.", "difficulty": "moyen"}, {"id": 27, "cat": "Fiche Film", "title": "Harmonisation de la casse et du défilement des titres de films Écrans secondaires « Fiche film", "explanation": "» et « Fiche séance » Actuellement, les titres des films sont affichés en majuscules et peuvent être tronqués lorsqu'ils dépassent la largeur disponible. Il faut harmoniser leur présentation en appliquant les règles suivantes : - Casse : supprimer l'affichage systématique en majuscules et respecter la casse naturelle des titres (minuscules, avec les majuscules nécessaires). - Défilement horizontal : lorsqu'un titre est trop long pour tenir sur une seule ligne, il doit défiler automatiquement de droite à gauche, exactement comme dans le cartouche de recherche. - Titres courts : lorsqu'un titre tient entièrement dans l'espace disponible, il reste fixe. - Présentation : conserver la typographie, la graisse, la taille et l'alignement prévus dans les maquettes. Le défilement doit être fluide, suffisamment lent pour permettre une lecture confortable, et ne provoquer aucun déplacement des autres éléments de l'interface. Objectif : garantir une présentation homogène des titres de films sur toutes les fiches, sans troncature ni retour à la ligne, en reprenant le comportement déjà utilisé dans le cartouche « Rechercher ». Critère de recette : reproduire ce parcours sur iOS et Android, vérifier la lisibilité, la persistance des choix et le retour vers l’écran d’origine. Si une ancienne formulation diffère d’une règle arbitrée au 23 octobre, appliquer cette règle arbitrée, non la formulation historique. Dates et durées", "difficulty": "moyen"}, {"id": 28, "cat": "Socle / Design System", "title": "Tous les écrans de WYLO — Règle typographique globale Actuellement, les durées des films ne sont pas", "explanation": "toujours présentées de manière homogène, notamment concernant les espaces entre les heures et les minutes. Il faut systématiquement supprimer les espaces entre les chiffres et la lettre « h », ainsi qu'entre cette lettre et les minutes. Format attendu : - 1 h 50 - 1h 50 - 1 h50 - 1h50 Cette convention doit être appliquée partout où apparaît la durée d'un film : fiches films, fiches séances, résultats de recherche, formulaires et tout autre écran concerné. Objectif : adopter une écriture compacte, homogène et immédiatement lisible des durées dans toute l’application. À vérifier lors de la recette : le comportement décrit doit respecter l’ensemble des arbitrages finaux du cahier (libellés des sept statuts, absence de tarif inventé, présentation des cinémas, droits selon le rôle). Les versions historiques incompatibles ne doivent pas être implémentées simultanément. Composants visuels Version de consolidation • PWA iOS & Android 010", "difficulty": "moyen"}, {"id": 29, "cat": "Socle / Design System", "title": "Harmonisation de la taille des icônes dans les boutons circulaires", "explanation": "Tous les écrans de WYLO — Règle graphique globale Bien que toutes les icônes aient été conçues pour adopter des dimensions similaires, leur taille apparente varie actuellement selon les boutons. Par exemple, l'icône « Messagerie » paraît sensiblement plus grande et plus imposante que l'icône « Modifier la séance », alors qu'elles sont affichées dans des boutons circulaires de même nature. Il faut donc harmoniser la taille de toutes les icônes présentes à l'intérieur des boutons circulaires colorés. Règles à appliquer : - Définir une hauteur de référence identique pour toutes les icônes. - Conserver les proportions originales de chaque pictogramme : leur largeur peut naturellement varier selon leur forme, mais leur hauteur doit rester homogène. - Veiller à ce que les icônes soient parfaitement centrées, horizontalement et verticalement, dans leur cercle. - Harmoniser les marges intérieures afin qu'aucune icône ne paraisse disproportionnée par rapport aux autres. - Vérifier également leur taille visuelle réelle : certaines icônes peuvent sembler plus grandes malgré des dimensions techniques identiques, notamment en raison de leur forme ou de leur épaisseur. Cette vérification doit concerner tous les boutons circulaires de WYLO, quelle que soit leur couleur ou leur fonction, sur la Home comme sur les écrans secondaires. Objectif : obtenir une parfaite homogénéité visuelle entre les pictogrammes, en garantissant une hauteur commune et un équilibre graphique constant à l'intérieur des boutons circulaires, sans déformer les icônes ni modifier leurs proportions. Ajouter des critères d’acceptation mesurables À vérifier lors de la recette : le comportement décrit doit respecter l’ensemble des arbitrages finaux du cahier (libellés des sept statuts, absence de tarif inventé, présentation des cinémas, droits selon le rôle). Les versions historiques incompatibles ne doivent pas être implémentées simultanément. Boutons flottants", "difficulty": "facile"}, {"id": 30, "cat": "Demander une séance", "title": "Maintien permanent du bouton flottant « Demander une séance » sur les trois", "explanation": "écrans principaux de WYLO Écrans concernés : Home, Rechercher et Mon profil — Règle globale de navigation 1. Principe général Le bouton rouge « Demander une séance », actuellement présent sur la Home, doit désormais rester systématiquement visible, fixe et accessible sur les trois écrans principaux de WYLO : - Home - Rechercher - Mon profil Ce bouton doit toujours occuper exactement la même position à l'écran, avec les mêmes dimensions, la même icône et la même présentation graphique. Il ne doit jamais se déplacer, disparaître ou être recréé visuellement lors du passage entre ces trois écrans. L'objectif est de donner l'impression qu'il s'agit d'un élément permanent de l'interface, indépendant des écrans qui s'ouvrent derrière lui. 2. Comportement sur la Home Sur la Home, conserver le fonctionnement actuellement défini. Le bouton « Demander une séance » reste flottant, au premier plan, en bas à droite de l'écran. Il ne suit pas le défilement des carrousels et reste toujours accessible, quelle que soit leur position. 3. Comportement sur l'écran « Rechercher » Lorsque l'utilisateur ouvre l'écran secondaire « Rechercher » depuis la Home : - L'écran « Rechercher » glisse depuis le bas selon l'animation habituelle. - Il vient se positionner derrière le bouton flottant « Demander une séance ». - Le bouton conserve exactement sa position initiale. - Il reste visible et cliquable pendant toute la consultation des résultats, y compris lorsque l'utilisateur fait défiler le contenu. Visuellement, l'écran secondaire doit donc donner l'impression de se déployer sous un bouton qui n'a absolument pas bougé. Intérêt fonctionnel : Lorsqu'un utilisateur recherche un film, WYLO lui présente les différentes séances existantes. Si aucune de ces séances ne correspond à ses attentes, il doit pouvoir demander immédiatement une nouvelle programmation, sans fermer sa recherche ni revenir à la Home. Un clic sur « Demander une séance » ouvre alors directement le formulaire correspondant. Conserver également la règle de préremplissage définie précédemment : lorsqu'un seul film distinct est identifié dans les résultats de recherche, ce film est automatiquement renseigné dans le formulaire de demande. En revanche, si plusieurs films différents apparaissent, aucun film ne doit être présélectionné. 4. Version de consolidation • PWA iOS & Android 011", "difficulty": "moyen"}, {"id": 31, "cat": "Socle / Design System", "title": "1 — Harmonisation des intitulés et de l'alignement des titres d'écrans", "explanation": "Périmètre : tous les écrans secondaires de WYLO 1. Principe général Il faut harmoniser définitivement les titres des écrans secondaires. Actuellement, certaines formulations et certains positionnements ne respectent pas exactement les mêmes conventions. Tous les titres principaux doivent suivre une règle commune, aussi bien sur le plan rédactionnel que graphique. 2. Alignement systématique à droite Les titres principaux des écrans secondaires doivent toujours être alignés sur le bord droit de leur zone de contenu. Conserver les conventions graphiques déjà retenues pour WYLO : - Police Montserrat. - Même taille de caractère. - Même graisse. - Même marge à droite. - Même position verticale de référence. - Même petit filet horizontal associé au titre, situé à sa droite, conformément à la maquette validée. L'alignement ne doit jamais varier selon l'écran. Cette règle concerne notamment les écrans « Rechercher », « Demander une séance », « Modifier mon profil », les fiches films, les fiches séances et les fiches cinémas lorsqu'elles disposent d'un titre d'écran distinct de leur contenu. 3. Harmonisation rédactionnelle Les titres désignant une action doivent privilégier les verbes à l'infinitif. Lorsqu'un titre désigne une action portant sur les informations personnelles de l'utilisateur, employer les possessifs à la première personne. Exemples : - « Rechercher » - « Demander une séance » - « Modifier mon profil » - « Modifier mes billets » - « Consulter mes notifications » Éviter les formulations inutilement conjuguées ou rédigées à la deuxième ou troisième personne. L'objectif est de conserver des titres courts, directs et homogènes. 4. Ne pas confondre titres d'écrans et titres de rubriques Cette règle de formulation à l'infinitif s'applique aux titres d'écrans correspondant à une action. Elle ne doit pas entraîner la modification artificielle des noms de rubriques ou des carrousels. Par exemple, les intitulés suivants restent parfaitement valables : - Mes séances - Séances près de chez moi - Séances à programmer - Top films Il n'est pas nécessaire de transformer ces rubriques en verbes. Résultat attendu Tous les écrans secondaires présentent des titres cohérents, parfaitement alignés à droite, de taille et de graisse identiques. Les actions sont désignées par des infinitifs, et les références aux données personnelles sont formulées à la première personne. À vérifier lors de la recette : le comportement décrit doit respecter l’ensemble des arbitrages finaux du cahier (libellés des sept statuts, absence de tarif inventé, présentation des cinémas, droits selon le rôle). Les versions historiques incompatibles ne doivent pas être implémentées simultanément. Version de consolidation • PWA iOS & Android 012", "difficulty": "moyen"}, {"id": 32, "cat": "Home", "title": "Composition fonctionnelle de la Home", "explanation": "La Home présente les accès flottants Demander une séance, Rechercher et Mon profil, puis les quatre ensembles de contenus validés : Mes séances, Séances près de chez moi, Séances à programmer et Top films. Mes séances doit reprendre les demandes et participations de l’utilisateur lorsqu’elles existent. Les séances proches privilégient les projections pertinentes géographiquement. Séances à programmer recense des films sans séance active qui pourraient intéresser l’utilisateur. Top films présente le classement prévu par WYLO. Le contenu de chaque carrousel est distinct : éviter qu’une rubrique présente exactement les mêmes objets que sa voisine sans justification. Les vignettes de séances utilisent toutes les affiches verticales de référence. Boutons flottants", "difficulty": "moyen"}, {"id": 33, "cat": "Socle / Design System", "title": "Comportement fixe des boutons flottants et superpositions", "explanation": "Les boutons Rechercher et Demander une séance conservent leur position et leur premier plan pendant le scroll. Le bouton de profil suit le comportement visuel arrêté pour la Home ; aucun ancien fondu ne doit être réintroduit. Lorsqu’un écran Rechercher, Mon profil ou Fiche cinéma est ouvert, le bouton principal Demander une séance reste accessible à la position globale prévue, au-dessus du cartouche. L’ouverture du formulaire de demande ne doit pas changer de place ou de taille selon son origine. Carrousels et ordre", "difficulty": "moyen"}, {"id": 34, "cat": "Socle / Design System", "title": "Séances à programmer : recommandation de films sans séance", "explanation": "Ce carrousel remplace l’ancien nom « Films qui devraient me plaire ». Il présente des films sans séance active plutôt que de fausses séances : le clic ouvre la fiche film, dépourvue d’informations de programmation inexistantes. Le classement est personnalisé à partir des préférences déclarées et, lorsqu’il existe, de l’historique des films demandés, rejoints ou vus. Les genres sont des signaux majeurs ; réalisateurs, scénaristes, acteurs et autres caractéristiques peuvent affiner la pertinence. Pour un nouveau compte, prévoir un classement de repli. Le nombre de suggestions doit être extensible, sans imposer un top arbitrairement limité. Les films pour lesquels une séance est créée sortent du périmètre du carrousel selon la logique de recherche retenue. Compléments et contrôles historiques Version de consolidation • PWA iOS & Android 013", "difficulty": "moyen"}, {"id": 35, "cat": "Socle / Design System", "title": "Resserrement de l’espacement des vignettes du Top 10", "explanation": "Reprendre comme référence l’espacement compact qui existait initialement entre les vignettes 1 à 9 du Top 10 et l’appliquer à toute la rangée. Les dix affiches doivent présenter un espacement régulier et resserré. Pour la dixième vignette, décaler l’affiche vers le « 1 » du nombre 10, quitte à recouvrir davantage le nombre. Sa position doit permettre de conserver le même écart avec la neuvième affiche qu’entre toutes les précédentes. La largeur du nombre 10 ne doit pas entraîner un élargissement des espacements de la rangée. Sur l’écran secondaire « Compte » : Critère de recette : reproduire ce parcours sur iOS et Android, vérifier la lisibilité, la persistance des choix et le retour vers l’écran d’origine. Si une ancienne formulation diffère d’une règle arbitrée au 23 octobre, appliquer cette règle arbitrée, non la formulation historique.", "difficulty": "facile"}, {"id": 36, "cat": "Demander une séance", "title": "Position fixe et flottante du bouton « Demander une séance »", "explanation": "Écran secondaire « Fiche film » — Film sans séance associée Actuellement, le bouton « Demander une séance » apparaît en haut de la fiche film. Il doit impérativement être repositionné au même emplacement que sur la Home. Ce bouton doit conserver une position fixe et flottante, indépendamment du contenu de la fiche. L'effet recherché est le suivant : lorsqu'on ouvre une fiche film depuis la Home, celle-ci semble se déployer derrière le bouton « Demander une séance », qui reste visuellement à sa place. Le même principe doit s'appliquer au bouton permettant de rejoindre une séance. Ces deux boutons doivent donc partager une position de référence unique, identique sur tous les écrans concernés, et rester fixes pendant le défilement du contenu. Critère de recette : reproduire ce parcours sur iOS et Android, vérifier la lisibilité, la persistance des choix et le retour vers l’écran d’origine. Si une ancienne formulation diffère d’une règle arbitrée au 23 octobre, appliquer cette règle arbitrée, non la formulation historique. Classements", "difficulty": "moyen"}, {"id": 37, "cat": "Socle / Design System", "title": "Correction et harmonisation du classement « Top 10 » des films", "explanation": "Écran principal « Home » — Carrousel « Top 10 » Une incohérence a été constatée lors des tests de WYLO : deux utilisateurs consultant l'application au même moment n'obtiennent pas le même classement dans le carrousel « Top 10 ». Ce comportement est anormal, puisque le Top 10 doit être un classement global, identique pour tous les utilisateurs de WYLO. Il faut donc vérifier l'origine de cette différence et corriger le fonctionnement du classement. 1. Rappel de la règle fondamentale du Top 10 Le Top 10 doit présenter les dix films ayant réuni le plus grand nombre de spectateurs sur WYLO. Il ne s'agit surtout pas de classer les films selon le nombre de séances demandées, créées ou organisées. Le seul critère de classement est le nombre total de spectateurs réunis par chaque film, toutes ses séances confondues. Par exemple : - Un film ayant réuni 120 spectateurs sur 3 séances doit être mieux classé qu'un film ayant réuni 80 spectateurs sur 10 séances. - Si un même film est projeté dans plusieurs cinémas ou à différentes dates, les spectateurs de toutes ces séances doivent être comptabilisés ensemble. Le classement doit donc être calculé par film, et non par séance. 2. Un classement unique pour tous les utilisateurs Contrairement au carrousel « Des séances à programmer », dont le classement est personnalisé en fonction des affinités cinématographiques de chaque utilisateur, le Top 10 ne doit faire l'objet d'aucune personnalisation. Il doit être strictement identique pour tous, indépendamment : - De leur ville ou de leur cinéma. - De leurs préférences cinématographiques. - De leur historique de participation. - De leurs relations d'amitié. Il s'agit d'un classement global de l'activité de WYLO, et non d'une sélection individuelle. 3. Vérification de l'origine de l'anomalie Plusieurs causes possibles doivent être examinées : - Un classement actuellement personnalisé selon l'utilisateur. - Un filtrage géographique appliqué involontairement. - Une différence dans les données chargées ou leur actualisation. - Un problème de cache conservant des classements différents. - Une Version de consolidation • PWA iOS & Android 014", "difficulty": "facile"}, {"id": 38, "cat": "Socle / Design System", "title": "Résultats de recherche : aucun visuel avant une action", "explanation": "À l’ouverture de Rechercher, le carrousel de résultats est absent. Les premières vignettes apparaissent uniquement quand l’utilisateur commence à saisir un texte ou sélectionne au moins un filtre ; lorsque texte et filtres sont effacés, les résultats disparaissent. Dès l’apparition du premier résultat, un espace s’ouvre sous le titre, le carrousel s’y déploie et le champ textuel glisse vers le bas. Les vignettes sont donc visuellement situées entre le titre de l’écran et le champ de recherche. Le titre et le carrousel demeurent fixés pendant le défilement intérieur. Le champ et les filtres passent derrière cette zone en disparaissant progressivement sous le flou blanc prévu. Moteur de recherche", "difficulty": "moyen"}, {"id": 39, "cat": "Socle / Design System", "title": "Indexation du moteur : français, titre original et nationalité", "explanation": "Le moteur doit permettre de retrouver un film par son titre français ou son titre original, même lorsque ces titres sont très différents. Les variantes d’accents et de casse ne doivent pas empêcher un résultat. En revanche, l’application présente toujours le titre français lorsque celui-ci existe. Étendre la recherche textuelle aux attributs utiles, notamment réalisateur, interprètes, année et nationalité. La nationalité doit être recherchable par le champ textuel général : ne pas réintroduire un filtre Nationalités séparé, qui a été retiré. Vérifier la cohérence des genres cinématographiques entre indexation, suggestion et affichage des films ; corriger les divergences de vocabulaire plutôt que dupliquer des catégories. Filtres", "difficulty": "moyen"}, {"id": 40, "cat": "Rechercher", "title": "Filtres : sélections multiples et libellés au pluriel", "explanation": "Employer les intitulés Statuts des séances, Villes, Cinémas, Jours, Plages horaires, Versions et Classifications dès lors que plusieurs choix sont possibles. Conserver Tarif maximum et Places restantes pour les seuils numériques. Plusieurs valeurs dans une même catégorie s’additionnent selon une logique OU ; entre catégories, les critères sont combinés par une logique ET. Aucun filtre non choisi ne doit bloquer les résultats. Les statuts couvrent les sept catégories arrêtées, dont Séance à programmer. Conserver l’interface effectivement utilisée : une sélection referme le volet, la valeur apparaît dans un bouton rouge ; appuyer sur ce bouton rouvre le volet ; appuyer de nouveau sur une option sélectionnée la désélectionne. Ne pas lancer de refonte supplémentaire de ce fonctionnement. Résultats et mise en page Version de consolidation • PWA iOS & Android 016", "difficulty": "moyen"}, {"id": 41, "cat": "Socle / Design System", "title": "Vignettes de résultats : une séance par vignette et deux informations", "explanation": "Chaque résultat de séance affiche l’affiche du film, même si plusieurs séances d’un même film sont proposées. Un cartouche discret superposé contient exactement le nom du cinéma et la date de projection afin de différencier deux affiches identiques. Ne pas ajouter systématiquement l’horaire, la ville, un compteur ou le statut dans ce petit cartouche : ces informations demeurent dans la fiche séance et les filtres. Le clic sur une vignette ouvre directement cette séance, non une fiche film intermédiaire. Exception : la catégorie « Séance à programmer » renvoie à un film non programmé ; elle ouvre donc la fiche film correspondante. Filtres", "difficulty": "moyen"}, {"id": 42, "cat": "Fiche Cinéma", "title": "Sélecteur de cinéma : photographie et choix de source", "explanation": "Une fois sélectionné, le cinéma est représenté par sa vignette horizontale 16:9 plutôt que par le simple bouton nominal anciennement utilisé. Sur la vignette de taille suffisante, le nom apparaît dans un discret cartouche intégré à l’image. Les cinémas proposés comme filtre de recherche doivent être identifiés par leur référence unique. Les cinémas non partenaires peuvent apparaître dans les préférences ou fiches, mais ne doivent pas être présentés comme éligibles à une nouvelle demande de projection. Compléments et contrôles historiques", "difficulty": "moyen"}, {"id": 43, "cat": "Rechercher", "title": "Rapprochement du champ textuel et du carrousel dans « Rechercher »", "explanation": "Dans l’écran secondaire « Rechercher », remonter légèrement le champ de saisie pour réduire l’espace vertical qui le sépare du carrousel de vignettes et former un ensemble visuellement plus compact. Critère de recette : reproduire ce parcours sur iOS et Android, vérifier la lisibilité, la persistance des choix et le retour vers l’écran d’origine. Si une ancienne formulation diffère d’une règle arbitrée au 23 octobre, appliquer cette règle arbitrée, non la formulation historique.", "difficulty": "moyen"}, {"id": 44, "cat": "Socle / Design System", "title": "Ouverture directe de la fiche-séance depuis les résultats de recherche", "explanation": "Dans l’écran secondaire « Rechercher », un appui sur une vignette correspondant à une séance doit ouvrir directement la fiche-séance associée aux critères sélectionnés, avec ses informations de ville, de cinéma, de date et d’horaire. Scénario à reproduire : filtres de séance sélectionnés, ville « Toulouse », cinéma « Pathé l’Étang », aucun jour choisi et plage horaire « Midi ». Un appui sur le résultat « Le Réveil » ouvre actuellement la fiche-film. Corriger cette navigation pour que chaque résultat de séance conduise à la séance concernée, sans passage intermédiaire par la fiche-film. Critère de recette : reproduire ce parcours sur iOS et Android, vérifier la lisibilité, la persistance des choix et le retour vers l’écran d’origine. Si une ancienne formulation diffère d’une règle arbitrée au 23 octobre, appliquer cette règle arbitrée, non la formulation historique. Version de consolidation • PWA iOS & Android 017", "difficulty": "moyen"}, {"id": 45, "cat": "Socle / Design System", "title": "Raccourcissement du texte indicatif défilant dans le champ de recherche", "explanation": "Dans le champ textuel de l’écran « Rechercher », supprimer les articles « un » et « une », ainsi que la mention distincte « Titre original », pour raccourcir le texte qui défile. Faire apparaître les termes dans cet ordre : Titre → Réalisateur → Scénariste → Acteur → Genre → Année. Critère de recette : reproduire ce parcours sur iOS et Android, vérifier la lisibilité, la persistance des choix et le retour vers l’écran d’origine. Si une ancienne formulation diffère d’une règle arbitrée au 23 octobre, appliquer cette règle arbitrée, non la formulation historique. Recherche et sélection", "difficulty": "moyen"}, {"id": 46, "cat": "Socle / Design System", "title": "Autocomplétion des villes à partir d’une base nationale de référence", "explanation": "Dans l’écran « Rechercher », relier le champ « Ville » à une base nationale de référence, comme demandé pour les villes du profil. Dès les premiers caractères saisis, afficher les propositions correspondantes sous le champ. L’utilisateur doit sélectionner une ville proposée pour valider son choix : un texte saisi librement ne doit pas pouvoir être enregistré comme une ville. L’objectif est d’éviter les fautes d’orthographe et les noms non reconnus par le système. Choisir une source ouverte et réutiliser le même référentiel dans la recherche et le profil. Critère de recette : reproduire ce parcours sur iOS et Android, vérifier la lisibilité, la persistance des choix et le retour vers l’écran d’origine. Si une ancienne formulation diffère d’une règle arbitrée au 23 octobre, appliquer cette règle arbitrée, non la formulation historique.", "difficulty": "moyen"}, {"id": 47, "cat": "Fiche Cinéma", "title": "Recherche des cinémas dans un catalogue de référence", "explanation": "Relier le champ « Cinéma » à un catalogue de cinémas référencés, dont la source reste à définir. Afficher les établissements correspondants au fur et à mesure de la saisie. Les propositions ne doivent pas se limiter aux cinémas disposant actuellement de films ou de séances sur WYLO. L’utilisateur doit pouvoir sélectionner un cinéma référencé même si aucun résultat n’est disponible. Dans ce cas, afficher un message explicite indiquant qu’aucun résultat ne correspond à ce cinéma avec les critères sélectionnés, plutôt que d’empêcher sa sélection. Critère de recette : reproduire ce parcours sur iOS et Android, vérifier la lisibilité, la persistance des choix et le retour vers l’écran d’origine. Si une ancienne formulation diffère d’une règle arbitrée au 23 octobre, appliquer cette règle arbitrée, non la formulation historique.", "difficulty": "moyen"}, {"id": 48, "cat": "Socle / Design System", "title": "Affichage des horaires couverts par chaque plage horaire", "explanation": "Afficher sous chaque intitulé de plage horaire les bornes qui le définissent. La plage Soirée se termine à 22h00 ; la plage Nuit commence à 22h00. Conserver partout les mêmes conventions de notation des heures. Ne pas rouvrir l’ancien arbitrage entre 22h00 et 23h00. Critère de recette : reproduire ce parcours sur iOS et Android, vérifier la lisibilité, la persistance des choix et le retour vers l’écran d’origine. Si une ancienne formulation diffère d’une règle arbitrée au 23 octobre, appliquer cette règle arbitrée, non la formulation historique. Filtres Version de consolidation • PWA iOS & Android 018", "difficulty": "moyen"}, {"id": 49, "cat": "Rechercher", "title": "Écran secondaire « Rechercher » — Filtre « Statut de la séance » Le filtre « Statut de la séance » doit désormais", "explanation": "proposer l'intégralité des sept catégories définies pour WYLO. Boutons à afficher Présenter les sept boutons suivants, dans cet ordre : 1. Séance à programmer 2. Séance demandée 3. Séance refusée 4. Séance en cours de confirmation 5. Séance confirmée 6. Séance à guichets fermés 7. Séance passée Fonctionnement attendu Séance à programmer Afficher les films ne disposant d'aucune programmation active correspondant au périmètre recherché. Un clic ouvre la fiche film, avec la possibilité de demander une séance. Séance demandée Afficher les demandes transmises aux exploitants, mais encore en attente de réponse. Les spectateurs peuvent consulter ces demandes et éventuellement s'y préinscrire. Séance refusée Afficher les demandes refusées par les exploitants. Cela permet aux utilisateurs de connaître les précédentes tentatives de programmation d'un film. Le refus d'une séance n'interdit pas d'effectuer ultérieurement une autre demande concernant le même film. Séance en cours de confirmation Afficher uniquement les séances acceptées par les exploitants, pour lesquelles une jauge minimale existe mais n'est pas encore atteinte. Séance confirmée Afficher les séances dont la tenue est confirmée et auxquelles il reste possible de s'inscrire. Séance à guichets fermés Afficher les séances encore à venir, mais dont toutes les places disponibles sont déjà prises. Séance passée Afficher les séances ayant effectivement eu lieu. Comportement des filtres Conserver les conventions de sélection définies précédemment : - Aucun statut sélectionné par défaut. - Possibilité de sélectionner plusieurs statuts simultanément. - Un clic sélectionne une option. - Un nouveau clic sur la même option la désélectionne. - Les sélections sont regroupées dans un bouton récapitulatif unique lorsque le volet est refermé. - Ce bouton permet de rouvrir le volet. - Aucune petite croix de suppression ne doit apparaître. Les résultats doivent correspondre à au moins l'un des statuts sélectionnés. Distinction entre fiches films et fiches séances Le statut « Séance à programmer » ouvre une fiche film. Les six autres statuts ouvrent directement la fiche de la séance concernée. À vérifier lors de la recette : le comportement décrit doit respecter l’ensemble des arbitrages finaux du cahier (libellés des sept statuts, absence de tarif inventé, présentation des cinémas, droits selon le rôle). Les versions historiques incompatibles ne doivent pas être implémentées simultanément. Moteur de recherche", "difficulty": "difficile"}, {"id": 50, "cat": "Socle / Design System", "title": "Recherche textuelle multicritère Permettre la recherche par titre, réalisateur, acteur et genre. Faire défiler doucement le texte indicatif du", "explanation": "champ lorsqu’il est trop long pour être entièrement visible. Justification et critère de contrôle : ce point figurait dans un cahier de développement antérieur mais n’est pas suffisamment explicité dans les tickets récents. L’examiner dans son écran et son sous-écran, avec un scénario réel et les droits liés au statut de la séance. Si sa formulation antérieure diverge de la décision du 23 octobre, cette dernière prévaut.", "difficulty": "moyen"}, {"id": 51, "cat": "Rechercher", "title": "Exhaustivité du filtre Nationalité", "explanation": "L’ancien ticket décrit un filtre Nationalité distinct. Décision postérieure : ne pas créer ce filtre séparé ; intégrer la nationalité au périmètre de la recherche textuelle par mots-clés. Justification et critère de contrôle : ce point figurait dans un cahier de développement antérieur mais n’est pas suffisamment explicité dans les tickets récents. L’examiner dans son écran et son sous-écran, avec un scénario réel et les droits liés au statut de la séance. Si sa formulation antérieure diverge de la décision du 23 octobre, cette dernière prévaut. Version de consolidation • PWA iOS & Android 019", "difficulty": "moyen"}, {"id": 52, "cat": "Socle / Design System", "title": "Indexation des titres français et originaux", "explanation": "Indexer le titre français et le titre original lorsqu’il existe. Permettre de retrouver un film indépendamment de la présence ou de l’absence d’accents dans la recherche. 05 Demande de séance et paiement 8 tickets Justification et critère de contrôle : ce point figurait dans un cahier de développement antérieur mais n’est pas suffisamment explicité dans les tickets récents. L’examiner dans son écran et son sous-écran, avec un scénario réel et les droits liés au statut de la séance. Si sa formulation antérieure diverge de la décision du 23 octobre, cette dernière prévaut. Version de consolidation • PWA iOS & Android 020", "difficulty": "difficile"}, {"id": 53, "cat": "Fiche Film", "title": "Fiche film : priorité aux carrousels par état", "explanation": "Une fiche film présente d’abord le film et ses informations indispensables, puis l’ensemble de ses séances existantes regroupées dans les six catégories : demandées, refusées, en cours de confirmation, confirmées, à guichets fermés et passées. Une catégorie vide disparaît intégralement, titre compris, et les sections suivantes remontent. « À programmer » ne correspond pas à une séance réelle : ne jamais fabriquer de carte de projection pour cette catégorie. L’objectif premier de cette fiche est de répondre à la question « Où puis-je voir ce film ? », non de dérouler un dossier encyclopédique avant la programmation.", "difficulty": "facile"}, {"id": 54, "cat": "Socle / Design System", "title": "En-tête du film : informations essentielles toujours visibles", "explanation": "Conserver le titre du film, puis l’année, la durée, le genre et une éventuelle restriction d’âge. Ne pas afficher la mention « Tout public » lorsqu’aucune interdiction ne s’applique. Le lien « Plus d’infos » se situe SOUS cette ligne de caractéristiques, et non directement sous le titre. Un clic déploie uniquement les crédits artistiques et le synopsis ; « Moins d’infos », placé à la fin du contenu ouvert, le referme. Le bloc doit se déployer dans la fiche sans changer les règles des carrousels sous-jacents. Les noms des personnalités peuvent ouvrir leurs fiches associées lorsque cette fonctionnalité est disponible. Carrousels et navigation", "difficulty": "moyen"}, {"id": 55, "cat": "Fiche Cinéma", "title": "Carrousels d’un film : vignettes de cinémas horizontales", "explanation": "À l’intérieur des six carrousels, chaque séance est représentée par une vignette horizontale 16:9 avec photographie du cinéma et nom de l’établissement, ville, date et horaire ou plage horaire superposés. Une même salle peut apparaître plusieurs fois, avec des jours différents. La largeur souhaitée d’une carte correspond approximativement à celle de deux vignettes verticales de la Home côte à côte avec leur espacement. Une vignette entière et une amorce de la suivante doivent être visibles pour signaler le glissement horizontal. Prévoir un flou ou un dégradé localisé sous les textes pour garantir leur contraste. Un clic sur cette carte ouvre la fiche de LA séance concernée, non la fiche cinéma. Bande-annonce Version de consolidation • PWA iOS & Android 021", "difficulty": "facile"}, {"id": 56, "cat": "Fiche Film", "title": "Bande-annonce par rotation du téléphone Sur fiche film comme sur fiche séance, le passage du smartphone en paysage déclenche l’affichage et, lorsque", "explanation": "le navigateur le permet, la lecture automatique de la bande-annonce. Le retour au portrait ferme la vue vidéo et restaure la position de la fiche. Une PWA peut se heurter aux limitations de lecture automatique avec son ; prévoir un comportement explicite et compatible plutôt qu’un faux lancement. S’il n’existe aucune bande-annonce, ne pas ouvrir un écran vide. Tester les orientations successives et éviter la lecture simultanée de plusieurs instances. Compléments et contrôles historiques", "difficulty": "moyen"}, {"id": 57, "cat": "Socle / Design System", "title": "Navigation depuis les noms des réalisateurs, scénaristes et acteurs", "explanation": "Rendre les noms des réalisateurs, scénaristes et acteurs cliquables sur les fiches-film et les fiches-séance. Un appui sur un nom ouvre un nouvel écran secondaire présentant les autres films et les séances associés à cette personne, selon le fonctionnement habituel des écrans superposés. Chaque résultat doit permettre d’ouvrir directement la fiche du film ou de la séance correspondante, pour poursuivre la découverte depuis la fiche initialement consultée. Sur l’écran principal = Home : Critère de recette : reproduire ce parcours sur iOS et Android, vérifier la lisibilité, la persistance des choix et le retour vers l’écran d’origine. Si une ancienne formulation diffère d’une règle arbitrée au 23 octobre, appliquer cette règle arbitrée, non la formulation historique.", "difficulty": "moyen"}, {"id": 58, "cat": "Socle / Design System", "title": "Présentation des crédits avec les mentions « De », « Par » et « Avec »", "explanation": "Sur les fiches-film et les fiches-séance, supprimer les titres de rubriques « Réalisation », « Scénario » et « Distribution ». Reprendre la présentation compacte des maquettes : - « De », suivi du ou des réalisateurs. - « Par », suivi du ou des scénaristes. - « Avec », suivi des acteurs. Les mentions introductives restent en graisse normale, tandis que les noms apparaissent en gras et sont cliquables, conformément au ticket précédent. Aligner ces trois entrées à gauche, avec des espacements réguliers. Autoriser le retour à la ligne lorsque la liste des noms le nécessite, notamment pour les acteurs. Critère de recette : reproduire ce parcours sur iOS et Android, vérifier la lisibilité, la persistance des choix et le retour vers l’écran d’origine. Si une ancienne formulation diffère d’une règle arbitrée au 23 octobre, appliquer cette règle arbitrée, non la formulation historique.", "difficulty": "facile"}, {"id": 59, "cat": "Demander une séance", "title": "Suppression du libellé et positionnement flottant de l’icône « Demander une séance » sur les fiches-film", "explanation": "Sur les fiches-film, supprimer le texte « Demander une séance » et conserver uniquement l’icône cliquable. La placer en bas à droite, au même emplacement que sur la Home. Elle doit rester flottante et fixe à l’écran pendant le défilement, toujours visible et accessible au-dessus du contenu de la fiche. Critère de recette : reproduire ce parcours sur iOS et Android, vérifier la lisibilité, la persistance des choix et le retour vers l’écran d’origine. Si une ancienne formulation diffère d’une règle arbitrée au 23 octobre, appliquer cette règle arbitrée, non la formulation historique. Version de consolidation • PWA iOS & Android 022", "difficulty": "moyen"}, {"id": 60, "cat": "Socle / Design System", "title": "Suppression de la mention « Tout public » Écran secondaire « Ma séance » Supprimer systématiquement la mention « Tout public », qui alourdit", "explanation": "inutilement l'interface sans apporter d'information véritablement utile. En revanche, lorsqu'un film fait l'objet d'une restriction d'âge ou d'un avertissement particulier, cette information doit apparaître dans un petit cartouche entouré d'un filet blanc, conformément à la présentation prévue. Principe : ne signaler que les restrictions ou avertissements réels. En l'absence de restriction ou d'avertissement, aucun cartouche ne doit apparaître. Critère de recette : reproduire ce parcours sur iOS et Android, vérifier la lisibilité, la persistance des choix et le retour vers l’écran d’origine. Si une ancienne formulation diffère d’une règle arbitrée au 23 octobre, appliquer cette règle arbitrée, non la formulation historique. Structure de la fiche", "difficulty": "facile"}, {"id": 61, "cat": "Demander une séance", "title": "Écran secondaire « Demander une séance » Actuellement, lorsqu'on ouvre le formulaire « Demander une", "explanation": "séance », le libellé « Film » apparaît au-dessus de la vignette du film sélectionné. Il faut supprimer ce libellé, qui n'apporte aucune information utile puisque la vignette et le titre permettent déjà d'identifier immédiatement le film concerné. Conserver la vignette et les informations associées, sans modifier leur présentation. Après suppression, ajuster les espacements afin de ne pas laisser de vide inutile à l'emplacement de l'ancien libellé. Objectif : alléger l'interface en supprimant une indication redondante, conformément au principe de sobriété graphique adopté pour WYLO. Préciser l'emplacement exact dans l’écran À vérifier lors de la recette : le comportement décrit doit respecter l’ensemble des arbitrages finaux du cahier (libellés des sept statuts, absence de tarif inventé, présentation des cinémas, droits selon le rôle). Les versions historiques incompatibles ne doivent pas être implémentées simultanément. Classification", "difficulty": "moyen"}, {"id": 62, "cat": "Socle / Design System", "title": "Harmonisation et simplification du cartouche d'avertissement lié aux restrictions", "explanation": "d'âge Écrans secondaires « Fiche film », « Fiche séance » et « Demander une séance » Actuellement, lorsqu'un film fait l'objet d'une restriction d'âge, un cartouche explicatif apparaît avec un fond rose, qui ne correspond pas à la charte graphique de WYLO. Par ailleurs, le texte affiché semble trop long et se retrouve partiellement coupé à l'intérieur du cartouche. Il faut revoir à la fois sa présentation graphique et son contenu. 1. Harmonisation graphique du cartouche - Supprimer le fond rose, qui ne correspond pas à l'identité visuelle de WYLO. - Privilégier un fond gris neutre ou sombre, cohérent avec la charte graphique. - Conserver les conventions habituelles concernant les arrondis, les marges et la typographie. - Veiller à ce que le texte soit intégralement visible, sans troncature ni débordement. - Adapter automatiquement la hauteur du cartouche à son contenu plutôt que de couper le texte. Le cartouche doit rester discret tout en attirant suffisamment l'attention sur la restriction. 2. Simplification du message Il n'est pas nécessaire de développer de longues explications puisque les conditions générales d'utilisation de WYLO précisent déjà les règles applicables. Le message doit simplement rappeler la restriction d'âge et les conséquences possibles de son non- respect. Texte proposé : « Attention : ce film est interdit aux moins de [âge] ans. Ne réserve pas de place pour une personne n'ayant pas l'âge requis. L'accès à la salle pourra lui être refusé. » L'âge indiqué doit naturellement correspondre à la classification officielle du film (-12, -16 ou -18 ans, selon le cas). Version de consolidation • PWA iOS & Android 023", "difficulty": "moyen"}, {"id": 63, "cat": "Socle / Design System", "title": "2 — Rétablissement du lancement automatique des bandes-annonces en", "explanation": "orientation paysage Écrans concernés : Fiche film et Fiche séance — PWA WYLO sur smartphone 1. Rappel de la fonctionnalité précédemment demandée Nous avions défini un comportement spécifique concernant la lecture des bandes-annonces. Lorsqu'un utilisateur consulte une fiche film ou une fiche séance et fait pivoter son téléphone en orientation horizontale, la bande-annonce du film doit se lancer automatiquement. Cette fonctionnalité semble avoir disparu dans la version actuelle de WYLO. Il faut donc vérifier ce qui a provoqué sa disparition et rétablir le comportement précédemment demandé. 2. Déclenchement en orientation paysage Le fonctionnement attendu est le suivant : Lorsque le téléphone est en orientation portrait : L'utilisateur consulte normalement la fiche film ou la fiche séance, avec sa présentation verticale habituelle. Lorsqu'il pivote le téléphone en orientation paysage : WYLO doit détecter ce changement d'orientation et basculer automatiquement vers la lecture de la bande-annonce du film concerné. L'utilisateur ne doit pas avoir à rechercher un bouton supplémentaire pour lancer la vidéo. 3. Affichage de la bande-annonce En orientation paysage, la bande-annonce doit bénéficier d'un affichage adapté à la largeur de l'écran. L'objectif est de permettre une véritable consultation vidéo, sans conserver inutilement les éléments de la fiche au premier plan. La vidéo doit utiliser au mieux l'espace disponible, tout en respectant son format d'origine. Il faut notamment éviter : - Une bande-annonce affichée dans une toute petite fenêtre. - Des éléments de l'interface masquant la vidéo. - Une vidéo déformée pour remplir artificiellement l'écran. - Une superposition incorrecte des boutons flottants. Les commandes de lecture doivent rester accessibles lorsque cela est nécessaire. 4. Retour en orientation portrait Lorsque l'utilisateur remet son téléphone à la verticale : - La lecture de la bande-annonce s'interrompt. - L'affichage vidéo se referme. - L'utilisateur retrouve automatiquement la fiche film ou la fiche séance qu'il consultait. - Sa position de défilement et l'état des informations déployées doivent être conservés autant que possible. Il ne faut pas revenir à la Home, rouvrir une nouvelle fiche ou réinitialiser le parcours. À vérifier lors de la recette : le comportement décrit doit respecter l’ensemble des arbitrages finaux du cahier (libellés des sept statuts, absence de tarif inventé, présentation des cinémas, droits selon le rôle). Les versions historiques incompatibles ne doivent pas être implémentées simultanément. Version de consolidation • PWA iOS & Android 024", "difficulty": "moyen"}, {"id": 64, "cat": "Socle / Design System", "title": "Sept catégories distinctes pour les séances et les films à programmer", "explanation": "Les statuts côté spectateur sont : 1. Séance à programmer (film sans séance active) ; 2. Séance demandée ; 3. Séance refusée ; 4. Séance en cours de confirmation ; 5. Séance confirmée ; 6. Séance à guichets fermés ; 7. Séance passée. Le premier est une catégorie de découverte de films, pas un état métier d’une séance existante. Les états internes du système peuvent être plus précis, mais les libellés exposés dans WYLO doivent être uniformes. Une séance refusée n’est pas « passée » : elle n’a pas eu lieu. De même, une séance annulée après acceptation doit être traitée distinctement ; la politique exacte d’annulation reste à spécifier si elle n’est pas documentée.", "difficulty": "facile"}, {"id": 65, "cat": "Socle / Design System", "title": "Séance demandée : préinscrits mais aucune jauge définitive", "explanation": "Après création d’une demande et avant acceptation de l’exploitant, présenter son film, son établissement, la date ou plage horaire proposée et le nombre de personnes préinscrites. La jauge minimale n’est pas encore connue et ne peut pas figurer dans un compteur de type X/Y. Aucune barre de progression ne doit apparaître dans cet état, puisqu’il n’existe pas de seuil validé par le cinéma. Les nouveaux utilisateurs peuvent se préinscrire en passant par « Prépayer », sans débit bancaire immédiat.", "difficulty": "facile"}, {"id": 66, "cat": "Socle / Design System", "title": "Séance en cours de confirmation : jauge minimale et progression", "explanation": "L’exploitant a accepté la demande, fixé les modalités exactes et le seuil minimal de participants, mais ce seuil n’est pas encore atteint. Afficher clairement le nombre de préinscrits rapporté à cette jauge minimale : par exemple « 20 préinscrits sur 30 ». La barre indique la progression vers la jauge minimale, jamais vers la capacité totale de la salle. Le nombre, le statut et la barre précèdent le carrousel des participants. Les inscriptions supplémentaires se font en prépaiement, sans débit immédiat.", "difficulty": "difficile"}, {"id": 67, "cat": "Socle / Design System", "title": "Séance confirmée, pleine, refusée et passée", "explanation": "Lorsque la jauge minimale est atteinte, la séance est confirmée : retirer la barre, présenter le nombre réel d’inscrits, autoriser les nouvelles inscriptions payées immédiatement tant que des places demeurent disponibles. Une séance « À guichets fermés » a atteint la capacité maximale : aucune nouvelle place ni modification ; la seule action disponible sur la fiche est Chatter. Une séance refusée reste consultable à titre d’historique sans permettre de rejoindre ou de payer ; une séance passée correspond à une projection réellement déroulée. Version de consolidation • PWA iOS & Android 025", "difficulty": "facile"}, {"id": 68, "cat": "Blocage / Signalement", "title": "Participants : vrais avatars, amitiés, blocage et ordre", "explanation": "Afficher les vrais participants, avec leurs photos réelles, sans avatars fictifs. Les amis de l’utilisateur connecté apparaissent en premier, triés par nombre de séances communes décroissant, puis par prénom ; les autres suivent par ordre alphabétique. Les personnes personnellement bloquées conservent leur position normale dans le classement. Leur avatar reçoit l’indicateur visuel de blocage prévu, uniquement sur l’interface de la personne qui a bloqué ; il ne faut pas faire remonter ces personnes artificiellement en tête. Un clic sur un avatar non bloqué ouvre son profil selon les règles d’accès. Un avatar bloqué propose une confirmation de déblocage plutôt que de révéler un profil normalement interdit.", "difficulty": "difficile"}, {"id": 69, "cat": "Socle / Design System", "title": "Amitié réciproque créée dès la participation commune", "explanation": "Deux personnes deviennent automatiquement amies dès qu’elles figurent ensemble sur une même séance, y compris à la préinscription et avant acceptation de l’exploitant. Il n’existe pas de bouton permettant de demander l’amitié ou d’ajouter manuellement un ami. Une relation créée à l’occasion d’une séance refusée reste acquise tant qu’aucun blocage n’intervient. Un blocage coupe l’amitié et la messagerie privée ; il n’empêche pas la participation commune à une autre séance et ne doit pas recréer automatiquement le lien. Vérifier la réciprocité technique des listes d’amis ; elles ne doivent jamais montrer une relation présente pour un utilisateur mais absente pour l’autre. Compléments et contrôles historiques", "difficulty": "difficile"}, {"id": 70, "cat": "Socle / Design System", "title": "Affichage de la ville sur les fiches-séance", "explanation": "Ajouter systématiquement la ville du cinéma dans le bloc d’informations principales, visible dès l’ouverture de la fiche-séance. Reprendre la disposition du dernier visuel de référence : - Première ligne : la date, suivie de l’horaire exact ou de la plage horaire. - Ligne suivante : « Ville | Cinéma » à gauche, et le tarif à droite, sous l’icône rouge « Rejoindre la séance ». La ville doit précéder le nom du cinéma et être immédiatement identifiable, sans nécessiter de scroll. Critère de recette : reproduire ce parcours sur iOS et Android, vérifier la lisibilité, la persistance des choix et le retour vers l’écran d’origine. Si une ancienne formulation diffère d’une règle arbitrée au 23 octobre, appliquer cette règle arbitrée, non la formulation historique.", "difficulty": "facile"}, {"id": 71, "cat": "Socle / Design System", "title": "Harmonisation du positionnement et de la typographie", "explanation": "Reprendre la hiérarchie du visuel : titre du film en grand et en gras, puis date en gras et plage horaire en graisse normale sur une même ligne. Le bloc
