 préférable d'employer le terme « utilisateur », plus cohérent avec le fonctionnement d'une application. Adopter les formulations suivantes : - « Bloquer l'utilisateur » - « Signaler cet utilisateur aux administrateurs » Ces formulations doivent être reprises de manière cohérente dans tous les écrans et fenêtres de confirmation concernés. Critère de recette : reproduire ce parcours sur iOS et Android, vérifier la lisibilité, la persistance des choix et le retour vers l’écran d’origine. Si une ancienne formulation diffère d’une règle arbitrée au 23 octobre, appliquer cette règle arbitrée, non la formulation historique.", "difficulty": "moyen"}, {"id": 149, "cat": "Blocage / Signalement", "title": "Simplification et correction du message de confirmation de blocage", "explanation": "Fenêtre de confirmation « Bloquer l'utilisateur » Le texte explicatif actuel doit être corrigé et simplifié. En particulier, il ne faut plus indiquer que les deux utilisateurs ne pourront plus s'inviter. En effet, WYLO ne dispose pas d'un véritable système d'invitation interne : les invitations se font par le partage de liens en dehors de l'application. Il reste donc techniquement possible de transmettre un lien à une personne bloquée. Il est préférable de préciser les conséquences réelles du blocage : suppression de la relation d'amitié, impossibilité d'échanger des messages et absence de notifications liées à cet utilisateur. Texte proposé : « Vous ne serez plus amis et ne pourrez plus échanger de messages ni recevoir de notifications liées à cet utilisateur. Maxime n'en sera pas averti(e). Tu pourras revenir sur ce blocage à tout moment. » Il faut conserver un texte court, sans multiplier les précisions inutiles. Critère de recette : reproduire ce parcours sur iOS et Android, vérifier la lisibilité, la persistance des choix et le retour vers l’écran d’origine. Si une ancienne formulation diffère d’une règle arbitrée au 23 octobre, appliquer cette règle arbitrée, non la formulation historique.", "difficulty": "difficile"}, {"id": 150, "cat": "Socle / Design System", "title": "Adaptation des accords au genre renseigné par l’utilisateur", "explanation": "Fenêtres de confirmation et messages personnalisés Lorsqu'un message fait référence nominativement à un utilisateur, il serait souhaitable d'adapter les accords grammaticaux au genre renseigné dans son profil, lorsque cette information existe. Par exemple : - Genre masculin : « Maxime n'en sera pas averti. » - Genre féminin : « Maxime n'en sera pas avertie. » - Genre non renseigné : « Maxime n'en sera pas averti(e). » Cette règle pourrait être généralisée à l'ensemble des messages personnalisés de WYLO. L'objectif est d'éviter les formulations systématiquement masculines ou les parenthèses inutiles lorsque le genre est déjà connu. Critère de recette : reproduire ce parcours sur iOS et Android, vérifier la lisibilité, la persistance des choix et le retour vers l’écran d’origine. Si une ancienne formulation diffère d’une règle arbitrée au 23 octobre, appliquer cette règle arbitrée, non la formulation historique. Version de consolidation • PWA iOS & Android 053", "difficulty": "moyen"}, {"id": 151, "cat": "Socle / Design System", "title": "Amélioration de la lisibilité des fenêtres de modération sur Android", "explanation": "Fenêtres « Bloquer l'utilisateur » et « Signaler cet utilisateur » Sur Android, les textes explicatifs des fenêtres de modération apparaissent actuellement beaucoup trop petits. Il faut augmenter leur taille pour assurer une lecture confortable, sans avoir à agrandir manuellement l'écran. Cette correction doit être appliquée de manière homogène aux différents dialogues de confirmation de l'application. L'objectif est de privilégier des textes courts, mais suffisamment grands pour être immédiatement lisibles. Critère de recette : reproduire ce parcours sur iOS et Android, vérifier la lisibilité, la persistance des choix et le retour vers l’écran d’origine. Si une ancienne formulation diffère d’une règle arbitrée au 23 octobre, appliquer cette règle arbitrée, non la formulation historique.", "difficulty": "facile"}, {"id": 152, "cat": "Blocage / Signalement", "title": "Suppression du champ « Motif » lors du blocage Fenêtre « Bloquer l'utilisateur » Supprimer intégralement le champ proposant de renseigner un motif de", "explanation": "blocage. Le blocage est une décision personnelle et immédiate, qui ne nécessite aucune justification auprès des administrateurs ou de l'utilisateur concerné. Il est donc inutile de proposer un champ dont le contenu n'a pas vocation à être exploité. La fenêtre de blocage doit uniquement présenter ses conséquences et permettre de confirmer ou d'annuler l’opération. Critère de recette : reproduire ce parcours sur iOS et Android, vérifier la lisibilité, la persistance des choix et le retour vers l’écran d’origine. Si une ancienne formulation diffère d’une règle arbitrée au 23 octobre, appliquer cette règle arbitrée, non la formulation historique.", "difficulty": "difficile"}, {"id": 153, "cat": "Blocage / Signalement", "title": "Conservation du motif facultatif lors d'un signalement", "explanation": "Fenêtre « Signaler cet utilisateur aux administrateurs » Contrairement au blocage, le signalement peut nécessiter des explications destinées aux administrateurs. Il faut donc conserver le champ « Motif », qui permet à l'utilisateur de préciser les raisons de son signalement. Ce champ doit néanmoins rester facultatif. Pour harmoniser la présentation avec les autres formulaires de WYLO, éviter l'accumulation de mentions explicatives entre parenthèses et prévoir un indicateur visuel discret du caractère facultatif du champ. La proposition est d'utiliser une petite étoile rouge, sous réserve d'adopter cette convention de manière cohérente dans l'ensemble de l’application. Critère de recette : reproduire ce parcours sur iOS et Android, vérifier la lisibilité, la persistance des choix et le retour vers l’écran d’origine. Si une ancienne formulation diffère d’une règle arbitrée au 23 octobre, appliquer cette règle arbitrée, non la formulation historique. Bloquer", "difficulty": "difficile"}, {"id": 154, "cat": "Mon Profil / Amitiés", "title": "Scintillement des avatars des utilisateurs bloqués et restriction d'accès à leur profil", "explanation": "Tous les écrans de WYLO — Fiches séances, carrousels de participants et profils utilisateurs Réserver exclusivement l'effet de scintillement, précédemment supprimé des boutons de l'application, aux photos de profil des utilisateurs que l'utilisateur connecté a personnellement bloqués. 1. Scintillement réservé aux utilisateurs bloqués Lorsqu'un utilisateur bloqué apparaît dans une liste de participants à une séance, sa photo de profil doit être entourée du fameux effet de scintillement. Cet effet doit respecter les caractéristiques graphiques déjà définies pour WYLO. Règles impératives : - Le scintillement apparaît uniquement autour des avatars des utilisateurs personnellement bloqués. - Il ne doit jamais apparaître autour des profils des autres utilisateurs, qu'ils soient amis ou non. Version de consolidation • PWA iOS & Android 054", "difficulty": "moyen"}, {"id": 155, "cat": "Mon Profil / Amitiés", "title": "Recherche dans les contenus d’un profil", "explanation": "Permettre la recherche parmi les films et les séances présentés sur un profil utilisateur. Éviter de contraindre à parcourir manuellement des listes potentiellement longues. L’ajout d’un champ de recherche dans une liste développée demeure à débattre, notamment pour les participants d’une séance. Justification et critère de contrôle : ce point figurait dans un cahier de développement antérieur mais n’est pas suffisamment explicité dans les tickets récents. L’examiner dans son écran et son sous-écran, avec un scénario réel et les droits liés au statut de la séance. Si sa formulation antérieure diverge de la décision du 23 octobre, cette dernière prévaut. Signaler", "difficulty": "moyen"}, {"id": 156, "cat": "Mon Profil / Amitiés", "title": "Confirmation des actions sensibles Afficher un cartouche de confirmation avant toute suppression de séance ou de compte, tout blocage et tout", "explanation": "signalement. Présenter clairement les conséquences et offrir une possibilité d’annulation explicite. Justification et critère de contrôle : ce point figurait dans un cahier de développement antérieur mais n’est pas suffisamment explicité dans les tickets récents. L’examiner dans son écran et son sous-écran, avec un scénario réel et les droits liés au statut de la séance. Si sa formulation antérieure diverge de la décision du 23 octobre, cette dernière prévaut. Bloquer Version de consolidation • PWA iOS & Android 055", "difficulty": "difficile"}, {"id": 157, "cat": "Blocage / Signalement", "title": "Conséquences du blocage d’un utilisateur Rompre immédiatement l’amitié réciproque, empêcher les échanges privés et interdire la reconstitution", "explanation": "automatique de la relation. Le blocage ne doit entraîner aucun signalement automatique aux administrateurs et ne doit pas empêcher les deux personnes de participer à une même séance. Justification et critère de contrôle : ce point figurait dans un cahier de développement antérieur mais n’est pas suffisamment explicité dans les tickets récents. L’examiner dans son écran et son sous-écran, avec un scénario réel et les droits liés au statut de la séance. Si sa formulation antérieure diverge de la décision du 23 octobre, cette dernière prévaut. Signaler", "difficulty": "difficile"}, {"id": 158, "cat": "Blocage / Signalement", "title": "Signalement motivé avec blocage automatique Ancienne règle : le signalement produit un blocage automatique et transmet un motif aux administrateurs.", "explanation": "Décision en vigueur : blocage automatique, transmission à l’administration ; motif facultatif, alors qu’aucun motif n’est demandé pour un simple blocage. Justification et critère de contrôle : ce point figurait dans un cahier de développement antérieur mais n’est pas suffisamment explicité dans les tickets récents. L’examiner dans son écran et son sous-écran, avec un scénario réel et les droits liés au statut de la séance. Si sa formulation antérieure diverge de la décision du 23 octobre, cette dernière prévaut. Bloquer", "difficulty": "difficile"}, {"id": 159, "cat": "Blocage / Signalement", "title": "Confidentialité du blocage côté utilisateur bloqué", "explanation": "Ne jamais informer une personne qu’elle a été bloquée, directement ou indirectement. Supprimer notamment tout halo bleu, badge ou message révélant cette décision sur son interface. Justification et critère de contrôle : ce point figurait dans un cahier de développement antérieur mais n’est pas suffisamment explicité dans les tickets récents. L’examiner dans son écran et son sous-écran, avec un scénario réel et les droits liés au statut de la séance. Si sa formulation antérieure diverge de la décision du 23 octobre, cette dernière prévaut. Version de consolidation • PWA iOS & Android 056", "difficulty": "difficile"}, {"id": 160, "cat": "Socle / Design System", "title": "Masquage global des messages d’une même personne bloquée", "explanation": "Dans toute discussion collective de séance, les messages émis par une personne bloquée sont masqués par défaut. Une commande permet de les rendre visibles, puis de les masquer de nouveau. L’état de cette commande est global à la personne bloquée : si ses messages sont affichés dans une conversation, ils deviennent visibles dans toutes les autres discussions de séances communes ; si on les masque dans une conversation, ils sont masqués partout. Cette bascule ne doit pas agir sur les messages d’autres personnes bloquées. Elle ne rétablit ni le profil accessible, ni l’amitié, ni la discussion privée ; elle contrôle seulement la visibilité des interventions du même émetteur dans les fils collectifs. Messageries", "difficulty": "moyen"}, {"id": 161, "cat": "Socle / Design System", "title": "Échanges privés et discussions collectives : deux parcours distincts", "explanation": "Le sous-écran « Échanger » ouvert depuis un profil utilisateur concerne une conversation privée en tête-à-tête. Il se distingue de la discussion collective d’une séance, à laquelle peuvent contribuer les participants et l’exploitant selon les droits définis. L’amitié automatique autorise la messagerie privée tant qu’il n’existe aucun blocage. Dans les fils collectifs, afficher les photos d’expéditeurs, éviter les compteurs et dates redondants et préserver le contexte de séance. L’exploitant WYLO Pro peut intégrer automatiquement la discussion collective des séances qu’il a acceptées, dans les conditions de ses outils professionnels ; ne pas ajouter une notification préalable exigeant sa confirmation. Sous-écran Participants", "difficulty": "difficile"}, {"id": 162, "cat": "Socle / Design System", "title": "Liste complète des participants et champ de recherche à discuter", "explanation": "Depuis le carrousel de participants d’une fiche séance, toucher le nombre de participants ouvre un sous-écran contenant la grille de tous les participants, avec leurs avatars et leur prénom. Pour les séances rassemblant beaucoup de monde, il est envisagé d’ajouter en haut un champ de recherche permettant de retrouver une personne par son nom ou prénom, même si seul le prénom est affiché sous l’avatar. Cette amélioration reste à discuter et à tester sur un volume représentatif. Ne pas imposer un champ volumineux aux petites séances tant que le bénéfice ergonomique n’a pas été vérifié. Discussion collective Version de consolidation • PWA iOS & Android 057", "difficulty": "moyen"}, {"id": 163, "cat": "Messagerie", "title": "Écran secondaire « Messagerie » — Conversations de groupe liées aux séances Actuellement, dans les", "explanation": "messageries de groupe associées à une séance, une indication numérique apparaît sous le titre du film, sous la forme : « X / Y » (un nombre, une barre oblique, puis un autre nombre). La signification de ces chiffres n'est pas immédiatement compréhensible et leur affichage n'apporte aucune information utile à l'utilisateur. Il faut donc supprimer systématiquement cette indication numérique dans toutes les messageries concernées. Cette suppression doit s'appliquer aussi bien à la liste des conversations qu'à l'intérieur des messageries de groupe, partout où ce format apparaît. Conserver uniquement le titre du film et les autres informations réellement utiles à l'identification de la conversation, sans modifier leur présentation. Objectif : alléger l'interface des messageries en supprimant une information numérique peu explicite et inutile, afin de privilégier la lisibilité et la simplicité. À vérifier lors de la recette : le comportement décrit doit respecter l’ensemble des arbitrages finaux du cahier (libellés des sept statuts, absence de tarif inventé, présentation des cinémas, droits selon le rôle). Les versions historiques incompatibles ne doivent pas être implémentées simultanément. Messageries", "difficulty": "facile"}, {"id": 164, "cat": "Mon Profil / Amitiés", "title": "Affichage des photos de profil des expéditeurs dans les messageries", "explanation": "Écran secondaire « Messagerie » — Conversations privées et conversations de groupe Actuellement, les messages reçus sont accompagnés d'une icône de profil générique, au lieu de la véritable photo de profil de l'utilisateur qui les a envoyés. Il faut systématiquement remplacer cette icône générique par la photo de profil de l'expéditeur du message. Comportement attendu : - Chaque message reçu doit être accompagné de la photo de profil de son expéditeur, positionnée à côté de sa bulle de conversation. - Dans les messageries de groupe, chaque message doit afficher la photo de l'utilisateur qui l'a réellement envoyé, afin de permettre d'identifier immédiatement les différents participants. - Les photos doivent adopter le même format circulaire et respecter les mêmes dimensions dans toutes les messageries. - Lorsqu'un utilisateur modifie sa photo de profil, celle-ci doit également être actualisée dans les conversations. - L'icône générique ne doit être utilisée qu'en l'absence de photo de profil renseignée. Objectif : faciliter l'identification des interlocuteurs, notamment dans les conversations de groupe, et renforcer la cohérence visuelle entre les messageries et les profils utilisateurs de WYLO. Préciser l’expéditeur du premier message À vérifier lors de la recette : le comportement décrit doit respecter l’ensemble des arbitrages finaux du cahier (libellés des sept statuts, absence de tarif inventé, présentation des cinémas, droits selon le rôle). Les versions historiques incompatibles ne doivent pas être implémentées simultanément. Discussion collective", "difficulty": "moyen"}, {"id": 165, "cat": "Messagerie", "title": "Messagerie collective de séance Faire apparaître la discussion dans la partie basse de la fiche et permettre les échanges entre participants.", "explanation": "Autoriser également l’exploitant à discuter dès qu’il a accepté la séance, même lorsque le créateur est le seul spectateur. Justification et critère de contrôle : ce point figurait dans un cahier de développement antérieur mais n’est pas suffisamment explicité dans les tickets récents. L’examiner dans son écran et son sous-écran, avec un scénario réel et les droits liés au statut de la séance. Si sa formulation antérieure diverge de la décision du 23 octobre, cette dernière prévaut. Version de consolidation • PWA iOS & Android 058", "difficulty": "facile"}, {"id": 166, "cat": "Socle / Design System", "title": "Masquage réversible des messages d’utilisateurs bloqués", "explanation": "Ancienne règle : affichage réversible par utilisateur bloqué dans chaque discussion. Décision plus récente : conserver une bascule par personne bloquée, mais synchroniser globalement la visibilité de TOUS ses messages dans toutes les discussions de séances communes. Justification et critère de contrôle : ce point figurait dans un cahier de développement antérieur mais n’est pas suffisamment explicité dans les tickets récents. L’examiner dans son écran et son sous-écran, avec un scénario réel et les droits liés au statut de la séance. Si sa formulation antérieure diverge de la décision du 23 octobre, cette dernière prévaut. Version de consolidation • PWA iOS & Android 059", "difficulty": "facile"}, {"id": 167, "cat": "Notifications", "title": "Notifications : événements pertinents et indicateurs", "explanation": "Le fil de notifications concerne la création de séance par des amis, leur participation, l’acceptation, le refus, la confirmation, l’annulation lorsque applicable, les messages, et les événements de salle utiles. Les alertes doivent mener à la séance ou au contenu concerné. Conserver une pastille rouge discrète sur l’avatar Home et sur le bouton Notifications du profil tant que de nouvelles notifications restent à consulter. Ne pas introduire de cloche supplémentaire sur la Home. Éviter les doublons d’alertes pour chaque arrivée : une notification communautaire concernant une même séance peut être enrichie et remontée dans le classement temporel.", "difficulty": "moyen"}, {"id": 168, "cat": "Notifications", "title": "Séance pleine : notification informative aux participants", "explanation": "Lorsque la salle atteint sa capacité maximale, envoyer aux participants une petite notification positive indiquant que la salle est pleine et invitant à arriver suffisamment tôt pour s’installer sereinement. Exemple de formulation à adapter à la charte : « Bravo, la salle est pleine ! Pense à arriver en avance pour trouver une bonne place. » Cette notification concerne la capacité totale atteinte, distincte de la confirmation de séance liée à sa jauge minimale. Ne pas prétendre qu’un emplacement peut être choisi si la politique de placement du cinéma ne le permet pas. Présentation du fil", "difficulty": "facile"}, {"id": 169, "cat": "Notifications", "title": "Notifications T098 et T099 : affichage et suppression à discuter", "explanation": "L’ancien cahier prévoit de présenter les notifications en cartouches occupant toute la largeur utile, sans réserver une colonne permanente au bouton de suppression. Un balayage vers la gauche dévoilerait une petite croix qui doit ensuite être touchée explicitement pour supprimer la notification. Ce comportement n’a pas été confirmé en séance de revue : l’utilisateur ne se souvient pas de son intention initiale. Le conserver sous statut « À débattre », avec une comparaison visuelle et une décision avant implémentation.", "difficulty": "facile"}, {"id": 170, "cat": "Socle / Design System", "title": "Tous les écrans de WYLO — Règle graphique globale Actuellement, la petite pastille rouge signalant un", "explanation": "nouveau message dans la messagerie est entourée d'un fin cercle blanc. Il faut supprimer ce liseré blanc pour ne conserver que la pastille rouge, sans aucun contour. Cette correction doit être appliquée à l'ensemble de l'application, partout où une pastille rouge signale une nouvelle activité : messagerie, notifications, avatar du profil ou tout autre élément concerné. Vérifier également que ce contour blanc n'apparaît dans aucun des différents états de la pastille (affichage initial, interaction, actualisation, etc.). Règle impérative : les pastilles rouges de notification doivent toujours être constituées d'un simple disque rouge, sans bordure, contour, ombre blanche ou cercle décoratif supplémentaire. Objectif : garantir une présentation épurée, discrète et parfaitement homogène des indicateurs de notification dans toute l’application. Version de consolidation • PWA iOS & Android 060", "difficulty": "moyen"}, {"id": 171, "cat": "Notifications", "title": "Notification de création d’une séance Envoyer une notification à tous les amis d’un utilisateur lorsqu’il demande une nouvelle séance. Prévoir un", "explanation": "texte invitant à le rejoindre et un accès direct à la fiche de séance. Justification et critère de contrôle : ce point figurait dans un cahier de développement antérieur mais n’est pas suffisamment explicité dans les tickets récents. L’examiner dans son écran et son sous-écran, avec un scénario réel et les droits liés au statut de la séance. Si sa formulation antérieure diverge de la décision du 23 octobre, cette dernière prévaut.", "difficulty": "facile"}, {"id": 172, "cat": "Notifications", "title": "Notification de participation d’un ami Lorsqu’un utilisateur rejoint une séance existante, prévenir uniquement ses amis qui ne participent pas déjà à", "explanation": "cette séance. Ne pas envoyer d’alerte inutile aux spectateurs déjà inscrits. Justification et critère de contrôle : ce point figurait dans un cahier de développement antérieur mais n’est pas suffisamment explicité dans les tickets récents. L’examiner dans son écran et son sous-écran, avec un scénario réel et les droits liés au statut de la séance. Si sa formulation antérieure diverge de la décision du 23 octobre, cette dernière prévaut.", "difficulty": "facile"}, {"id": 173, "cat": "Notifications", "title": "Regroupement des notifications communautaires", "explanation": "Conserver un seul objet de notification par séance et par destinataire, dont le contenu évolue lorsque plusieurs amis rejoignent la même séance. Éviter la création d’une notification supplémentaire pour chaque arrivée. Justification et critère de contrôle : ce point figurait dans un cahier de développement antérieur mais n’est pas suffisamment explicité dans les tickets récents. L’examiner dans son écran et son sous-écran, avec un scénario réel et les droits liés au statut de la séance. Si sa formulation antérieure diverge de la décision du 23 octobre, cette dernière prévaut.", "difficulty": "facile"}, {"id": 174, "cat": "Notifications", "title": "Reclassement chronologique des notifications", "explanation": "Classer les notifications selon leur événement le plus récent. Lorsqu’une notification existante est enrichie, la replacer automatiquement au sommet du fil. Justification et critère de contrôle : ce point figurait dans un cahier de développement antérieur mais n’est pas suffisamment explicité dans les tickets récents. L’examiner dans son écran et son sous-écran, avec un scénario réel et les droits liés au statut de la séance. Si sa formulation antérieure diverge de la décision du 23 octobre, cette dernière prévaut. Version de consolidation • PWA iOS & Android 061", "difficulty": "facile"}, {"id": 175, "cat": "Mon Profil / Amitiés", "title": "Connexion Apple à ajouter à Google et email WYLO permet déjà une connexion via Google et par email. L’objectif est d’ajouter la connexion au compte", "explanation": "Apple, dans un parcours cohérent avec les autres options et compatible avec la PWA sur les appareils concernés. La consultation libre de WYLO reste possible sans compte. La connexion est déclenchée au premier acte engageant (demander une séance, rejoindre, échanger), et non imposée à chaque ouverture de l’application. Les écrans de connexion et d’inscription doivent rester dans les cartouches WYLO plutôt que rediriger sans nécessité vers une page à l’apparence étrangère.", "difficulty": "moyen"}, {"id": 176, "cat": "Mon Profil / Amitiés", "title": "Champs du compte et contrôles de complétude", "explanation": "Les champs indispensables à une inscription classique comprennent les informations d’identification, les données nécessaires à la gestion de l’âge et l’acceptation des conditions d’utilisation. Les champs facultatifs doivent rester identifiés comme tels ; l’astérisque rouge est réservé à l’obligatoire. Si un utilisateur consulte l’application sans compte ou possède un compte incomplet, il peut continuer à explorer les contenus. Les actes engageants doivent demander uniquement les informations manquantes et reprendre ensuite le parcours en cours sans perte de contexte. Vérifier la sécurité de l’authentification et la validation des mots de passe selon les recommandations actuelles plutôt que figer sans examen d’anciennes contraintes arbitraires de composition. Conditions et confidentialité", "difficulty": "difficile"}, {"id": 177, "cat": "Socle / Design System", "title": "CGU : lecture intégrale et acceptation explicite", "explanation": "Le formulaire d’inscription donne accès au texte complet des conditions générales dans un écran secondaire défilable. L’utilisateur peut le fermer sans les accepter et revenir au formulaire avec ses champs préservés. L’acceptation est une action explicite, dont l’état est affiché dans le formulaire. En cas de refus, ne pas finaliser la création du compte ni effacer silencieusement les données déjà saisies. Accès et authentification", "difficulty": "facile"}, {"id": 178, "cat": "Mon Profil / Amitiés", "title": "Consultation de WYLO sans compte Préserver l’accès libre à l’application sans inscription au lancement. Présenter la connexion ou la création d’un", "explanation": "compte uniquement lorsqu’une action nécessitant une identification est engagée. Version de consolidation • PWA iOS & Android 062", "difficulty": "facile"}, {"id": 179, "cat": "Connexion", "title": "Écrans secondaires de connexion et d’inscription", "explanation": "Afficher les formulaires de connexion et d’inscription dans des cartouches superposés, utilisant les mêmes transitions que les autres écrans secondaires. Éviter toute navigation vers une page extérieure à l’interface WYLO. Justification et critère de contrôle : ce point figurait dans un cahier de développement antérieur mais n’est pas suffisamment explicité dans les tickets récents. L’examiner dans son écran et son sous-écran, avec un scénario réel et les droits liés au statut de la séance. Si sa formulation antérieure diverge de la décision du 23 octobre, cette dernière prévaut.", "difficulty": "moyen"}, {"id": 180, "cat": "Connexion", "title": "Trois méthodes d’authentification Proposer la connexion et l’inscription par Google, Apple ou adresse email. Employer les symboles graphiques", "explanation": "validés et limiter la présentation aux seules informations utiles. Justification et critère de contrôle : ce point figurait dans un cahier de développement antérieur mais n’est pas suffisamment explicité dans les tickets récents. L’examiner dans son écran et son sous-écran, avec un scénario réel et les droits liés au statut de la séance. Si sa formulation antérieure diverge de la décision du 23 octobre, cette dernière prévaut.", "difficulty": "facile"}, {"id": 181, "cat": "Connexion", "title": "Simplification du formulaire de connexion Conserver uniquement les méthodes d’authentification et, pour la connexion classique, les champs email et", "explanation": "mot de passe. Supprimer les textes promotionnels et les champs superflus. Justification et critère de contrôle : ce point figurait dans un cahier de développement antérieur mais n’est pas suffisamment explicité dans les tickets récents. L’examiner dans son écran et son sous-écran, avec un scénario réel et les droits liés au statut de la séance. Si sa formulation antérieure diverge de la décision du 23 octobre, cette dernière prévaut.", "difficulty": "facile"}, {"id": 182, "cat": "Fiche Cinéma", "title": "Fond cinématographique du formulaire de connexion", "explanation": "Conserver une image de film fortement floutée derrière les champs de connexion. Garantir la lisibilité des textes clairs affichés au premier plan. Justification et critère de contrôle : ce point figurait dans un cahier de développement antérieur mais n’est pas suffisamment explicité dans les tickets récents. L’examiner dans son écran et son sous-écran, avec un scénario réel et les droits liés au statut de la séance. Si sa formulation antérieure diverge de la décision du 23 octobre, cette dernière prévaut.", "difficulty": "facile"}, {"id": 183, "cat": "Socle / Design System", "title": "Définition des champs d’inscription Rendre obligatoires le prénom, la date de naissance, l’email, le mot de passe, sa confirmation et l’acceptation", "explanation": "des CGU. Laisser facultatifs le nom, la ville, le sexe et les préférences, avec un astérisque rouge réservé aux champs obligatoires. Version de consolidation • PWA iOS & Android 063", "difficulty": "facile"}, {"id": 184, "cat": "Socle / Design System", "title": "Champ de date de naissance Présenter la date de naissance dans un véritable champ de saisie, aussi visible que ceux du prénom et de", "explanation": "l’email. Éviter sa présentation comme un simple intitulé. Justification et critère de contrôle : ce point figurait dans un cahier de développement antérieur mais n’est pas suffisamment explicité dans les tickets récents. L’examiner dans son écran et son sous-écran, avec un scénario réel et les droits liés au statut de la séance. Si sa formulation antérieure diverge de la décision du 23 octobre, cette dernière prévaut.", "difficulty": "facile"}, {"id": 185, "cat": "Socle / Design System", "title": "Sécurisation et confirmation du mot de passe Imposer un mot de passe d’au moins huit caractères comprenant majuscule, minuscule, chiffre et caractère", "explanation": "spécial. Vérifier la correspondance avec le champ de confirmation. Justification et critère de contrôle : ce point figurait dans un cahier de développement antérieur mais n’est pas suffisamment explicité dans les tickets récents. L’examiner dans son écran et son sous-écran, avec un scénario réel et les droits liés au statut de la séance. Si sa formulation antérieure diverge de la décision du 23 octobre, cette dernière prévaut.", "difficulty": "facile"}, {"id": 186, "cat": "Mon Profil / Amitiés", "title": "Contrôle de complétude du compte Bloquer les actions engageantes lorsque les informations indispensables sont manquantes. Cela concerne", "explanation": "notamment la demande ou la participation à une séance, les échanges privés et les interactions sociales. Justification et critère de contrôle : ce point figurait dans un cahier de développement antérieur mais n’est pas suffisamment explicité dans les tickets récents. L’examiner dans son écran et son sous-écran, avec un scénario réel et les droits liés au statut de la séance. Si sa formulation antérieure diverge de la décision du 23 octobre, cette dernière prévaut. Conditions et confidentialité", "difficulty": "facile"}, {"id": 187, "cat": "Socle / Design System", "title": "Consultation intégrale des CGU Rendre les Conditions générales d’utilisation accessibles depuis le formulaire dans un écran secondaire", "explanation": "contenant le texte complet et défilable. Autoriser sa fermeture sans acceptation. Justification et critère de contrôle : ce point figurait dans un cahier de développement antérieur mais n’est pas suffisamment explicité dans les tickets récents. L’examiner dans son écran et son sous-écran, avec un scénario réel et les droits liés au statut de la séance. Si sa formulation antérieure diverge de la décision du 23 octobre, cette dernière prévaut. Version de consolidation • PWA iOS & Android 064", "difficulty": "facile"}, {"id": 188, "cat": "Socle / Design System", "title": "Gestion de l’acceptation des CGU Afficher clairement l’état « CGU acceptées » après validation. En cas de refus, revenir au formulaire sans", "explanation": "perdre les informations déjà saisies et sans confirmer l’inscription. 03 Home, carrousels et présentation des contenus 8 tickets Justification et critère de contrôle : ce point figurait dans un cahier de développement antérieur mais n’est pas suffisamment explicité dans les tickets récents. L’examiner dans son écran et son sous-écran, avec un scénario réel et les droits liés au statut de la séance. Si sa formulation antérieure diverge de la décision du 23 octobre, cette dernière prévaut. Version de consolidation • PWA iOS & Android 065", "difficulty": "facile"}, {"id": 189, "cat": "Socle / Design System", "title": "Prépayé ne signifie pas débité : distinction Stripe", "explanation": "Pour une demande de séance et une préinscription avant confirmation, « Prépayer » signifie enregistrer et autoriser un moyen de paiement en vue d’un débit ultérieur, sans débit immédiat. Lorsqu’une séance devient confirmée, les engagements autorisés sont traités une seule fois. Pour une inscription après confirmation, le bouton devient « Payer » et correspond à un règlement immédiat. La capacité maximale doit être vérifiée avant confirmation du paiement et aucune double opération ne doit être possible. Tenir compte des éventuelles exigences d’authentification forte, d’expiration de carte et d’échec de débit différé ; le prestataire assure le traitement bancaire, WYLO ne stocke pas les données brutes de carte. Interface de paiement", "difficulty": "difficile"}, {"id": 190, "cat": "Paiements", "title": "Paiement intégré à la charte, sans écran tiers envahissant", "explanation": "Étudier un bloc de paiement intégré directement dans « Demander une séance » et « Rejoindre une séance » à l’aide des composants/API du prestataire, plutôt qu’un écran générique à l’identité visuelle déconnectée de WYLO. L’utilisateur doit pouvoir renseigner ses coordonnées de carte dans une composition compacte et claire, avec la typographie, les marges et les arrondis habituels. Cette personnalisation demeure limitée par les obligations de sécurité et les fonctionnalités réellement offertes par le fournisseur. Il s’agit d’une étude de faisabilité et d’intégration produit, pas d’un développement d’infrastructure bancaire propriétaire. Compléments et contrôles historiques", "difficulty": "difficile"}, {"id": 191, "cat": "Paiements", "title": "Harmonisation graphique de l'écran de paiement", "explanation": "Écran secondaire « Paiement » L'écran de paiement ne respecte actuellement pas les conventions graphiques des autres écrans secondaires de WYLO. En particulier : - Ses angles ne sont pas arrondis comme ceux des autres écrans. - Sa hauteur d'ouverture est différente. - Sa présentation générale donne l'impression d'un composant extérieur à l'application. Il faudrait idéalement que l'écran de paiement adopte exactement les mêmes conventions graphiques que tous les autres écrans secondaires. Cela concerne notamment son rayon d'arrondi, sa hauteur, son positionnement, son animation d'ouverture et de fermeture ainsi que la présentation des contenus. Sous réserve des contraintes techniques éventuelles imposées par le prestataire de paiement, l'objectif est que l'utilisateur ait le sentiment de rester dans l'environnement WYLO tout au long de l’opération. Critère de recette : reproduire ce parcours sur iOS et Android, vérifier la lisibilité, la persistance des choix et le retour vers l’écran d’origine. Si une ancienne formulation diffère d’une règle arbitrée au 23 octobre, appliquer cette règle arbitrée, non la formulation historique. Version de consolidation • PWA iOS & Android 066", "difficulty": "difficile"}, {"id": 192, "cat": "Paiements", "title": "Harmonisation des boutons de paiement selon le statut de la séance", "explanation": "Écrans secondaires « Demander une séance », « Rejoindre une séance » et tous les parcours de réservation de WYLO Harmoniser les intitulés des boutons rouges situés à la fin des formulaires de réservation. Seuls deux intitulés doivent désormais être utilisés : « Prépayer » et « Payer ». Le choix dépend de l'action effectuée et du statut de confirmation de la séance. 1. Lorsqu'un utilisateur demande une nouvelle séance Le bouton rouge situé à la fin du formulaire doit systématiquement afficher : « Prépayer » Une nouvelle demande de séance n'étant pas encore confirmée, il s'agit nécessairement d'un prépaiement. 2. Lorsqu'un utilisateur rejoint une séance existante Le texte du bouton rouge dépend de l'état de la séance : - Séance en cours de confirmation : « Prépayer » - Séance confirmée : « Payer » Le libellé doit automatiquement correspondre au statut réel de la séance au moment de l'opération. 3. Application de cette convention dans toute l'application Cette règle doit être appliquée systématiquement à tous les boutons de validation des opérations de réservation ou de paiement, y compris lors de la modification du nombre de billets. Supprimer les formulations actuelles telles que « Valider », « Modifier ses billets et payer » ou tout autre intitulé plus long lorsqu'il s'agit de déclencher une opération de paiement. Règle impérative : les boutons rouges concernés doivent uniquement afficher « Prépayer » ou « Payer », sans texte supplémentaire. 4. Récapitulatif des comportements | Situation | Bouton | | ---------------------------------------------------------------- | ------------ | | Demander une nouvelle séance | Prépayer | | Rejoindre une séance en cours de confirmation | Prépayer | | Rejoindre une séance confirmée | Payer | | Modifier une réservation sur une séance en cours de confirmation | Prépayer | | Modifier une réservation sur une séance confirmée | Payer | Objectif : adopter une convention unique, courte et immédiatement compréhensible, permettant à l'utilisateur de distinguer clairement un prépaiement d'un paiement sur une séance déjà confirmée. Préciser le comportement au changement de statut À vérifier lors de la recette : le comportement décrit doit respecter l’ensemble des arbitrages finaux du cahier (libellés des sept statuts, absence de tarif inventé, présentation des cinémas, droits selon le rôle). Les versions historiques incompatibles ne doivent pas être implémentées simultanément.", "difficulty": "difficile"}, {"id": 193, "cat": "Paiements", "title": "Harmonisation des boutons de paiement et gestion des changements de statut", "explanation": "Écrans secondaires « Demander une séance », « Rejoindre une séance », « Modifier mes billets » — Règle fonctionnelle globale Harmoniser les intitulés des boutons rouges de paiement selon le statut de la séance, et prévoir leur actualisation automatique lorsque ce statut évolue. 1. Intitulés des boutons selon la situation Seuls deux intitulés doivent être utilisés : | Situation | Bouton | | ------------------------------------------------------ | ------------ | | Demander une nouvelle séance | Prépayer | | Rejoindre une séance en cours de confirmation | Prépayer | | Rejoindre une séance confirmée | Payer | | Modifier mes billets — séance en cours de confirmation | Prépayer | | Modifier mes billets — séance confirmée | Payer | Ces boutons ne doivent comporter aucun texte supplémentaire. 2. Comportement lors du passage d'une séance en cours de confirmation à une séance confirmée Lorsqu'une séance atteint sa jauge minimale et devient confirmée, plusieurs changements doivent intervenir automatiquement : - Le statut « Séance en cours de confirmation » devient « Séance confirmée ». - Les préinscriptions existantes deviennent des inscriptions. - Le bouton « Prépayer » devient « Payer » pour les utilisateurs souhaitant rejoindre cette séance. - Les utilisateurs déjà préinscrits conservent leur réservation et n'ont pas à recommencer leur inscription. - Les opérations financières déjà effectuées doivent être prises en compte : aucun deuxième paiement ne doit être demandé pour une même réservation déjà réglée ou prépayée. Version de consolidation • PWA iOS & Android 067", "difficulty": "difficile"}, {"id": 194, "cat": "Demander une séance", "title": "bancaires Écrans « Demander une séance », « Rejoindre une séance », « Modifier mes billets » et parcours de", "explanation": "paiement — Règle fonctionnelle globale Harmoniser le fonctionnement des paiements et prépaiements dans WYLO, notamment lors de la confirmation d'une séance, tout en prévoyant les situations exceptionnelles dans lesquelles la carte bancaire enregistrée risque d'expirer avant la date limite de confirmation. 1. Principe fondamental : WYLO n'encaisse pas directement les paiements WYLO utilise un prestataire de paiement permettant notamment d'enregistrer une carte bancaire sans la débiter immédiatement. L'application ne doit jamais conserver elle-même les coordonnées bancaires complètes ni encaisser directement les fonds. Deux opérations doivent être distinguées : - Prépayer : enregistrer un moyen de paiement et l'accord nécessaire à un règlement futur, sans débit immédiat. - Payer : déclencher le règlement d'une réservation pour une séance déjà confirmée. Dans le fonctionnement normal de WYLO, aucun paiement n'est déclenché tant que la séance n'est pas confirmée. 2. Harmonisation des boutons rouges Les boutons de fin de formulaire doivent respecter les conventions suivantes : | Situation | Bouton | | --------------------------------------------- | -------- | | Demander une nouvelle séance | Prépayer | | Rejoindre une séance en cours de confirmation | Prépayer | | Rejoindre une séance confirmée | Payer | | Modifier mes billets avant confirmation | Prépayer | | Modifier mes billets après confirmation | Payer | Aucun autre intitulé ne doit être utilisé pour ces actions principales. 3. Fonctionnement normal du prépaiement Lorsqu'un utilisateur demande ou rejoint une séance en cours de confirmation : 1. Il sélectionne le nombre de places souhaitées. 2. WYLO calcule le montant correspondant. 3. Il clique sur « Prépayer ». 4. Le prestataire de paiement enregistre sa carte bancaire et son accord pour le règlement ultérieur. 5. WYLO enregistre sa préinscription. 6. Aucun montant n'est débité. L'utilisateur dispose ainsi d'une préinscription, avec un moyen de paiement enregistré pour le règlement futur de ses places. Il doit être clairement informé que le débit interviendra uniquement si la séance est confirmée. 4. Passage automatique à une séance confirmée Lorsque la séance atteint sa jauge minimale et que sa confirmation est effective : - Le statut « Séance en cours de confirmation » devient « Séance confirmée ». - Les préinscriptions deviennent des inscriptions. - Le prestataire déclenche le paiement à partir du moyen de paiement précédemment enregistré, sous réserve des autorisations nécessaires. - L'utilisateur n'a pas à recommencer sa réservation ni à ressaisir sa carte si le paiement peut être effectué automatiquement. - Le bouton proposé aux nouveaux participants passe de « Prépayer » à « Payer ». Le statut de la séance et celui du paiement doivent cependant rester distincts. Si un débit échoue, la séance demeure confirmée, mais la réservation concernée doit être signalée comme étant en attente de régularisation. Aucun double débit ne doit pouvoir intervenir. 5. Cas particulier : carte expirant avant la date limite de confirmation Il peut arriver qu'un utilisateur souhaite se préinscrire à une séance dont la date limite de confirmation est postérieure à la date d'expiration de sa carte bancaire. Exemple : - Nous sommes en octobre. - La carte bancaire de l'utilisateur expire en novembre. - La séance demandée pourra rester en cours de confirmation jusqu'en décembre. Dans cette situation, le moyen de paiement enregistré risque de ne plus être Version de consolidation • PWA iOS & Android 068", "difficulty": "difficile"}, {"id": 195, "cat": "Fiche Cinéma", "title": "Deux catalogues de cinémas selon le contexte Dans « Modifier mon compte », la liste est fondée sur un référentiel NATIONAL des établissements, de", "explanation": "préférence officiel, afin que l’utilisateur puisse enregistrer son cinéma habituel même s’il ne travaille pas encore avec WYLO. Dans « Demander une séance », la liste est strictement limitée aux cinémas PARTENAIRES éligibles. Chaque établissement conserve un identifiant unique et stable. Lorsqu’il rejoint WYLO Pro, son compte exploitant est rattaché à la fiche déjà existante, sans doublon. Un cinéma national non partenaire présente un visuel générique et la mention « Pas encore partenaire de WYLO ». Les filtres de recherche et les fiches cinémas doivent distinguer clairement la présence dans l’annuaire et la possibilité effective de demander une séance.", "difficulty": "moyen"}, {"id": 196, "cat": "Fiche Cinéma", "title": "Communes INSEE et cinémas officiels, saisie assistée", "explanation": "Les villes doivent être sélectionnées dans une base nationale des communes avec autocomplétion, et non enregistrées en texte libre. Le nom, le code postal éventuellement multiple et le code INSEE doivent être distingués ; les homonymes doivent pouvoir être départagés. Les cinémas du compte suivent un catalogue national distinct des comptes WYLO Pro, avec recherche tolérante aux variations de noms et affichage du nom et de la ville. La fiche cinéma peut être enrichie ultérieurement par l’exploitant sans perte des préférences précédemment enregistrées. Utiliser la même identité pour statistiques, recherche et relations utilisateurs, en respectant le statut partenaire/non partenaire. Genres cinématographiques", "difficulty": "moyen"}, {"id": 197, "cat": "Fiche Cinéma", "title": "Nomenclature unique des genres cinématographiques", "explanation": "Utiliser les mêmes catégories de genres pour l’indexation des films, leur affichage et leur filtrage. Éviter les correspondances incohérentes entre les différentes interfaces. Justification et critère de contrôle : ce point figurait dans un cahier de développement antérieur mais n’est pas suffisamment explicité dans les tickets récents. L’examiner dans son écran et son sous-écran, avec un scénario réel et les droits liés au statut de la séance. Si sa formulation antérieure diverge de la décision du 23 octobre, cette dernière prévaut. Version de consolidation • PWA iOS & Android 070", "difficulty": "facile"}, {"id": 198, "cat": "Socle / Design System", "title": "Point ouvert : écran secondaire de participants et recherche", "explanation": "L’affichage de la grille complète des participants, accessible par le nombre d’inscrits sur une séance, est prévu. Il reste à valider si un champ de recherche par prénom ou nom doit apparaître au-dessus de cette grille, notamment lorsque de nombreux utilisateurs sont réunis. Prévoir une maquette avec listes courte et longue. La décision ne doit pas être présentée comme un ticket de développement définitivement validé.", "difficulty": "moyen"}, {"id": 199, "cat": "Notifications", "title": "Point ouvert : présentation et suppression des notifications T098–T099", "explanation": "L’ancien cahier prévoit des cartes pleine largeur et un geste de balayage à gauche dévoilant une croix de suppression. Le fonctionnement exact et son intérêt ergonomique ne sont plus identifiés par l’équipe. Conserver le sujet dans cette rubrique pour discussion et test comparatif. Il ne faut pas modifier le fonctionnement actuellement satisfaisant sans validation. Compatibilité et recettes", "difficulty": "facile"}, {"id": 200, "cat": "Socle / Design System", "title": "Point à vérifier : rendu plein écran edge-to-edge", "explanation": "Le ticket historique T109 désigne le maintien du mode plein écran de la PWA : éviter le retour intempestif des barres système lors d’un changement de vue ou du retour depuis un profil ou une fiche séance. Vérifier ce comportement sur iOS et Android. Il ne s’agit pas d’ajouter du contenu fonctionnel, mais de confirmer que la navigation respecte les zones de sécurité et l’intégration plein écran offerte par chaque plateforme.", "difficulty": "difficile"}, {"id": 201, "cat": "Socle / Design System", "title": "Tous les écrans — Tests fonctionnels Android et iPhone Après intégration de la nouvelle segmentation,", "explanation": "effectuer une vérification complète des différents scénarios. Scénario A — Demande nouvellement créée Un utilisateur demande une séance. Résultat attendu : - Statut « Séance demandée ». - Aucune jauge de progression. - Possibilité de se préinscrire. - Bouton « Prépayer ». - Conservation des préinscriptions dans la base de données. Scénario B — Plusieurs préinscriptions avant acceptation Plusieurs spectateurs rejoignent la demande. Résultat attendu : - Le nombre de préinscrits augmente. - Les avatars apparaissent. - Les relations d'amitié correspondantes sont créées automatiquement et réciproquement. - Aucune barre de progression n'apparaît encore. Scénario C — Acceptation avec jauge non atteinte L'exploitant accepte la demande et fixe une jauge supérieure au nombre de places déjà préinscrites. Résultat attendu : - Statut « Séance en cours de confirmation ». - Apparition de la barre de progression. - Calcul exact de la progression. - Conservation des préinscriptions. - Maintien du bouton « Prépayer ». Scénario D — Acceptation avec jauge déjà atteinte L'exploitant accepte une demande disposant déjà d'un nombre suffisant de préinscrits. Résultat attendu : - Version de consolidation • PWA iOS & Android 071", "difficulty": "facile"}, {"id": 202, "cat": "Notifications", "title": "Cartouches de notifications pleine largeur", "explanation": "Utiliser toute la largeur disponible pour chaque notification, avec les grands angles arrondis WYLO. Supprimer la colonne permanente réservée à la suppression. Ce geste et cette présentation sont à débattre ; leur absence de l’interface actuelle ne constitue pas à elle seule une anomalie. Justification et critère de contrôle : ce point figurait dans un cahier de développement antérieur mais n’est pas suffisamment explicité dans les tickets récents. L’examiner dans son écran et son sous-écran, avec un scénario réel et les droits liés au statut de la séance. Si sa formulation antérieure diverge de la décision du 23 octobre, cette dernière prévaut.", "difficulty": "facile"}, {"id": 203, "cat": "Notifications", "title": "Suppression des notifications par balayage", "explanation": "Permettre de faire glisser une notification vers la gauche pour révéler un petit bouton circulaire avec une croix. Exécuter la suppression uniquement après un toucher sur cette croix, et non dès le balayage. Ce geste et cette présentation sont à débattre ; leur absence de l’interface actuelle ne constitue pas à elle seule une anomalie. Justification et critère de contrôle : ce point figurait dans un cahier de développement antérieur mais n’est pas suffisamment explicité dans les tickets récents. L’examiner dans son écran et son sous-écran, avec un scénario réel et les droits liés au statut de la séance. Si sa formulation antérieure diverge de la décision du 23 octobre, cette dernière prévaut. Compatibilité et recettes", "difficulty": "facile"}, {"id": 204, "cat": "Socle / Design System", "title": "Maintien du mode plein écran Contrôler le rendu edge-to-edge et l’absence de réapparition des barres système lors des changements de vue.", "explanation": "Vérifier notamment le retour depuis les fiches de films, de séances et les profils. 12 Edge-to-edge désigne ici l’absence de barres système qui réapparaissent lors de la navigation ; vérifier sans imposer un comportement interdit par iOS. Justification et critère de contrôle : ce point figurait dans un cahier de développement antérieur mais n’est pas suffisamment explicité dans les tickets récents. L’examiner dans son écran et son sous-écran, avec un scénario Version de consolidation • PWA iOS & Android 072", "difficulty": "moyen"}];
let allVotes=[], allComments=[], customTickets=[];

function getUserName(){return localStorage.getItem('wylo_user_name')||'';}
function setUserName(n){localStorage.setItem('wylo_user_name', n.trim());}

async function loadData(){
  const [v,c,ct] = await Promise.all([
    supabaseClient.from('wylo_votes').select('*'),
    supabaseClient.from('wylo_comments').select('*').order('created_at',{ascending:true}),
    supabaseClient.from('wylo_custom_tickets').select('*').order('created_at',{ascending:true})
  ]);
  if(v.error){document.getElementById('connStatus').textContent='● Erreur: '+v.error.message; document.getElementById('connStatus').style.color='#FF3B30'; console.error(v.error); return;}
  allVotes=v.data||[]; allComments=c.data||[]; customTickets=ct.data||[];
  document.getElementById('connStatus').textContent='● Connecté en temps réel - '+allVotes.length+' votes, '+allComments.length+' commentaires, '+customTickets.length+' tickets ajoutés';
  render();
}
function getAllTickets(){const base=baseTickets.map(t=>({...t, isCustom:false})); const custom=customTickets.map(t=>({id:1000+t.id, realId:t.id, cat:t.cat, title:t.title, explanation:t.explanation, difficulty:t.difficulty, isCustom:true, created_by:t.created_by})); return [...base, ...custom];}
function getVotesForTicket(id){return allVotes.filter(v=>v.ticket_id===id);}
function getCommentsForTicket(id){return allComments.filter(c=>c.ticket_id===id);}
const cats=[...new Set(baseTickets.map(t=>t.cat))].sort(); const sel=document.getElementById('filterCat'); cats.forEach(c=>{const o=document.createElement('option');o.value=c;o.textContent=c;sel.appendChild(o);});
async function addVote(ticketId, type, value){
  const user=getUserName(); if(!user){alert('Renseigne ton prénom en haut');return;}
  await supabaseClient.from('wylo_votes').delete().eq('ticket_id', ticketId).eq('user_name', user).eq('vote_type', type);
  await supabaseClient.from('wylo_votes').insert({ticket_id:ticketId, user_name:user, vote_type:type, vote_value:value});
}
async function addComment(ticketId, text){
  const user=getUserName(); if(!user){alert('Renseigne ton prénom');return;} if(!text.trim()) return;
  await supabaseClient.from('wylo_comments').insert({ticket_id:ticketId, user_name:user, text:text.trim()});
}
async function addCustomTicket(title, cat, expl, diff, statut){
  const user=getUserName();
  const {data, error} = await supabaseClient.from('wylo_custom_tickets').insert({title, cat, explanation:expl, difficulty:diff, created_by:user}).select().single();
  if(error){alert(error.message);return;}
  await supabaseClient.from('wylo_votes').insert([{ticket_id:1000+data.id, user_name:user, vote_type:'status', vote_value:statut},{ticket_id:1000+data.id, user_name:user, vote_type:'difficulty', vote_value:diff}]);
}
function render(){
  const allTickets=getAllTickets();
  const q=document.getElementById('search').value.toLowerCase();
  const cat=document.getElementById('filterCat').value;
  const prioF=document.getElementById('filterPrio').value;
  const diffF=document.getElementById('filterDiff').value;
  const grid=document.getElementById('grid');grid.innerHTML='';
  let filtered=allTickets.filter(t=>{
    const comments=getCommentsForTicket(t.id).map(c=>c.text+' '+c.user_name).join(' ');
    const hay=(t.title+' '+t.explanation+' '+t.cat+' '+comments).toLowerCase();
    const mq=!q||hay.includes(q);
    const mc=!cat||t.cat===cat;
    const votes=getVotesForTicket(t.id);
    let hasStat=true; if(prioF){hasStat=votes.some(v=>v.vote_type==='status'&&v.vote_value===prioF);}
    let hasDiff=true; if(diffF){hasDiff=votes.some(v=>v.vote_type==='difficulty'&&v.vote_value===diffF) || (votes.filter(v=>v.vote_type==='difficulty').length===0 && t.difficulty===diffF);}
    return mq&&mc&&hasStat&&hasDiff;
  });
  const counts={'1':0,'2':0,'3':0,'0':0};const diffCounts={'facile':0,'moyen':0,'difficile':0};
  allVotes.forEach(v=>{if(v.vote_type==='status') counts[v.vote_value]=(counts[v.vote_value]||0)+1; else diffCounts[v.vote_value]=(diffCounts[v.vote_value]||0)+1;});
  document.getElementById('stats').innerHTML='<div>Total : '+allTickets.length+' ('+baseTickets.length+' de base + '+customTickets.length+' ajoutés)</div><div>Filtres : '+filtered.length+'</div><div style="color:#30D158">A implémenter : '+(counts['1']||0)+' votes</div><div style="color:#FF9500">A reporter : '+(counts['2']||0)+'</div><div style="color:#FF3B30">A supprimer : '+(counts['3']||0)+'</div><div style="margin-left:12px;border-left:1px solid #E8E8ED;padding-left:12px">Facile : '+(diffCounts['facile']||0)+' | Moyen : '+(diffCounts['moyen']||0)+' | Difficile : '+(diffCounts['difficile']||0)+'</div>';
  filtered.forEach(t=>{
    const votes=getVotesForTicket(t.id);
    const user=getUserName();
    const userStatus=votes.find(v=>v.vote_type==='status'&&v.user_name===user)?.vote_value;
    const userDiff=votes.find(v=>v.vote_type==='difficulty'&&v.user_name===user)?.vote_value;
    const pClass=userStatus||'0';
    const comments=getCommentsForTicket(t.id);
    const card=document.createElement('div');card.className='card';
    card.style.borderLeft='6px solid '+(pClass==='1'?'#30D158':pClass==='2'?'#FF9500':pClass==='3'?'#FF3B30':'#E8E8ED');
    if(t.isCustom) card.classList.add('custom');
    card.innerHTML='<div style="position:absolute;top:14px;right:16px;font-size:13px;font-weight:800">#'+String(t.id).padStart(3,'0')+'</div><div style="display:flex;gap:6px;flex-wrap:wrap">'+(t.isCustom?'<span class="chip custom-chip">Ajouté par '+t.created_by+'</span>':'')+'<span class="chip cat-chip">'+t.cat+'</span></div><div class="title">'+t.title+'</div><div class="explanation">'+t.explanation+'</div><div class="prio-row"><label>Statut :</label></div><div class="diff-row"><label>Difficulté :</label></div><div class="comment-area"><label>Commentaires :</label><div class="comments-list"></div><div class="comment-form" style="display:flex;gap:8px"><input placeholder="Ajouter un commentaire..."><button class="btn" style="background:#111;color:white;padding:8px 14px">Publier</button></div></div>';
    const prioRow=card.querySelector('.prio-row');
    [['1','A implémenter','p1'],['2','A reporter','p2'],['3','A supprimer','p3'],['0','A trier','p0']].forEach(([val,label,cls])=>{
      const count=votes.filter(v=>v.vote_type==='status'&&v.vote_value===val).length;
      const users=votes.filter(v=>v.vote_type==='status'&&v.vote_value===val).map(v=>v.user_name).join(', ');
      const active=userStatus===val;
      const btn=document.createElement('button');btn.className='prio-btn '+cls+(active?' active':'');btn.innerHTML=label+' <span class="vote-badge">'+count+'</span>';btn.title=users;
      btn.addEventListener('click',()=>addVote(t.id,'status',val));prioRow.appendChild(btn);
    });
    const diffRow=card.querySelector('.diff-row');
    [['facile','Facile','facile'],['moyen','Moyen','moyen'],['difficile','Difficile','difficile']].forEach(([val,label,cls])=>{
      const count=votes.filter(v=>v.vote_type==='difficulty'&&v.vote_value===val).length;
      const users=votes.filter(v=>v.vote_type==='difficulty'&&v.vote_value===val).map(v=>v.user_name).join(', ');
      const active=userDiff===val;
      const btn=document.createElement('button');btn.className='diff-btn '+cls+(active?' active':'');btn.innerHTML=label+' <span class="vote-badge">'+count+'</span>';btn.title=users;
      btn.addEventListener('click',()=>addVote(t.id,'difficulty',val));diffRow.appendChild(btn);
    });
    const clist=card.querySelector('.comments-list');
    if(comments.length===0){clist.innerHTML='<div style="font-size:11px;color:#999">Aucun commentaire</div>';}
    else{comments.forEach(c=>{const div=document.createElement('div');div.className='comment-item';div.innerHTML='<div class="c-meta"><span>'+c.user_name+'</span><span>'+new Date(c.created_at).toLocaleString('fr-FR')+'</span></div><div>'+c.text+'</div>';clist.appendChild(div);});}
    const input=card.querySelector('.comment-form input');
    const btn=card.querySelector('.comment-form button');
    btn.addEventListener('click',async()=>{await addComment(t.id, input.value);input.value='';});
    input.addEventListener('keydown',async(e)=>{if(e.key==='Enter'){await addComment(t.id, input.value);input.value='';}});
    grid.appendChild(card);
  });
}
document.getElementById('search').addEventListener('input',render);
document.getElementById('filterCat').addEventListener('change',render);
document.getElementById('filterPrio').addEventListener('change',render);
document.getElementById('filterDiff').addEventListener('change',render);
document.getElementById('saveUserBtn').addEventListener('click',()=>{const v=document.getElementById('userNameInput').value.trim();if(v){setUserName(v);document.getElementById('userNameDisplay').textContent='Connecté en tant que '+v;render();}});
document.getElementById('userNameInput').addEventListener('keydown',(e)=>{if(e.key==='Enter'){const v=e.target.value.trim();if(v){setUserName(v);document.getElementById('userNameDisplay').textContent='Connecté en tant que '+v;render();}}});
document.getElementById('addBtn').addEventListener('click',()=>{if(!getUserName()){alert('Renseigne ton prénom en haut');return;}document.getElementById('modalOverlay').style.display='flex';});
document.getElementById('cancelBtn').addEventListener('click',()=>{document.getElementById('modalOverlay').style.display='none';});
document.getElementById('modalOverlay').addEventListener('click',(e)=>{if(e.target===document.getElementById('modalOverlay')){document.getElementById('modalOverlay').style.display='none';}});
document.getElementById('saveBtn').addEventListener('click',async()=>{const title=document.getElementById('newTitle').value.trim();const cat=document.getElementById('newCat').value;const expl=document.getElementById('newExpl').value.trim();const diff=document.getElementById('newDiff').value;const statut=document.getElementById('newStatut').value;if(!title||!expl){alert('Titre et explication obligatoires');return;}await addCustomTicket(title, cat, expl, diff, statut);document.getElementById('newTitle').value='';document.getElementById('newExpl').value='';document.getElementById('modalOverlay').style.display='none';});
document.getElementById('csvBtn').addEventListener('click',()=>{const all=getAllTickets();let csv='ID,Categorie,Titre,Statut votes,Difficulte votes,Commentaires\n';all.forEach(t=>{const votes=getVotesForTicket(t.id);const statusStr=votes.filter(v=>v.vote_type==='status').map(v=>v.vote_value+':'+v.user_name).join('|');const diffStr=votes.filter(v=>v.vote_type==='difficulty').map(v=>v.vote_value+':'+v.user_name).join('|');const comments=getCommentsForTicket(t.id).map(c=>c.user_name+':'+c.text).join('|');const row=[t.id,'"'+t.cat.replace(/"/g,'""')+'"','"'+t.title.replace(/"/g,'""')+'"','"'+statusStr.replace(/"/g,'""')+'"','"'+diffStr.replace(/"/g,'""')+'"','"'+comments.replace(/"/g,'""')+'"'].join(',');csv+=row+'\n';});const blob=new Blob([csv],{type:'text/csv'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='WYLO_tickets.csv';a.click();});
(function(){const name=getUserName(); if(name){document.getElementById('userNameInput').value=name;document.getElementById('userNameDisplay').textContent='Connecté en tant que '+name;}})();
loadData();
supabaseClient.channel('wylo').on('postgres_changes',{event:'*',schema:'public',table:'wylo_votes'},()=>loadData()).on('postgres_changes',{event:'*',schema:'public',table:'wylo_comments'},()=>loadData()).on('postgres_changes',{event:'*',schema:'public',table:'wylo_custom_tickets'},()=>loadData()).subscribe();
</script>
